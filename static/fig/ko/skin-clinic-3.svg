<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 488" role="img" aria-label="외국어로 도움받을 곳" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>외국어로 도움받을 곳</title>
