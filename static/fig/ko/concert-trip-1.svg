<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 654" role="img" aria-label="해외에서 K팝 티켓 사기" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>해외에서 K팝 티켓 사기</title>
<rect width="400" height="654" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">해외에서 K팝 티켓 사기</text>
<rect x="16" y="58" width="368" height="94" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="70" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="94" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="80" y="92" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">소속사 공지 확인</text>
<text x="80" y="114" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">그 공연을 파는 사이트가 한 곳 나와</text>
<text x="80" y="136" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">있어요</text>
<line x1="48" y1="153" x2="48" y2="163" stroke="#16151a" stroke-width="2.5"/>
<path d="M41,161 L48,171 L55,161 z" fill="#16151a"/>
<rect x="16" y="172" width="368" height="94" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="184" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="208" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="80" y="206" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">글로벌 사이트에 가입</text>
<text x="80" y="228" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">흔히 NOL World(world.nol.com). 한국</text>
<text x="80" y="250" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">계정과 별도</text>
<line x1="48" y1="267" x2="48" y2="277" stroke="#16151a" stroke-width="2.5"/>
<path d="M41,275 L48,285 L55,275 z" fill="#16151a"/>
<rect x="16" y="286" width="368" height="94" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="298" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="322" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="80" y="320" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">여권 인증</text>
<text x="80" y="342" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">&quot;Verified Member Only&quot; 공연은 먼저</text>
<text x="80" y="364" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">인증</text>
<line x1="48" y1="381" x2="48" y2="391" stroke="#16151a" stroke-width="2.5"/>
<path d="M41,389 L48,399 L55,389 z" fill="#16151a"/>
<rect x="16" y="400" width="368" height="94" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="412" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="436" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="80" y="434" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">여권 이름으로 예매</text>
<text x="80" y="456" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">로마자 철자 그대로. 매수 제한은</text>
<text x="80" y="478" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">공연마다 달라요</text>
<line x1="48" y1="495" x2="48" y2="505" stroke="#16151a" stroke-width="2.5"/>
<path d="M41,503 L48,513 L55,503 z" fill="#16151a"/>
<rect x="16" y="514" width="368" height="72" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="526" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="550" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="80" y="548" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">현장 수령</text>
<text x="80" y="570" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">실물 신분증 + 예매 확인. 예매자 본인만</text>
<rect x="16" y="598" width="368" height="38" rx="10" fill="#e9e2d3" stroke="#b8392f" stroke-width="2"/>
<text x="30" y="624" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">되팔이 표는 받지 마세요</text>
</svg>
