<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 585" role="img" aria-label="교통카드 vs 1회용 승차권(어른)" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>교통카드 vs 1회용 승차권(어른)</title>
<rect width="400" height="585" rx="16" fill="#f4f0e6"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16151a"/></marker></defs>
<text x="20" y="39" font-size="21" fill="#16151a" font-weight="bold" text-anchor="start">교통카드 vs 1회용 승차권(어른)</text>
<rect x="16" y="61" width="368" height="506" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<rect x="16" y="62" width="184" height="504" fill="#e9e2d3"/>
<text x="108" y="89" font-size="17" fill="#b8392f" font-weight="bold" text-anchor="middle">티머니·와우패스</text>
<text x="292" y="89" font-size="17" fill="#5f5b55" font-weight="bold" text-anchor="middle">1회용 승차권</text>
<line x1="16" y1="106" x2="384" y2="106" stroke="#c9c1b2" stroke-width="2"/>
<text x="28" y="132" font-size="16" fill="#5f5b55" font-weight="bold" text-anchor="start">기본요금(10km)</text>
<text x="108" y="159" font-size="17" fill="#16151a" font-weight="bold" text-anchor="middle">1,550원</text>
<text x="292" y="159" font-size="17" fill="#16151a" font-weight="bold" text-anchor="middle">1,650원</text>
<line x1="16" y1="177" x2="384" y2="177" stroke="#c9c1b2" stroke-width="2"/>
<text x="28" y="203" font-size="16" fill="#5f5b55" font-weight="bold" text-anchor="start">보증금</text>
<text x="108" y="229" font-size="16" fill="#16151a" text-anchor="middle">—</text>
<text x="292" y="229" font-size="16" fill="#16151a" text-anchor="middle">500원,</text>
<text x="292" y="251" font-size="16" fill="#16151a" text-anchor="middle">나가서 환급</text>
<line x1="16" y1="269" x2="384" y2="269" stroke="#c9c1b2" stroke-width="2"/>
<text x="28" y="295" font-size="16" fill="#5f5b55" font-weight="bold" text-anchor="start">버스 환승 할인</text>
<text x="108" y="321" font-size="16" fill="#16151a" text-anchor="middle">돼요</text>
<text x="108" y="343" font-size="16" fill="#16151a" text-anchor="middle">(30분 안)</text>
<text x="292" y="321" font-size="16" fill="#16151a" text-anchor="middle">안 돼요</text>
<line x1="16" y1="361" x2="384" y2="361" stroke="#c9c1b2" stroke-width="2"/>
<text x="28" y="387" font-size="16" fill="#5f5b55" font-weight="bold" text-anchor="start">쓸 수 있는 곳</text>
<text x="108" y="413" font-size="16" fill="#16151a" text-anchor="middle">지하철·버스</text>
<text x="292" y="413" font-size="16" fill="#16151a" text-anchor="middle">수도권</text>
<text x="292" y="435" font-size="16" fill="#16151a" text-anchor="middle">도시철도만</text>
<line x1="16" y1="453" x2="384" y2="453" stroke="#c9c1b2" stroke-width="2"/>
<text x="28" y="479" font-size="16" fill="#5f5b55" font-weight="bold" text-anchor="start">충전</text>
<text x="108" y="505" font-size="16" fill="#16151a" text-anchor="middle">역 충전기에서</text>
<text x="108" y="527" font-size="16" fill="#16151a" text-anchor="middle">현금</text>
<text x="108" y="549" font-size="16" fill="#5f5b55" text-anchor="middle">(와우패스는 앱도 가능)</text>
<text x="292" y="505" font-size="16" fill="#16151a" text-anchor="middle">탈 때마다</text>
<text x="292" y="527" font-size="16" fill="#16151a" text-anchor="middle">새로 구매</text>
<rect x="16" y="61" width="368" height="506" rx="12" fill="none" stroke="#c9c1b2" stroke-width="2"/>
</svg>
