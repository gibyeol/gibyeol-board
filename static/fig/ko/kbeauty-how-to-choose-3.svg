<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-label="한국 자외선 차단제의 SPF·PA 읽기" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>한국 자외선 차단제의 SPF·PA 읽기</title>
<rect width="720" height="460" fill="#f4f0e6"/>
<rect x="30" y="24" width="320" height="230" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/><text x="54" y="64" font-size="20" fill="#16151a" font-weight="bold" text-anchor="start">SPF = 자외선B</text>
<rect x="54" y="84" width="200" height="56" rx="6" fill="#e9e2d3"/><text x="154" y="122" font-size="28" fill="#16151a" font-weight="bold" text-anchor="middle">SPF50+</text>
<text x="54" y="174" font-size="15" fill="#16151a" font-weight="normal" text-anchor="start"><tspan x="54" dy="0">50까지 숫자로 표시.</tspan><tspan x="54" dy="20">50 초과는 '50+'.</tspan></text>
<rect x="370" y="24" width="320" height="230" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/><text x="394" y="64" font-size="20" fill="#16151a" font-weight="bold" text-anchor="start">PA = 자외선A</text>
<text x="394" y="102" font-size="15" fill="#16151a" font-weight="bold" text-anchor="start">PA+</text>
<rect x="480" y="88" width="40" height="18" rx="3" fill="#5f5b55"/><text x="394" y="136" font-size="15" fill="#16151a" font-weight="bold" text-anchor="start">PA++</text>
<rect x="480" y="122" width="85" height="18" rx="3" fill="#5f5b55"/><text x="394" y="170" font-size="15" fill="#16151a" font-weight="bold" text-anchor="start">PA+++</text>
<rect x="480" y="156" width="130" height="18" rx="3" fill="#5f5b55"/><text x="394" y="204" font-size="15" fill="#16151a" font-weight="bold" text-anchor="start">PA++++</text>
<rect x="480" y="190" width="175" height="18" rx="3" fill="#b8392f"/><text x="394" y="236" font-size="15" fill="#5f5b55" font-weight="normal" text-anchor="start">+가 많을수록 등급이 높아요</text>
<text x="30" y="296" font-size="16" fill="#16151a" font-weight="bold" text-anchor="start">식약처 안내: 하루 일정에 맞춰 고르기</text>
<rect x="30" y="312" width="660" height="42" rx="6" fill="#e9e2d3" stroke="#c9c1b2"/><text x="46" y="339" font-size="15" fill="#16151a" font-weight="normal" text-anchor="start">실내, 짧은 산책</text>
<text x="674" y="339" font-size="15" fill="#16151a" font-weight="bold" text-anchor="end">SPF15 / PA+ 이상</text>
<rect x="30" y="362" width="660" height="42" rx="6" fill="#ffffff" stroke="#c9c1b2"/><text x="46" y="389" font-size="15" fill="#16151a" font-weight="normal" text-anchor="start">등산·해수욕, 오랜 야외</text>
<text x="674" y="389" font-size="15" fill="#16151a" font-weight="bold" text-anchor="end">SPF50+ / PA+++ 또는 PA++++</text>
<text x="30" y="440" font-size="15" fill="#b8392f" font-weight="bold" text-anchor="start">상자에 '기능성화장품' 표시도 같이 확인하세요.</text>
</svg>
