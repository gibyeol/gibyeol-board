<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 715" role="img" aria-label="동쪽 해안의 버스 두 노선" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>동쪽 해안의 버스 두 노선</title>
<rect width="400" height="715" fill="#f4f0e6"/>
<text x="20" y="42" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">동쪽 해안의 버스 두 노선</text>
