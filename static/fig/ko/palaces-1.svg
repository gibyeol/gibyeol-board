<text x="112" y="384" font-size="18" font-weight="700" fill="#b8392f" text-anchor="start">광화문</text>
<text x="112" y="408" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">수문장 교대의식 10:00, 14:00</text>
<text x="112" y="430" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">무료, 관람권 필요 없음</text>
<text x="20" y="456" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">개략도, 축척 아님</text>
