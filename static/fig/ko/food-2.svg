<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 366" role="img" aria-label="주문과 결제, 세 가지 방식" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>주문과 결제, 세 가지 방식</title>
<rect width="400" height="366" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">주문과 결제, 세 가지 방식</text>
<rect x="20" y="60" width="360" height="88" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="36" y="90" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">테이블 태블릿</text>
<text x="36" y="114" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">화면에서 주문</text>
<text x="36" y="136" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">보통 주문할 때 결제</text>
<rect x="20" y="158" width="360" height="66" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="36" y="188" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">입구 키오스크</text>
<text x="36" y="212" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">주문하고 먼저 결제하는 곳이 많아요</text>
<rect x="20" y="234" width="360" height="88" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="36" y="264" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">직원 주문</text>
<text x="36" y="288" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">호출벨 누르기</text>
<text x="36" y="310" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">나가면서 계산대에서 결제</text>
<text x="20" y="348" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">물과 반찬 리필은 무료</text>
</svg>
