<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 364" role="img" aria-label="카드 두 장, 하는 일이 달라요" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>카드 두 장, 하는 일이 달라요</title>
<rect width="400" height="364" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">카드 두 장, 하는 일이 달라요</text>
<rect x="16" y="54" width="368" height="114" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="72" width="64" height="42" rx="6" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<rect x="36" y="82" width="14" height="11" rx="2" fill="#e9e2d3" stroke="#16151a" stroke-width="1.2"/>
<line x1="36" y1="104" x2="80" y2="104" stroke="#c9c1b2" stroke-width="3"/>
<text x="108" y="84" font-size="18" font-weight="700" fill="#b8392f" text-anchor="start">티머니</text>
<text x="108" y="108" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">지하철·버스·공항철도 일반열차를</text>
<text x="108" y="130" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">태그로 결제</text>
<text x="108" y="152" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">공항 카드 발매기·편의점에서 판매</text>
<rect x="16" y="180" width="368" height="114" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="198" width="64" height="42" rx="6" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<rect x="36" y="208" width="14" height="11" rx="2" fill="#e9e2d3" stroke="#16151a" stroke-width="1.2"/>
<line x1="36" y1="230" x2="80" y2="230" stroke="#c9c1b2" stroke-width="3"/>
<text x="108" y="210" font-size="18" font-weight="700" fill="#b8392f" text-anchor="start">WOWPASS</text>
<text x="108" y="234" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">교통용 티머니 내장</text>
<text x="108" y="256" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">외화를 카드에 환전</text>
<text x="108" y="278" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">가게에서 카드로 결제</text>
<text x="20" y="324" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">티머니는 미리 예약해</text>
<text x="20" y="346" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">공항에서 받을 수도 있어요</text>
</svg>
