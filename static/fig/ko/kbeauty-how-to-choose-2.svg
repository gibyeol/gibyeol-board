<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 714" role="img" aria-label="기능별로 고르기" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>기능별로 고르기</title>
<rect width="400" height="714" fill="#f4f0e6"/>
<rect x="20" y="16" width="360" height="44" rx="22" fill="#16151a"/><text x="200" y="44" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">이 제품에 무엇을 기대하나요?</text>
<rect x="20" y="76" width="360" height="38" rx="8" fill="#e9e2d3"/><text x="36" y="105" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">햇빛 차단</text>
<line x1="200" y1="114" x2="200" y2="126" stroke="#16151a" stroke-width="2"/><polygon points="193,124 207,124 200,134" fill="#16151a"/>
<rect x="20" y="136" width="360" height="60" rx="8" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/><text x="36" y="164" font-size="16" fill="#16151a" font-weight="normal" text-anchor="start"><tspan x="36" dy="0">확인: 상자의 SPF·PA와</tspan><tspan x="36" dy="22">'기능성화장품' 표시</tspan></text>
<rect x="20" y="216" width="360" height="38" rx="8" fill="#e9e2d3"/><text x="36" y="245" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">미백·주름 개선</text>
<line x1="200" y1="254" x2="200" y2="266" stroke="#16151a" stroke-width="2"/><polygon points="193,264 207,264 200,274" fill="#16151a"/>
<rect x="20" y="276" width="360" height="60" rx="8" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/><text x="36" y="304" font-size="16" fill="#16151a" font-weight="normal" text-anchor="start"><tspan x="36" dy="0">확인: '기능성화장품' 표시와</tspan><tspan x="36" dy="22">그 기능이 적힌 효능 문구</tspan></text>
<rect x="20" y="356" width="360" height="38" rx="8" fill="#e9e2d3"/><text x="36" y="385" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">향료에 피부가 예민해요</text>
<line x1="200" y1="394" x2="200" y2="406" stroke="#16151a" stroke-width="2"/><polygon points="193,404 207,404 200,414" fill="#16151a"/>
<rect x="20" y="416" width="360" height="60" rx="8" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/><text x="36" y="444" font-size="16" fill="#16151a" font-weight="normal" text-anchor="start"><tspan x="36" dy="0">확인: 전성분의 '향료'와</tspan><tspan x="36" dy="22">알레르기 유발성분 이름</tspan></text>
<rect x="20" y="496" width="360" height="60" rx="8" fill="#e9e2d3"/><text x="36" y="525" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start"><tspan x="36" dy="0">'세포재생' '항염' '바르는 보톡스'</tspan><tspan x="36" dy="22">광고</tspan></text>
<line x1="200" y1="556" x2="200" y2="568" stroke="#b8392f" stroke-width="2"/><polygon points="193,566 207,566 200,576" fill="#b8392f"/>
<rect x="20" y="578" width="360" height="60" rx="8" fill="#ffffff" stroke="#b8392f" stroke-width="2"/><text x="36" y="606" font-size="16" fill="#b8392f" font-weight="bold" text-anchor="start"><tspan x="36" dy="0">거르세요. 화장품은</tspan><tspan x="36" dy="22">의약품이 아니에요</tspan></text>
<text x="200" y="670" font-size="16" fill="#5f5b55" font-weight="normal" text-anchor="middle"><tspan x="200" dy="0">피부 질환이 있거나 처방약을 쓰면</tspan><tspan x="200" dy="22">의사·약사에게 먼저 물어보세요.</tspan></text>
</svg>
