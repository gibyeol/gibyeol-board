<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-label="원하는 기능으로 고르기" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>원하는 기능으로 고르기</title>
<rect width="720" height="560" fill="#f4f0e6"/>
<rect x="160" y="24" width="400" height="48" rx="24" fill="#16151a"/><text x="360" y="54" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">이 제품에 무엇을 기대하나요?</text>
<line x1="360" y1="72" x2="360" y2="94" stroke="#c9c1b2" stroke-width="2"/><rect x="30" y="100" width="270" height="84" rx="8" fill="#e9e2d3"/><text x="165" y="148" font-size="15" fill="#16151a" font-weight="bold" text-anchor="middle">햇빛 차단</text>
<line x1="300" y1="142" x2="390" y2="142" stroke="#16151a" stroke-width="2"/><polygon points="390,135 404,142 390,149" fill="#16151a"/><rect x="408" y="100" width="282" height="84" rx="8" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/><text x="549" y="138" font-size="15" fill="#16151a" font-weight="normal" text-anchor="middle"><tspan x="549" dy="0">상자에 SPF·PA와</tspan><tspan x="549" dy="20">'기능성화장품' 표시</tspan></text>
<rect x="30" y="208" width="270" height="84" rx="8" fill="#e9e2d3"/><text x="165" y="246" font-size="15" fill="#16151a" font-weight="bold" text-anchor="middle"><tspan x="165" dy="0">미백·</tspan><tspan x="165" dy="20">주름 개선</tspan></text>
<line x1="300" y1="250" x2="390" y2="250" stroke="#16151a" stroke-width="2"/><polygon points="390,243 404,250 390,257" fill="#16151a"/><rect x="408" y="208" width="282" height="84" rx="8" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/><text x="549" y="246" font-size="15" fill="#16151a" font-weight="normal" text-anchor="middle"><tspan x="549" dy="0">'기능성화장품' 표시와</tspan><tspan x="549" dy="20">그 기능이 적힌 효능 문구</tspan></text>
<rect x="30" y="316" width="270" height="84" rx="8" fill="#e9e2d3"/><text x="165" y="354" font-size="15" fill="#16151a" font-weight="bold" text-anchor="middle"><tspan x="165" dy="0">향료에 피부가</tspan><tspan x="165" dy="20">예민해요</tspan></text>
<line x1="300" y1="358" x2="390" y2="358" stroke="#16151a" stroke-width="2"/><polygon points="390,351 404,358 390,365" fill="#16151a"/><rect x="408" y="316" width="282" height="84" rx="8" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/><text x="549" y="354" font-size="15" fill="#16151a" font-weight="normal" text-anchor="middle"><tspan x="549" dy="0">전성분에서 '향료'와</tspan><tspan x="549" dy="20">알레르기 유발 성분 이름 확인</tspan></text>
<rect x="30" y="424" width="270" height="84" rx="8" fill="#e9e2d3"/><text x="165" y="462" font-size="15" fill="#16151a" font-weight="bold" text-anchor="middle"><tspan x="165" dy="0">'피부재생' '항염'</tspan><tspan x="165" dy="20">'바르는 보톡스' 광고</tspan></text>
<line x1="300" y1="466" x2="390" y2="466" stroke="#b8392f" stroke-width="2"/><polygon points="390,459 404,466 390,473" fill="#b8392f"/><rect x="408" y="424" width="282" height="84" rx="8" fill="#ffffff" stroke="#b8392f" stroke-width="2"/><text x="549" y="462" font-size="15" fill="#b8392f" font-weight="bold" text-anchor="middle"><tspan x="549" dy="0">거르세요. 화장품은</tspan><tspan x="549" dy="20">의약품이 아니에요</tspan></text>
<text x="360" y="552" font-size="15" fill="#5f5b55" font-weight="normal" text-anchor="middle">피부 질환이 있거나 처방약을 쓰면 의사·약사에게 먼저 물어보세요.</text>
</svg>
