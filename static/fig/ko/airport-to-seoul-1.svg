<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 546" role="img" aria-label="1터미널에서 서울까지" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>1터미널에서 서울까지</title>
<rect width="400" height="546" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">1터미널에서 서울까지</text>
<rect x="16" y="54" width="368" height="92" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="32" y="82" font-size="18" font-weight="700" fill="#16151a" text-anchor="start">공항철도 직통열차</text>
<text x="32" y="108" font-size="18" font-weight="700" fill="#b8392f" text-anchor="start">13,000원</text>
<text x="32" y="132" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">서울역까지 안 서고 43분</text>
<rect x="16" y="156" width="368" height="114" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="32" y="184" font-size="18" font-weight="700" fill="#16151a" text-anchor="start">공항철도 일반열차</text>
<text x="32" y="210" font-size="18" font-weight="700" fill="#b8392f" text-anchor="start">교통카드 4,750원</text>
<text x="32" y="234" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">서울역까지 59분,</text>
<text x="32" y="256" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">홍대입구·공덕에 정차</text>
<rect x="16" y="280" width="368" height="92" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="32" y="308" font-size="18" font-weight="700" fill="#16151a" text-anchor="start">공항 리무진버스</text>
<text x="32" y="334" font-size="18" font-weight="700" fill="#b8392f" text-anchor="start">16,000~18,000원</text>
<text x="32" y="358" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">숙소 많은 지역까지 약 60~80분</text>
<rect x="16" y="382" width="368" height="114" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="32" y="410" font-size="18" font-weight="700" fill="#16151a" text-anchor="start">외국인관광택시</text>
<text x="32" y="436" font-size="18" font-weight="700" fill="#b8392f" text-anchor="start">70,000~95,000원</text>
<text x="32" y="460" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">서울 구역별 정액,</text>
<text x="32" y="482" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">중형·통행료 포함</text>
<text x="20" y="528" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">어른 요금, 2026년 11월 26일 확인</text>
</svg>
