<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 490" role="img" aria-label="이 이미지를 저장해 두고 옆 사람에게 보여 주세요" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>이 이미지를 저장해 두고 옆 사람에게 보여 주세요</title>
<rect width="400" height="490" fill="#f4f0e6"/>
<text x="20" y="42" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">이 이미지를 저장해 두고 옆 사람에게</text>
<text x="20" y="68" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">보여 주세요</text>
<rect x="16" y="82" width="368" height="128" rx="10" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<rect x="26" y="96" width="64" height="34" rx="8" fill="#b8392f"/>
<text x="58" y="119" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">112</text>
<rect x="16" y="220" width="368" height="106" rx="10" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<rect x="26" y="234" width="64" height="34" rx="8" fill="#b8392f"/>
<text x="58" y="257" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">119</text>
<rect x="16" y="336" width="368" height="128" rx="10" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<rect x="26" y="350" width="64" height="34" rx="8" fill="#b8392f"/>
<text x="58" y="373" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1330</text>
<text x="100" y="116" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">도와주세요. 112(경찰)에</text>
<text x="100" y="146" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">신고해 주시겠어요?</text>
<text x="100" y="168" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Please call the police (112) for</text>
<text x="100" y="190" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">me.</text>
<text x="100" y="254" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">구급차를 불러 주세요.</text>
<text x="100" y="284" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">119에 전화해 주세요.</text>
<text x="100" y="306" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Please call an ambulance (119).</text>
<text x="100" y="370" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">한국어를 못 해요. 1330에</text>
<text x="100" y="400" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">전화해 주실 수 있나요?</text>
<text x="100" y="422" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">I don’t speak Korean. Please call</text>
<text x="100" y="444" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">1330.</text>
</svg>
