<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 454" role="img" aria-label="환전은 어디서" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<rect width="400" height="454" fill="#f4f0e6"/>
