<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 448" role="img" aria-label="어느 터미널?" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>어느 터미널?</title>
<rect width="400" height="448" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">어느 터미널?</text>
<text x="20" y="74" font-size="16" font-weight="700" fill="#5f5b55" text-anchor="start">서울역에서 공항철도</text>
<line x1="36" y1="84" x2="36" y2="280" stroke="#b8392f" stroke-width="5"/>
<circle cx="36" cy="112" r="10" fill="#ffffff" stroke="#b8392f" stroke-width="3"/>
<rect x="60" y="90" width="320" height="160" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="76" y="118" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">제1터미널: 먼저 서요</text>
<text x="76" y="142" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">제주항공, 트리니티항공,</text>
<text x="76" y="164" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">이스타항공, 에어프레미아,</text>
<text x="76" y="186" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">파라타항공, 피치, ZIPAIR,</text>
<text x="76" y="208" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">에바항공, 타이거에어 타이완 등</text>
<text x="76" y="230" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">대부분의 외국 항공사</text>
<circle cx="36" cy="286" r="10" fill="#b8392f" stroke="#b8392f" stroke-width="3"/>
<rect x="60" y="264" width="320" height="116" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="76" y="292" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">제2터미널: 종점</text>
<text x="76" y="316" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">대한항공, 아시아나, 진에어,</text>
<text x="76" y="338" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">에어부산, 에어서울, 델타,</text>
<text x="76" y="360" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">에어프랑스, KLM, 중화항공</text>
<text x="20" y="408" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">공동운항이라면 전자항공권이나</text>
<text x="20" y="430" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">airport.kr에서 편명 검색</text>
</svg>
