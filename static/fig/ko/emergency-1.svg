<rect x="30" y="297" width="70.84640000000002" height="32" rx="8" fill="#b8392f"/>
<text x="65.42320000000001" y="319" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1339</text>
<text x="112.84640000000002" y="312" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">건강 상담</text>
