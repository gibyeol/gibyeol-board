<text x="59.067400000000006" y="165" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">112</text>
<text x="100.13480000000001" y="158" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">경찰</text>
<text x="100.13480000000001" y="180" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">범죄, 위협, 불안할 때</text>
