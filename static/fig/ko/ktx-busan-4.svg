<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="김해공항에서 부산 시내로" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>김해공항에서 부산 시내로</title>
<rect width="400" height="470" fill="#f4f0e6"/>
<text x="20" y="42" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">김해공항에서 부산 시내로</text>
<rect x="16" y="56" width="368" height="89" rx="10" fill="#e9e2d3"/>
<rect x="30" y="66" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="88" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="78" y="81" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">경전철</text>
<text x="78" y="103" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">가장 싸고 빨라요. 사상(2호선)이나</text>
<text x="78" y="125" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">대저(3호선)에서 환승</text>
<rect x="16" y="155" width="368" height="89" rx="10" fill="#e9e2d3"/>
<rect x="30" y="165" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="187" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="78" y="180" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">공항리무진 2번</text>
<text x="78" y="202" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">서면·부전 · 6,000원 · 약 50분 ·</text>
<text x="78" y="224" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">60~80분 간격</text>
<rect x="16" y="254" width="368" height="67" rx="10" fill="#e9e2d3"/>
<rect x="30" y="264" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="286" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="78" y="279" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">공항리무진 1번</text>
<text x="78" y="301" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">해운대 · 9,500원</text>
<rect x="16" y="331" width="368" height="89" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<rect x="30" y="341" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="363" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
<text x="78" y="356" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">리무진은 현금 안 돼요</text>
<text x="78" y="378" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">1층 4번 게이트 옆 발권기, 또는</text>
<text x="78" y="400" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">버스에서 카드</text>
<text x="20" y="448" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">짐은 두 개, 합쳐서 30kg까지 무료.</text>
</svg>
