<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 314" role="img" aria-label="북촌 레드존, 시간대별로" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>북촌 레드존, 시간대별로</title>
<rect width="400" height="314" fill="#f4f0e6"/>
