<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 406" role="img" aria-label="저장해 둘 번호 세 개" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>저장해 둘 번호 세 개</title>
<rect width="400" height="406" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">저장해 둘 번호 세 개</text>
<rect x="16" y="58" width="368" height="94" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="70" width="46.4928" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="51.2464" y="94" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">119</text>
<text x="86.4928" y="92" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">구급·소방</text>
<text x="86.4928" y="114" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">24시간. 심한 가슴 통증, 호흡 곤란,</text>
<text x="86.4928" y="136" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">의식 잃음, 큰 출혈, 큰 부상</text>
<rect x="16" y="162" width="368" height="94" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="174" width="55.99040000000001" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="55.995200000000004" y="198" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1339</text>
<text x="95.99040000000001" y="196" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">질병관리청 콜센터</text>
<text x="95.99040000000001" y="218" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">365일 24시간. 국내 번호로 걸면</text>
<text x="95.99040000000001" y="240" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">무료. 해외에서는 +82-2-2633-1339</text>
<rect x="16" y="266" width="368" height="72" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="278" width="55.99040000000001" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="55.995200000000004" y="302" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1330</text>
<text x="95.99040000000001" y="300" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">말이 안 통할 때 3자 통화</text>
<text x="95.99040000000001" y="322" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">운영 시간과 언어: 생활 정보 페이지</text>
<rect x="16" y="350" width="368" height="38" rx="10" fill="#e9e2d3" stroke="#b8392f" stroke-width="2"/>
<text x="30" y="376" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">어디로 가야 할지 모르겠다면 1339</text>
</svg>
