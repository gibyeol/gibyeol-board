<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 677" role="img" aria-label="한국 식당 테이블에서" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>한국 식당 테이블에서</title>
<rect width="400" height="677" fill="#f4f0e6"/>
<text x="20" y="42" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">한국 식당 테이블에서</text>
<rect x="24" y="62" width="352" height="176" rx="18" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="1.5"/>
<circle cx="80" cy="114" r="20" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<circle cx="80" cy="114" r="9" fill="#b8392f"/>
<circle cx="108" cy="88" r="13" fill="#b8392f"/>
<text x="108" y="94" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<rect x="140" y="84" width="100" height="66" rx="8" fill="#16151a"/>
<rect x="147" y="91" width="86" height="52" rx="4" fill="#ffffff"/>
<circle cx="250" cy="82" r="13" fill="#b8392f"/>
<text x="250" y="88" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<path d="M286 96 L320 96 L314 146 L292 146 Z" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<path d="M289 112 L317 112" stroke="#c9c1b2" stroke-width="2"/>
<circle cx="338" cy="92" r="13" fill="#b8392f"/>
<text x="338" y="98" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<rect x="110" y="176" width="170" height="42" rx="6" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<text x="195" y="204" font-size="18" font-weight="700" fill="#16151a" text-anchor="middle">2인분 이상</text>
<circle cx="298" cy="176" r="13" fill="#b8392f"/>
<text x="298" y="182" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<rect x="16" y="254" width="368" height="67" rx="10" fill="#e9e2d3"/>
<circle cx="48" cy="280" r="17" fill="#b8392f"/>
<text x="48" y="286" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="78" y="279" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">호출벨</text>
<text x="78" y="301" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">누르면 직원이 와요. 소리가 클 수 있어요</text>
<rect x="16" y="331" width="368" height="67" rx="10" fill="#e9e2d3"/>
<circle cx="48" cy="357" r="17" fill="#b8392f"/>
<text x="48" y="363" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="78" y="356" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">태블릿이나 키오스크</text>
<text x="78" y="378" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">여기서 주문하고 결제하는 곳이 많아요</text>
<rect x="16" y="408" width="368" height="89" rx="10" fill="#e9e2d3"/>
<circle cx="48" cy="434" r="17" fill="#b8392f"/>
<text x="48" y="440" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="78" y="433" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">물</text>
<text x="78" y="455" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">무료, 벽 쪽에서 직접 떠 오는 곳이</text>
<text x="78" y="477" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">많아요</text>
<rect x="16" y="507" width="368" height="67" rx="10" fill="#e9e2d3"/>
<circle cx="48" cy="533" r="17" fill="#b8392f"/>
<text x="48" y="539" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="78" y="532" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">“2인분 이상”</text>
<text x="78" y="554" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">혼자라면 앉기 전에 물어보기</text>
<rect x="16" y="584" width="368" height="67" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<text x="30" y="609" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">팁 없음</text>
<text x="30" y="631" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">메뉴 가격에 세금·봉사료 포함</text>
</svg>
