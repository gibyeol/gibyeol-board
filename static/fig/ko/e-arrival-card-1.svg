<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 648" role="img" aria-label="전자입국신고서, 내야 할까?" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<rect width="400" height="648" fill="#f4f0e6"/>
<text x="16" y="40" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">전자입국신고서, 내야 할까?</text>
<rect x="16" y="54" width="368" height="122" rx="10" fill="#e9e2d3"/>
<text x="30" y="88" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">대한민국 국민이거나</text>
<text x="30" y="110" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">등록외국인인가요?</text>
<rect x="26" y="122" width="348" height="42" rx="8" fill="#ffffff"/>
<rect x="36" y="132" width="44" height="26" rx="13" fill="#b8392f"/>
<text x="58.0" y="151" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">예</text>
<text x="90" y="151" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">낼 필요 없음</text>
<path d="M44 182 V206" stroke="#5f5b55" stroke-width="2"/>
<path d="M38 200 L44 208 L50 200" fill="none" stroke="#5f5b55" stroke-width="2"/>
<text x="60" y="201" font-size="16" font-weight="700" fill="#5f5b55" text-anchor="start">아니요</text>
<rect x="16" y="216" width="368" height="122" rx="10" fill="#e9e2d3"/>
<text x="30" y="250" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">유효한 K-ETA가 있나요?</text>
<rect x="26" y="262" width="348" height="64" rx="8" fill="#ffffff"/>
<rect x="36" y="272" width="44" height="26" rx="13" fill="#b8392f"/>
<text x="58.0" y="291" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">예</text>
<text x="90" y="291" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">낼 필요 없음</text>
<text x="90" y="313" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">k-eta.go.kr에서 체류지 현행화</text>
<path d="M44 344 V368" stroke="#5f5b55" stroke-width="2"/>
<path d="M38 362 L44 370 L50 362" fill="none" stroke="#5f5b55" stroke-width="2"/>
<text x="60" y="363" font-size="16" font-weight="700" fill="#5f5b55" text-anchor="start">아니요</text>
<rect x="16" y="378" width="368" height="122" rx="10" fill="#e9e2d3"/>
<text x="30" y="412" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">24시간 안에 환승하고</text>
<text x="30" y="434" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">환승 구역을 안 나가나요?</text>
<rect x="26" y="446" width="348" height="42" rx="8" fill="#ffffff"/>
<rect x="36" y="456" width="44" height="26" rx="13" fill="#b8392f"/>
<text x="58.0" y="475" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">예</text>
<text x="90" y="475" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">낼 필요 없음</text>
<path d="M44 506 V530" stroke="#5f5b55" stroke-width="2"/>
<path d="M38 524 L44 532 L50 524" fill="none" stroke="#5f5b55" stroke-width="2"/>
<text x="60" y="525" font-size="16" font-weight="700" fill="#5f5b55" text-anchor="start">아니요</text>
<rect x="16" y="540" width="368" height="90" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<text x="30" y="574" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">무료 전자입국신고서 제출</text>
<text x="30" y="598" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">e-arrivalcard.go.kr</text>
<text x="30" y="620" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">도착 전 3일 안에</text>
</svg>
