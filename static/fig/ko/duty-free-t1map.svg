<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 610' role='img' aria-label='1터미널 출국: 인도장 찾아가기'><rect width='400' height='610' rx='14' fill='#f7f7f5'/><text x='16' y='32' font-size='18' font-weight='700' fill='#1f2328' text-anchor='start' font-family='Pretendard,Noto Sans KR,Noto Sans JP,Noto Sans TC,system-ui,sans-serif'>1터미널 출국: 인도장 찾아가기</text><rect x='16' y='46' width='368' height='70' rx='10' fill='#eef2f7' stroke='#c9ccd1'/><text x='200' y='76' font-size='16' font-weight='700' fill='#1d2b53' text-anchor='middle' font-family='Pretendard,Noto Sans KR,Noto Sans JP,Noto Sans TC,system-ui,sans-serif'>탑승동(101~132번 게이트)이라면:</text><text x='200' y='100' font-size='16' font-weight='700' fill='#1d2b53' text-anchor='middle' font-family='Pretendard,Noto Sans KR,Noto Sans JP,Noto Sans TC,system-ui,sans-serif'>셔틀트레인 → 119번 옆 에스컬레이터 → 4층</text><rect x='16' y='122' width='368' height='92' rx='10' fill='#fff' stroke='#c9ccd1'/><text x='28' y='142' font-size='15' font-weight='700' fill='#5b6470' text-anchor='start' font-family='Pretendard,Noto Sans KR,Noto Sans JP,Noto Sans TC,system-ui,sans-serif'>4F</text><rect x='34' y='150' width='150' height='56' rx='10' fill='#c0392b'/><text x='109' y='174' font-size='17' font-weight='700' fill='#fff' text-anchor='middle' font-family='Pretendard,Noto Sans KR,Noto Sans JP,Noto Sans TC,system-ui,sans-serif'>인도장</text><text x='109' y='196' font-size='15' font-weight='700' fill='#fff' text-anchor='middle' font-family='Pretendard,Noto Sans KR,Noto Sans JP,Noto Sans TC,system-ui,sans-serif'>↑ 43</text><text x='286' y='160' font-size='15' font-weight='700' fill='#5b6470' text-anchor='middle' font-family='Pretendard,Noto Sans KR,Noto Sans JP,Noto Sans TC,system-ui,sans-serif'>← 4층 마티나</text><text x='286' y='179' font-size='15' font-weight='700' fill='#5b6470' text-anchor='middle' font-family='Pretendard,Noto Sans KR,Noto Sans JP,Noto Sans TC,system-ui,sans-serif'>라운지(서편) 근처</text><rect x='16' y='226' width='368' height='244' rx='10' fill='#fff' stroke='#c9ccd1'/><text x='28' y='246' font-size='15' font-weight='700' fill='#5b6470' text-anchor='start' font-family='Pretendard,Noto Sans KR,Noto Sans JP,Noto Sans TC,system-ui,sans-serif'>3F</text><path d='M300,318 Q200,316 132,300 L132,212' fill='none' stroke='#c0392b' stroke-width='5' stroke-dasharray='10 7' stroke-linecap='round'/><path d='M122,218 L132,200 L142,218Z' fill='#c0392b'/><rect x='232' y='310' width='128' height='16' rx='8' fill='#c0392b' opacity='0.85'/><text x='296' y='350' font-size='15' font-weight='700' fill='#c0392b' text-anchor='middle' font-family='Pretendard,Noto Sans KR,Noto Sans JP,Noto Sans TC,system-ui,sans-serif'>출국심사를 지나면</text><text x='296' y='369' font-size='15' font-weight='700' fill='#c0392b' text-anchor='middle' font-family='Pretendard,Noto Sans KR,Noto Sans JP,Noto Sans TC,system-ui,sans-serif'>3층 면세구역.</text><text x='296' y='388' font-size='15' font-weight='700' fill='#c0392b' text-anchor='middle' font-family='Pretendard,Noto Sans KR,Noto Sans JP,Noto Sans TC,system-ui,sans-serif'>게이트 번호</text><text x='296' y='407' font-size='15' font-weight='700' fill='#c0392b' text-anchor='middle' font-family='Pretendard,Noto Sans KR,Noto Sans JP,Noto Sans TC,system-ui,sans-serif'>표지판을 봐요</text><path d='M44,300 Q200,250 360,300' fill='none' stroke='#d5d9df' stroke-width='22' stroke-linecap='round'/><rect x='45' y='276' width='30' height='24' rx='5' fill='#1d2b53'/><text x='60' y='294' font-size='14' font-weight='700' fill='#fff' text-anchor='middle' font-family='Pretendard,Noto Sans KR,Noto Sans JP,Noto Sans TC,system-ui,sans-serif'>50</text><rect x='89' y='256' width='30' height='24' rx='5' fill='#c0392b'/><text x='104' y='274' font-size='14' font-weight='700' fill='#fff' text-anchor='middle' font-family='Pretendard,Noto Sans KR,Noto Sans JP,Noto Sans TC,system-ui,sans-serif'>43</text><rect x='163' y='239' width='30' height='24' rx='5' fill='#1d2b53'/><text x='178' y='257' font-size='14' font-weight='700' fill='#fff' text-anchor='middle' font-family='Pretendard,Noto Sans KR,Noto Sans JP,Noto Sans TC,system-ui,sans-serif'>29</text><rect x='199' y='238' width='30' height='24' rx='5' fill='#1d2b53'/><text x='214' y='256' font-size='14' font-weight='700' fill='#fff' text-anchor='middle' font-family='Pretendard,Noto Sans KR,Noto Sans JP,Noto Sans TC,system-ui,sans-serif'>28</text><rect x='235' y='243' width='30' height='24' rx='5' fill='#1d2b53'/><text x='250' y='261' font-size='14' font-weight='700' fill='#fff' text-anchor='middle' font-family='Pretendard,Noto Sans KR,Noto Sans JP,Noto Sans TC,system-ui,sans-serif'>25</text><rect x='297' y='262' width='30' height='24' rx='5' fill='#1d2b53'/><text x='312' y='280' font-size='14' font-weight='700' fill='#fff' text-anchor='middle' font-family='Pretendard,Noto Sans KR,Noto Sans JP,Noto Sans TC,system-ui,sans-serif'>11</text><rect x='341' y='285' width='30' height='24' rx='5' fill='#1d2b53'/><text x='356' y='303' font-size='14' font-weight='700' fill='#fff' text-anchor='middle' font-family='Pretendard,Noto Sans KR,Noto Sans JP,Noto Sans TC,system-ui,sans-serif'>2</text><text x='30' y='268' font-size='18' font-weight='700' fill='#1f2328' text-anchor='start' font-family='Pretendard,Noto Sans KR,Noto Sans JP,Noto Sans TC,system-ui,sans-serif'>서</text><text x='370' y='268' font-size='18' font-weight='700' fill='#1f2328' text-anchor='end' font-family='Pretendard,Noto Sans KR,Noto Sans JP,Noto Sans TC,system-ui,sans-serif'>동</text><line x1='178' y1='272' x2='178' y2='376' stroke='#6d28d9' stroke-width='2'/><text x='140' y='394' font-size='15' font-weight='700' fill='#6d28d9' text-anchor='middle' font-family='Pretendard,Noto Sans KR,Noto Sans JP,Noto Sans TC,system-ui,sans-serif'>안내데스크</text><text x='140' y='413' font-size='15' font-weight='700' fill='#6d28d9' text-anchor='middle' font-family='Pretendard,Noto Sans KR,Noto Sans JP,Noto Sans TC,system-ui,sans-serif'>24시간(3층)</text><text x='140' y='434' font-size='14' font-weight='600' fill='#5b6470' text-anchor='middle' font-family='Pretendard,Noto Sans KR,Noto Sans JP,Noto Sans TC,system-ui,sans-serif'>한국전통문화센터 서관</text><rect x='16' y='482' width='368' height='44' rx='10' fill='#fdecea'/><text x='200' y='510' font-size='17' font-weight='700' fill='#c0392b' text-anchor='middle' font-family='Pretendard,Noto Sans KR,Noto Sans JP,Noto Sans TC,system-ui,sans-serif'>← 게이트 번호가 커지는 쪽(서편)으로</text><text x='200' y='566' font-size='13' font-weight='500' fill='#5b6470' text-anchor='middle' font-family='Pretendard,Noto Sans KR,Noto Sans JP,Noto Sans TC,system-ui,sans-serif'>개략도(축척 아님). 현대·신라면세점 인도장</text><text x='200' y='582' font-size='13' font-weight='500' fill='#5b6470' text-anchor='middle' font-family='Pretendard,Noto Sans KR,Noto Sans JP,Noto Sans TC,system-ui,sans-serif'>안내, 인천공항 시설 안내 기준</text></svg>