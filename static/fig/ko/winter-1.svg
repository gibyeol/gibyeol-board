<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 404" role="img" aria-label="1월 서울: 평균 최저 −5.5°C" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>1월 서울: 평균 최저 −5.5°C</title>
<rect width="400" height="404" fill="#f4f0e6"/>
<text x="20" y="42" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">1월 서울: 평균 최저 −5.5°C</text>
<rect x="16" y="56" width="368" height="67" rx="10" fill="#e9e2d3"/>
<rect x="30" y="66" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="88" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="78" y="81" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">긴 패딩이나 파카</text>
<text x="78" y="103" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">엉덩이를 덮는 길이</text>
<rect x="16" y="133" width="368" height="67" rx="10" fill="#e9e2d3"/>
<rect x="30" y="143" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="165" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="78" y="158" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">발열 내의</text>
<text x="78" y="180" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">밖은 따뜻하게, 안은 덥지 않게</text>
<rect x="16" y="210" width="368" height="67" rx="10" fill="#e9e2d3"/>
<rect x="30" y="220" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="242" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="78" y="235" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">모자, 장갑, 목도리</text>
<text x="78" y="257" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">지도 볼 땐 터치 장갑</text>
<rect x="16" y="287" width="368" height="67" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<rect x="30" y="297" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="319" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">+</text>
<text x="78" y="312" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">가서 사기: 핫팩</text>
<text x="78" y="334" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">CU, GS25, 세븐일레븐, 겨울 내내</text>
<text x="20" y="382" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">실내는 난방: 패딩 열고, 목도리 풀기.</text>
</svg>
