<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 482" role="img" aria-label="화장품 짐 싸기" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>화장품 짐 싸기</title>
<rect width="400" height="482" rx="16" fill="#f4f0e6"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16151a"/></marker></defs>
<text x="20" y="39" font-size="21" fill="#16151a" font-weight="bold" text-anchor="start">화장품 짐 싸기</text>
<rect x="16" y="61" width="368" height="93" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<rect x="32" y="84" width="52" height="50" rx="5" fill="#ffffff" stroke="#16151a" stroke-width="2.5"/><line x1="32" y1="93" x2="84" y2="93" stroke="#b8392f" stroke-width="3"/><rect x="40" y="106" width="10" height="24" rx="3" fill="#e9e2d3" stroke="#16151a" stroke-width="1.5"/><rect x="53" y="100" width="10" height="30" rx="3" fill="#e9e2d3" stroke="#16151a" stroke-width="1.5"/><rect x="66" y="110" width="10" height="20" rx="3" fill="#e9e2d3" stroke="#16151a" stroke-width="1.5"/>
<text x="100" y="91" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">기내 반입</text>
<text x="100" y="114" font-size="16" fill="#5f5b55" text-anchor="start">액체·젤·스프레이: 용기당 100mL 이하</text>
<text x="100" y="136" font-size="16" fill="#5f5b55" text-anchor="start">1인당 1L 투명 지퍼백 1개</text>
<rect x="16" y="166" width="368" height="115" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<rect x="32" y="206" width="52" height="42" rx="7" fill="#e9e2d3" stroke="#16151a" stroke-width="2.5"/><path d="M48,206 v-9 h20 v9" fill="none" stroke="#16151a" stroke-width="2.5"/><line x1="46" y1="206" x2="46" y2="248" stroke="#16151a" stroke-width="2"/><line x1="70" y1="206" x2="70" y2="248" stroke="#16151a" stroke-width="2"/>
<text x="100" y="196" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">위탁 수하물</text>
<text x="100" y="219" font-size="16" fill="#5f5b55" text-anchor="start">큰 용량</text>
<text x="100" y="241" font-size="16" fill="#5f5b55" text-anchor="start">헤어스프레이 같은 개인 위생용</text>
<text x="100" y="263" font-size="16" fill="#5f5b55" text-anchor="start">스프레이: 용기당 500mL, 총 2L</text>
<rect x="16" y="293" width="368" height="93" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<rect x="36" y="316" width="44" height="50" rx="5" fill="#ffffff" stroke="#16151a" stroke-width="2.5"/><rect x="36" y="316" width="44" height="10" fill="#b8392f"/><rect x="49" y="340" width="18" height="20" rx="3" fill="#e9e2d3" stroke="#16151a" stroke-width="1.5"/>
<text x="100" y="323" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">면세 액체류</text>
<text x="100" y="346" font-size="16" fill="#5f5b55" text-anchor="start">최종 목적지행 비행기에 탈 때까지</text>
<text x="100" y="368" font-size="16" fill="#5f5b55" text-anchor="start">밀봉 봉투 그대로</text>
<rect x="16" y="398" width="368" height="66" rx="12" fill="#e9e2d3"/>
<text x="30" y="425" font-size="16" fill="#16151a" text-anchor="start">인천공항 국제선 기준. 이용 항공사 기준도</text>
<text x="30" y="447" font-size="16" fill="#16151a" text-anchor="start">확인하세요.</text>
</svg>
