<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 346" role="img" aria-label="왕복 승차권이냐 코레일패스냐(성인)" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>왕복 승차권이냐 코레일패스냐(성인)</title>
<rect width="400" height="346" fill="#f4f0e6"/>
<text x="20" y="42" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">왕복 승차권이냐 코레일패스냐(성인)</text>
<text x="20" y="77" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">서울-부산 왕복, 54,400원 ×</text>
