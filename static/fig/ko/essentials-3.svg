<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 424" role="img" aria-label="데이터, 세 가지 방법" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>데이터, 세 가지 방법</title>
<rect width="400" height="424" fill="#f4f0e6"/>
<text x="20" y="42" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">데이터, 세 가지 방법</text>
<rect x="16" y="56" width="368" height="89" rx="10" fill="#e9e2d3"/>
<rect x="30" y="66" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="88" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="78" y="81" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">eSIM</text>
<text x="78" y="103" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">출발 전에 설치, 도착하면 바로 연결.</text>
<text x="78" y="125" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">eSIM 지원·언락 폰만</text>
<rect x="16" y="155" width="368" height="67" rx="10" fill="#e9e2d3"/>
<rect x="30" y="165" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="187" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="78" y="180" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">유심</text>
<text x="78" y="202" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">공항에서 수령. eSIM이 안 되는 폰</text>
<rect x="16" y="232" width="368" height="89" rx="10" fill="#e9e2d3"/>
<rect x="30" y="242" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="264" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="78" y="257" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">포켓 와이파이</text>
<text x="78" y="279" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">여럿이 한 회선. 충전하고 반납할 물건이</text>
<text x="78" y="301" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">하나 더</text>
<rect x="16" y="331" width="368" height="67" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<rect x="30" y="341" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="363" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
<text x="78" y="356" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">통화·문자도 필요하다면</text>
<text x="78" y="378" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">통화·문자가 포함된 요금제로</text>
</svg>
