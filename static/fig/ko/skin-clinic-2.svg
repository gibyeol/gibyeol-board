<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 416" role="img" aria-label="등록 의료기관이 따로 알려 줘야 하는 것" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>등록 의료기관이 따로 알려 줘야 하는 것</title>
<rect width="400" height="416" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">등록 의료기관이 따로 알려 줘야 하는</text>
<text x="20" y="60" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">것</text>
<rect x="16" y="84" width="368" height="216" rx="4" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<line x1="16" y1="92" x2="384" y2="92" stroke="#b8392f" stroke-width="4"/>
<rect x="30" y="110" width="22" height="22" rx="3" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<path d="M34,122 L39,127 L49,115" fill="none" stroke="#b8392f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="66" y="127" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">진단명</text>
<line x1="30" y1="144" x2="370" y2="144" stroke="#e9e2d3" stroke-width="1.5"/>
<rect x="30" y="146" width="22" height="22" rx="3" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<path d="M34,158 L39,163 L49,151" fill="none" stroke="#b8392f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="66" y="163" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">치료 방법</text>
<line x1="30" y1="180" x2="370" y2="180" stroke="#e9e2d3" stroke-width="1.5"/>
<rect x="30" y="182" width="22" height="22" rx="3" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<path d="M34,194 L39,199 L49,187" fill="none" stroke="#b8392f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="66" y="199" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">생길 수 있는 부작용</text>
<line x1="30" y1="216" x2="370" y2="216" stroke="#e9e2d3" stroke-width="1.5"/>
<rect x="30" y="218" width="22" height="22" rx="3" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<path d="M34,230 L39,235 L49,223" fill="none" stroke="#b8392f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="66" y="235" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">진료계약서와 예상 진료비</text>
<line x1="30" y1="252" x2="370" y2="252" stroke="#e9e2d3" stroke-width="1.5"/>
<rect x="30" y="254" width="22" height="22" rx="3" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<path d="M34,266 L39,271 L49,259" fill="none" stroke="#b8392f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="66" y="271" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">의료사고 때 분쟁 해결 절차</text>
<line x1="30" y1="288" x2="370" y2="288" stroke="#e9e2d3" stroke-width="1.5"/>
<rect x="16" y="312" width="368" height="38" rx="10" fill="#e9e2d3" stroke="#b8392f" stroke-width="2"/>
<text x="30" y="338" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">서명 전에, 읽을 수 있는 언어로</text>
<text x="20" y="376" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">의사에게: 누가 시술하는지, 사후 관리, 비행기</text>
<text x="20" y="398" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">타도 되는 날</text>
</svg>
