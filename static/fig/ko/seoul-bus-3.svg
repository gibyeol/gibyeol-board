<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-label="내린 뒤 환승 인정 시간" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<rect width="720" height="330" fill="#f4f0e6"/>
<text x="32" y="44" font-size="22" font-weight="700" fill="#16151a">내린 뒤 환승 인정 시간</text>
<text x="32" y="128" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">아침 7시~밤 9시</text>
<rect x="180" y="100" width="480" height="44" rx="8" fill="#ffffff" stroke="#c9c1b2"/>
<rect x="180" y="100" width="240.0" height="44" rx="8" fill="#e9e2d3" stroke="#16151a"/>
<text x="300.0" y="128" font-size="17" font-weight="700" fill="#16151a" text-anchor="middle">30분</text>
<circle cx="180" cy="122" r="9" fill="#b8392f"/>
<text x="32" y="218" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">밤 9시~아침 7시</text>
<rect x="180" y="190" width="480" height="44" rx="8" fill="#ffffff" stroke="#c9c1b2"/>
<rect x="180" y="190" width="480.0" height="44" rx="8" fill="#e9e2d3" stroke="#16151a"/>
<text x="420.0" y="218" font-size="17" font-weight="700" fill="#16151a" text-anchor="middle">1시간</text>
<circle cx="180" cy="212" r="9" fill="#b8392f"/>
<text x="180" y="86" font-size="15" font-weight="700" fill="#b8392f" text-anchor="middle">하차 태그</text>
<text x="32" y="292" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">이 안에 다음 버스·지하철을 타면 환승</text>
<text x="32" y="316" font-size="15" font-weight="400" fill="#5f5b55" text-anchor="start">최대 4번 환승 · 같은 노선 재탑승은 환승 아님</text>
</svg>
