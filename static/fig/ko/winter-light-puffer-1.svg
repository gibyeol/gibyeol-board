<text x="103" y="380" font-size="17" fill="#16151a" font-weight="bold" text-anchor="middle">가을·초겨울</text>
<text x="103" y="404" font-size="16" fill="#5f5b55" font-weight="normal" text-anchor="middle">겉옷 하나로</text>
