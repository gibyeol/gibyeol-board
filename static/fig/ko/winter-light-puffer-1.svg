<text x="297" y="380" font-size="17" fill="#16151a" font-weight="bold" text-anchor="middle">한겨울</text>
<text x="297" y="404" font-size="16" fill="#5f5b55" font-weight="normal" text-anchor="middle">코트 안에 한 겹 더</text>
<text x="20" y="452" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">올해 많이 보이는 모양</text>
<circle cx="32" cy="482" r="13" fill="#b8392f"/><text x="32" y="488" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="54" y="488" font-size="16" fill="#16151a" font-weight="normal" text-anchor="start">허리선이 들어간 입체 실루엣</text>
<circle cx="32" cy="516" r="13" fill="#b8392f"/><text x="32" y="522" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="54" y="522" font-size="16" fill="#16151a" font-weight="normal" text-anchor="start">어깨는 넉넉하게</text>
<circle cx="32" cy="550" r="13" fill="#b8392f"/><text x="32" y="556" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="54" y="556" font-size="16" fill="#16151a" font-weight="normal" text-anchor="start">검정 말고 옅은 색</text>
<rect x="20" y="572" width="30" height="30" rx="6" fill="#d9cdb8" stroke="#16151a" stroke-width="1.5"/>
<text x="58" y="593" font-size="16" fill="#16151a" font-weight="normal" text-anchor="start">오트밀</text>
<rect x="152" y="572" width="30" height="30" rx="6" fill="#b9c3cc" stroke="#16151a" stroke-width="1.5"/>
<text x="190" y="593" font-size="16" fill="#16151a" font-weight="normal" text-anchor="start">포그 그레이</text>
<rect x="284" y="572" width="30" height="30" rx="6" fill="#cfe3d6" stroke="#16151a" stroke-width="1.5"/>
<text x="322" y="593" font-size="16" fill="#16151a" font-weight="normal" text-anchor="start">파스텔</text>
<text x="20" y="634" font-size="16" fill="#5f5b55" font-weight="normal" text-anchor="start">색은 예시예요. 실제 색은 상품마다 달라요.</text>
