<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 652" role="img" aria-label="경량 패딩 입는 두 가지 방법과 올해 많이 보이는 모양" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, sans-serif">
<title>경량 패딩 입는 두 가지 방법과 올해 많이 보이는 모양</title>
<rect width="400" height="652" fill="#f4f0e6"/>
