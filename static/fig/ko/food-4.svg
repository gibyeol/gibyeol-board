<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" role="img" aria-label="숙소에서 배민으로 주문하기" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>숙소에서 배민으로 주문하기</title>
<rect width="400" height="460" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">숙소에서 배민으로 주문하기</text>
<rect x="20" y="60" width="360" height="88" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="36" y="90" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">언어</text>
<text x="36" y="114" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">영어, 중국어, 일본어:</text>
<text x="36" y="136" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">휴대폰 언어 설정을 따라가요</text>
<rect x="20" y="158" width="360" height="88" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="36" y="188" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">결제</text>
<text x="36" y="212" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">해외 카드, 애플페이,</text>
<text x="36" y="234" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">위챗페이, 알리페이플러스</text>
<rect x="20" y="256" width="360" height="88" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="36" y="286" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">인증</text>
<text x="36" y="310" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">해외 번호로 받은 문자,</text>
<text x="36" y="332" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">한국 휴대폰 필요 없음</text>
<rect x="20" y="354" width="360" height="88" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="36" y="384" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">주문 전에</text>
<text x="36" y="408" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">숙소 한국어 주소 복사,</text>
<text x="36" y="430" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">음식 받는 곳은 프런트에 확인</text>
</svg>
