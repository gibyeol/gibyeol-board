<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 426" role="img" aria-label="국내 건강보험 없이 의원에 갈 때" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>국내 건강보험 없이 의원에 갈 때</title>
<rect width="400" height="426" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">국내 건강보험 없이 의원에 갈 때</text>
<rect x="16" y="58" width="368" height="94" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="70" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="94" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="80" y="92" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">동네 의원을 고르기</text>
<text x="80" y="114" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">감기, 피부 트러블, 배탈.</text>
<text x="80" y="136" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">검사·입원·수술은 병원으로</text>
<rect x="16" y="162" width="368" height="60" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="174" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="198" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="80" y="196" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">여권 챙기기</text>
<rect x="16" y="232" width="368" height="94" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="244" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="268" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="80" y="266" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">진료비는 전액 본인 부담</text>
<text x="80" y="288" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">의원 진료비: 보험 없으면 약</text>
<text x="80" y="310" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">30,000~60,000원(내일신문)</text>
<rect x="16" y="336" width="368" height="72" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="348" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="372" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="80" y="370" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">영수증과 진료비 세부내역서 받기</text>
<text x="80" y="392" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">보험 청구용으로 모두 보관</text>
</svg>
