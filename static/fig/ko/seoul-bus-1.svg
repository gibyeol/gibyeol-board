<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="서울 버스 색깔 한눈에" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<rect width="720" height="440" fill="#f4f0e6"/>
<text x="32" y="44" font-size="22" font-weight="700" fill="#16151a">서울 버스 색깔 한눈에</text>
<rect x="32" y="70" width="656" height="56" rx="10" fill="#ffffff" stroke="#c9c1b2"/>
<rect x="44" y="80" width="76" height="36" rx="8" fill="#2f5d9e"/>
<text x="82" y="104" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">파랑</text>
<text x="136" y="95" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">간선</text>
<text x="136" y="116" font-size="15" font-weight="400" fill="#5f5b55" text-anchor="start">시 외곽과 도심을 길게</text>
<text x="672" y="105" font-size="17" font-weight="700" fill="#16151a" text-anchor="end">1,500원</text>
<rect x="32" y="136" width="656" height="56" rx="10" fill="#ffffff" stroke="#c9c1b2"/>
<rect x="44" y="146" width="76" height="36" rx="8" fill="#3d7a4a"/>
<text x="82" y="170" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">초록</text>
<text x="136" y="161" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">지선·마을</text>
<text x="136" y="182" font-size="15" font-weight="400" fill="#5f5b55" text-anchor="start">지하철역까지 짧게</text>
<text x="672" y="171" font-size="17" font-weight="700" fill="#16151a" text-anchor="end">1,500원(마을 1,200원)</text>
<rect x="32" y="202" width="656" height="56" rx="10" fill="#ffffff" stroke="#c9c1b2"/>
<rect x="44" y="212" width="76" height="36" rx="8" fill="#d9a521"/>
<text x="82" y="236" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">노랑</text>
<text x="136" y="227" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">순환</text>
<text x="136" y="248" font-size="15" font-weight="400" fill="#5f5b55" text-anchor="start">도심 안을 돌아요</text>
<text x="672" y="237" font-size="17" font-weight="700" fill="#16151a" text-anchor="end">1,400원</text>
<rect x="32" y="268" width="656" height="56" rx="10" fill="#ffffff" stroke="#c9c1b2"/>
<rect x="44" y="278" width="76" height="36" rx="8" fill="#b8392f"/>
<text x="82" y="302" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">빨강</text>
<text x="136" y="293" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">광역</text>
<text x="136" y="314" font-size="15" font-weight="400" fill="#5f5b55" text-anchor="start">수도권과 도심 연결</text>
<text x="672" y="303" font-size="17" font-weight="700" fill="#16151a" text-anchor="end">3,000원</text>
<rect x="32" y="334" width="656" height="56" rx="10" fill="#ffffff" stroke="#c9c1b2"/>
<rect x="44" y="344" width="76" height="36" rx="8" fill="#16151a"/>
<text x="82" y="368" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">N…</text>
<text x="136" y="359" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">심야버스</text>
<text x="136" y="380" font-size="15" font-weight="400" fill="#5f5b55" text-anchor="start">밤 11시 10분쯤~새벽 6시</text>
<text x="672" y="369" font-size="17" font-weight="700" fill="#16151a" text-anchor="end">2,500원</text>
<text x="32" y="414" font-size="15" font-weight="400" fill="#5f5b55" text-anchor="start">어른, 교통카드 요금</text>
</svg>
