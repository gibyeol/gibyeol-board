<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 613" role="img" aria-label="서울 버스 색깔 한눈에" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>서울 버스 색깔 한눈에</title>
<rect width="400" height="613" rx="16" fill="#f4f0e6"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16151a"/></marker></defs>
<text x="20" y="39" font-size="21" fill="#16151a" font-weight="bold" text-anchor="start">서울 버스 색깔 한눈에</text>
<rect x="16" y="61" width="368" height="92" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="89" width="68" height="36" rx="12" fill="#2f5d9e"/>
<text x="62" y="113" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">파랑</text>
<text x="108" y="90" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">간선</text>
<text x="108" y="113" font-size="16" fill="#5f5b55" text-anchor="start">외곽과 도심을 길게</text>
<text x="108" y="136" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">1,500원</text>
<rect x="16" y="163" width="368" height="92" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="191" width="68" height="36" rx="12" fill="#3d7a4a"/>
<text x="62" y="215" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">초록</text>
<text x="108" y="192" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">지선·마을</text>
<text x="108" y="215" font-size="16" fill="#5f5b55" text-anchor="start">동네와 간선버스·지하철을 이어요</text>
<text x="108" y="238" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">1,500원(마을 1,200원)</text>
<rect x="16" y="265" width="368" height="92" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="293" width="68" height="36" rx="12" fill="#d9a521"/>
<text x="62" y="317" font-size="17" fill="#16151a" font-weight="bold" text-anchor="middle">노랑</text>
<text x="108" y="294" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">순환</text>
<text x="108" y="317" font-size="16" fill="#5f5b55" text-anchor="start">도심 안을 돌아요</text>
<text x="108" y="340" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">1,400원</text>
<rect x="16" y="367" width="368" height="92" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="395" width="68" height="36" rx="12" fill="#b8392f"/>
<text x="62" y="419" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">빨강</text>
<text x="108" y="396" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">광역</text>
<text x="108" y="419" font-size="16" fill="#5f5b55" text-anchor="start">수도권과 도심 연결</text>
<text x="108" y="442" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">3,000원</text>
<rect x="16" y="469" width="368" height="92" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="497" width="68" height="36" rx="12" fill="#16151a"/>
<text x="62" y="521" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">N…</text>
<text x="108" y="498" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">심야버스</text>
<text x="108" y="521" font-size="16" fill="#5f5b55" text-anchor="start">지하철이 끊긴 밤에</text>
<text x="108" y="544" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">2,500원</text>
<text x="20" y="589" font-size="16" fill="#5f5b55" text-anchor="start">어른, 교통카드 요금</text>
</svg>
