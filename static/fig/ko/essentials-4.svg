<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 424" role="img" aria-label="카드 네 가지, 결제 방법" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>카드 네 가지, 결제 방법</title>
<rect width="400" height="424" fill="#f4f0e6"/>
<text x="20" y="42" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">카드 네 가지, 결제 방법</text>
<rect x="16" y="56" width="368" height="67" rx="10" fill="#e9e2d3"/>
<rect x="30" y="66" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="88" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">T</text>
<text x="78" y="81" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">티머니</text>
<text x="78" y="103" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">편의점·역 기계. 충전은 대개 현금</text>
<rect x="16" y="133" width="368" height="89" rx="10" fill="#e9e2d3"/>
<rect x="30" y="143" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="165" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
<text x="78" y="158" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">공항철도 티머니 카드</text>
<text x="78" y="180" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">공항철도역에서 1만 5천 원. 해외</text>
<text x="78" y="202" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">신용카드 가능</text>
<rect x="16" y="232" width="368" height="67" rx="10" fill="#e9e2d3"/>
<rect x="30" y="242" width="37.334" height="32" rx="8" fill="#b8392f"/>
<text x="48.667" y="264" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">W</text>
<text x="79.334" y="257" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">WOWPASS</text>
<text x="79.334" y="279" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">주요 역 기계에서 자국 통화로 충전</text>
<rect x="16" y="309" width="368" height="89" rx="10" fill="#e9e2d3"/>
<rect x="30" y="319" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="341" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
<text x="78" y="334" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">기후동행카드 단기권</text>
<text x="78" y="356" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">서울 전용. 273개 역 새 기계가</text>
<text x="78" y="378" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">비자·마스터 결제</text>
</svg>
