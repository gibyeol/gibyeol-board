<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="집에서 다시 사려면" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>집에서 다시 사려면</title>
<rect width="400" height="250" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">집에서 다시 사려면</text>
<rect x="16" y="54" width="368" height="52" rx="10" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="32" y="87" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">미국에 사나요?</text>
<line x1="100" y1="106" x2="100" y2="132" stroke="#16151a" stroke-width="2.5"/>
<path d="M93,130 L100,140 L107,130 z" fill="#16151a"/>
<text x="110" y="130" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">예</text>
<line x1="300" y1="106" x2="300" y2="132" stroke="#16151a" stroke-width="2.5"/>
<path d="M293,130 L300,140 L307,130 z" fill="#16151a"/>
<text x="310" y="130" font-size="16" font-weight="700" fill="#5f5b55" text-anchor="start">아니요</text>
<rect x="16" y="140" width="180" height="92" rx="10" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<text x="28" y="168" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">올리브영 US</text>
<text x="28" y="190" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">2026년 5월 29일부터</text>
<text x="28" y="212" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">글로벌몰은 미국 서비스 중단</text>
<rect x="204" y="140" width="180" height="92" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<text x="216" y="168" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">올리브영 글로벌</text>
<text x="216" y="190" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">결제할 때 내 나라로</text>
<text x="216" y="212" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">배송되는지 확인</text>
</svg>
