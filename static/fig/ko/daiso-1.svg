<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" role="img" aria-label="한국 다이소 가격 6가지: ₩500~₩5,000" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>한국 다이소 가격 6가지: ₩500~₩5,000</title>
<rect width="400" height="360" rx="16" fill="#f4f0e6"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16151a"/></marker></defs>
<text x="20" y="39" font-size="21" fill="#16151a" font-weight="bold" text-anchor="start">한국 다이소 가격 6가지:</text>
<text x="20" y="68" font-size="21" fill="#16151a" font-weight="bold" text-anchor="start">₩500~₩5,000</text>
<text x="20" y="94" font-size="16" fill="#5f5b55" text-anchor="start">최저가와 최고가</text>
<line x1="56" y1="144" x2="344" y2="144" stroke="#e9e2d3" stroke-width="16" stroke-linecap="round"/>
<line x1="56" y1="144" x2="344" y2="144" stroke="#c9c1b2" stroke-width="2" stroke-dasharray="2 8"/>
<circle cx="56" cy="144" r="11" fill="#16151a"/>
<circle cx="344" cy="144" r="11" fill="#b8392f"/>
<text x="56" y="190" font-size="24" fill="#16151a" font-weight="bold" text-anchor="middle">₩500</text>
<text x="56" y="216" font-size="17" fill="#5f5b55" text-anchor="middle">최저가</text>
<text x="344" y="190" font-size="24" fill="#b8392f" font-weight="bold" text-anchor="middle">₩5,000</text>
<text x="344" y="216" font-size="17" fill="#b8392f" font-weight="bold" text-anchor="middle">최고가</text>
<rect x="16" y="248" width="368" height="94" rx="12" fill="#e9e2d3"/>
<text x="28" y="278" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">가격은 모두 6가지</text>
<text x="28" y="301" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">(아성다이소, 2026년 11월).</text>
<text x="28" y="323" font-size="16" fill="#5f5b55" text-anchor="start">가격표를 확인하세요.</text>
</svg>
