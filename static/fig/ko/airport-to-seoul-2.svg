<circle cx="46" cy="88" r="8" fill="#ffffff" stroke="#b8392f" stroke-width="2.5"/>
<text x="200" y="140" font-size="16" font-weight="700" fill="#16151a" text-anchor="middle">인천공항1터미널</text>
<circle cx="354" cy="134" r="8" fill="#ffffff" stroke="#16151a" stroke-width="2.5"/>
<circle cx="46" cy="134" r="8" fill="#ffffff" stroke="#b8392f" stroke-width="2.5"/>
<text x="200" y="186" font-size="18" font-weight="700" fill="#5f5b55" text-anchor="middle">…</text>
<circle cx="354" cy="168" r="3.5" fill="#ffffff" stroke="#16151a" stroke-width="1.5"/>
