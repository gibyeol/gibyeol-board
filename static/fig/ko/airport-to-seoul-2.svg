<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 444" role="img" aria-label="같은 선로, 두 종류의 열차" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>같은 선로, 두 종류의 열차</title>
<rect width="400" height="444" fill="#f4f0e6"/>
