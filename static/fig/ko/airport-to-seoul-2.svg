<circle cx="46" cy="318" r="8" fill="#ffffff" stroke="#b8392f" stroke-width="2.5"/>
<text x="20" y="360" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">직통: 13,000원, 1터미널에서 43분,</text>
