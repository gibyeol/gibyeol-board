<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 415" role="img" aria-label="인천에서 제주로: 두 가지 길" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>인천에서 제주로: 두 가지 길</title>
<rect width="400" height="415" fill="#f4f0e6"/>
<text x="20" y="42" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">인천에서 제주로: 두 가지 길</text>
<rect x="16" y="56" width="368" height="89" rx="10" fill="#e9e2d3"/>
<rect x="30" y="66" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="88" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
<text x="78" y="81" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">김포를 거쳐서, 매일</text>
<text x="78" y="103" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">인천에서 공항철도로 김포, 그다음</text>
<text x="78" y="125" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">국내선</text>
<rect x="16" y="155" width="368" height="89" rx="10" fill="#e9e2d3"/>
<rect x="30" y="165" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="187" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
<text x="78" y="180" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">직항, 주 3회</text>
<text x="78" y="202" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">제주항공 인천–제주: 월·수·금, 2027년</text>
<text x="78" y="224" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">3월 27일까지</text>
<rect x="16" y="254" width="368" height="89" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<rect x="30" y="264" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="286" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
<text x="78" y="279" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">일찍 예매</text>
<text x="78" y="301" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">김포–제주는 세계에서 가장 붐비는</text>
<text x="78" y="323" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">노선인데, 2026년 좌석이 줄었어요</text>
<text x="20" y="371" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">국내선: 외국인은 여권. 대한항공 체크인은 출발</text>
<text x="20" y="393" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">30분 전 마감.</text>
</svg>
