<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 432" role="img" aria-label="서울역 탑승수속" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>서울역 탑승수속</title>
<rect width="400" height="432" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">서울역 탑승수속</text>
<rect x="20" y="60" width="360" height="40" rx="8" fill="#16151a" stroke="#16151a" stroke-width="1"/>
<text x="36" y="86" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">서울역 지하 2층</text>
<text x="20" y="128" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">탑승수속, 짐 부치기</text>
<text x="20" y="154" font-size="22" font-weight="700" fill="#16151a" text-anchor="start">05:20~19:00</text>
<text x="20" y="186" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">출국심사</text>
<text x="20" y="212" font-size="22" font-weight="700" fill="#16151a" text-anchor="start">05:30~19:00</text>
<text x="20" y="242" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">출발 기준 수속 마감</text>
<rect x="20" y="254" width="360" height="40" rx="8" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<text x="36" y="280" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">제1터미널</text>
<text x="364" y="280" font-size="18" font-weight="700" fill="#b8392f" text-anchor="end">3시간 전</text>
<rect x="20" y="302" width="360" height="40" rx="8" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<text x="36" y="328" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">제2터미널</text>
<text x="364" y="328" font-size="18" font-weight="700" fill="#b8392f" text-anchor="end">3시간 20분 전</text>
<text x="20" y="370" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">공항철도 직통열차 승차권만</text>
<text x="20" y="392" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">당일 인천 출발 국제선,</text>
<text x="20" y="414" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">일부 항공사만</text>
