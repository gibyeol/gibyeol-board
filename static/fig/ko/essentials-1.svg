<path d="M22 549 H378" stroke="#c9c1b2" stroke-width="1"/>
<text x="52" y="576" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">현금 조금</text>
<text x="52" y="598" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">티머니 충전, 시장 음식</text>
<rect x="22" y="565" width="20" height="20" rx="4" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<path d="M22 610 H378" stroke="#c9c1b2" stroke-width="1"/>
</svg>
