<text x="58" y="326" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">4호선 → 명동</text>
<text x="20" y="372" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">기차가 없으면 공항버스</text>
<rect x="20" y="384" width="360" height="222" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="36" y="412" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">6001</text>
<text x="92" y="412" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">명동, 동대문</text>
<text x="36" y="442" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">6002</text>
<text x="92" y="442" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">홍대, 종로</text>
<text x="36" y="472" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">6011</text>
<text x="92" y="472" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">경복궁, 창덕궁</text>
<text x="36" y="502" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">6701</text>
<text x="92" y="502" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">광화문, 시청, 을지로</text>
