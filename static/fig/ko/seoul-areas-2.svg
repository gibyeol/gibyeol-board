<text x="36" y="592" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">6020</text>
<text x="92" y="592" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">강남</text>
<text x="20" y="628" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">2026년 6월 기준 시간(Visit Seoul)</text>
