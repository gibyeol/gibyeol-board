<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 646" role="img" aria-label="인천공항에서 동네까지" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>인천공항에서 동네까지</title>
<rect width="400" height="646" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">인천공항에서 동네까지</text>
<rect x="20" y="62" width="360" height="36" rx="8" fill="#16151a" stroke="#16151a" stroke-width="1"/>
<text x="36" y="86" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">인천공항</text>
<text x="364" y="86" font-size="16" font-weight="700" fill="#ffffff" text-anchor="end">공항철도</text>
<line x1="36" y1="98" x2="36" y2="274" stroke="#b8392f" stroke-width="5"/>
<circle cx="36" cy="122" r="9" fill="#ffffff" stroke="#b8392f" stroke-width="3"/>
<text x="58" y="128" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">홍대입구</text>
