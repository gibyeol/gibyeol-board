<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 394" role="img" aria-label="처음 장바구니 세 가지" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>처음 장바구니 세 가지</title>
<rect width="400" height="394" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">처음 장바구니 세 가지</text>
<rect x="16" y="54" width="368" height="92" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="40" y="70.0" width="24" height="52" rx="6" fill="#e9e2d3" stroke="#16151a" stroke-width="2"/>
<rect x="45" y="122.0" width="14" height="10" rx="2" fill="#16151a" stroke="none" stroke-width="0"/>
<text x="96" y="84" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">1. 선크림</text>
<text x="96" y="108" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">매일 쓰니까</text>
<text x="96" y="130" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">끝까지 써요</text>
<rect x="16" y="156" width="368" height="92" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<ellipse cx="52" cy="188.0" rx="24" ry="7" fill="#e9e2d3" stroke="#16151a" stroke-width="2"/>
<rect x="28" y="188.0" width="48" height="34" rx="4" fill="#e9e2d3" stroke="#16151a" stroke-width="2"/>
<text x="96" y="186" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">2. 토너 패드</text>
<text x="96" y="210" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">용기 하나라</text>
<text x="96" y="232" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">챙기기 쉬워요</text>
<rect x="16" y="258" width="368" height="92" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="30" y="278.0" width="44" height="52" rx="3" fill="#e9e2d3" stroke="#16151a" stroke-width="2"/>
<line x1="38" y1="292.0" x2="66" y2="292.0" stroke="#16151a" stroke-width="2"/>
<text x="96" y="288" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">3. 시트 마스크</text>
<text x="96" y="312" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">싸고 납작하고</text>
<text x="96" y="334" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">한 번에 한 장</text>
<text x="20" y="376" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">뺀 것: 유행하는 상품과 랭킹</text>
</svg>
