<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 538" role="img" aria-label="다이소에서 사는 것, 누구를 위해" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>다이소에서 사는 것, 누구를 위해</title>
<rect width="400" height="538" rx="16" fill="#f4f0e6"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16151a"/></marker></defs>
<text x="20" y="39" font-size="21" fill="#16151a" font-weight="bold" text-anchor="start">다이소에서 사는 것, 누구를 위해</text>
<rect x="16" y="61" width="368" height="119" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<rect x="44" y="98" width="28" height="40" rx="6" fill="#ffffff" stroke="#16151a" stroke-width="2.5"/><rect x="50" y="88" width="16" height="11" rx="2" fill="#b8392f"/><line x1="51" y1="116" x2="65" y2="116" stroke="#c9c1b2" stroke-width="3"/>
<text x="100" y="91" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">저가 화장품</text>
<text x="100" y="114" font-size="16" fill="#5f5b55" text-anchor="start">뷰티 브랜드 약 170개(2026년)</text>
<text x="100" y="136" font-size="16" fill="#5f5b55" text-anchor="start">작은 용량·다이소 전용 라인이 많음</text>
<text x="100" y="162" font-size="16" fill="#b8392f" font-weight="bold" text-anchor="start">누구에게: 나</text>
<rect x="16" y="192" width="368" height="119" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<path d="M38,228 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5 v46 h-40 z" fill="#e9e2d3" stroke="#16151a" stroke-width="2.5" stroke-linejoin="round"/><circle cx="58" cy="254" r="9" fill="#b8392f"/>
<text x="100" y="222" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">과자와 작은 기념품</text>
<text x="100" y="245" font-size="16" fill="#5f5b55" text-anchor="start">과자는 대체로 ₩1,000~₩2,000</text>
<text x="100" y="267" font-size="16" fill="#5f5b55" text-anchor="start">캐릭터 상품, 포토카드 용품</text>
<text x="100" y="293" font-size="16" fill="#b8392f" font-weight="bold" text-anchor="start">누구에게: 나눠 줄 사람들, K-팝 팬</text>
<rect x="16" y="323" width="368" height="119" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<rect x="40" y="368" width="36" height="30" rx="6" fill="#ffffff" stroke="#16151a" stroke-width="2.5"/><line x1="51" y1="368" x2="51" y2="356" stroke="#16151a" stroke-width="4"/><line x1="65" y1="368" x2="65" y2="356" stroke="#16151a" stroke-width="4"/><path d="M58,398 q0,12 12,14" fill="none" stroke="#b8392f" stroke-width="3"/>
<text x="100" y="353" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">여행 중 필요한 물건</text>
<text x="100" y="376" font-size="16" fill="#5f5b55" text-anchor="start">멀티 어댑터, 수하물 저울, 휴대폰</text>
<text x="100" y="398" font-size="16" fill="#5f5b55" text-anchor="start">충전기</text>
<text x="100" y="424" font-size="16" fill="#b8392f" font-weight="bold" text-anchor="start">누구에게: 여행 중의 나</text>
<rect x="16" y="454" width="368" height="66" rx="12" fill="#e9e2d3"/>
<text x="30" y="481" font-size="16" fill="#16151a" text-anchor="start">누구에게 맞는지는 저희 판단. 가격은 가격표로</text>
<text x="30" y="503" font-size="16" fill="#16151a" text-anchor="start">확인.</text>
</svg>
