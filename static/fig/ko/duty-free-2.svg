<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 406" role="img" aria-label="인천공항 인도장, 4층" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>인천공항 인도장, 4층</title>
<rect width="400" height="406" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">인천공항 인도장, 4층</text>
<rect x="16" y="54" width="368" height="66" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="16" y="54" width="10" height="66" rx="3" fill="#16151a" stroke="none" stroke-width="0"/>
<text x="40" y="81" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">1터미널 동편</text>
<text x="40" y="105" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">10~11번 게이트 맞은편</text>
<rect x="16" y="128" width="368" height="66" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="16" y="128" width="10" height="66" rx="3" fill="#16151a" stroke="none" stroke-width="0"/>
<text x="40" y="155" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">1터미널 서편</text>
<text x="40" y="179" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">43~45번 게이트 맞은편</text>
<rect x="16" y="202" width="368" height="66" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="16" y="202" width="10" height="66" rx="3" fill="#16151a" stroke="none" stroke-width="0"/>
<text x="40" y="229" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">1터미널 탑승동</text>
<text x="40" y="253" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">119번 게이트 옆, 셔틀트레인</text>
<rect x="16" y="276" width="368" height="66" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="16" y="276" width="10" height="66" rx="3" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="40" y="303" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">2터미널</text>
<text x="40" y="327" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">252번 게이트 옆, 구름다리 건너</text>
<text x="20" y="366" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">어느 인도장인지는 교환권에 있어요.</text>
<text x="20" y="388" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">신라: 출발 1~2시간 전까지</text>
</svg>
