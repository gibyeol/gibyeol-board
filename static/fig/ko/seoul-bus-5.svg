<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 452" role="img" aria-label="N버스 두 종류" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>N버스 두 종류</title>
<rect width="400" height="452" rx="16" fill="#f4f0e6"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16151a"/></marker></defs>
<text x="20" y="39" font-size="21" fill="#16151a" font-weight="bold" text-anchor="start">N버스 두 종류</text>
<rect x="16" y="61" width="368" height="152" rx="12" fill="#ffffff" stroke="#16151a" stroke-width="3"/>
<text x="32" y="94" font-size="19" fill="#16151a" font-weight="bold" text-anchor="start">N + 노선 번호</text>
<text x="32" y="118" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">시내 심야버스</text>
<text x="32" y="147" font-size="17" fill="#16151a" text-anchor="start">14개 노선</text>
<text x="32" y="170" font-size="17" fill="#16151a" text-anchor="start">밤 11시~새벽 6시</text>
<text x="32" y="193" font-size="17" fill="#16151a" text-anchor="start">교통카드 2,500원, 태그만</text>
<text x="200" y="239" font-size="22" fill="#b8392f" font-weight="bold" text-anchor="middle">≠</text>
<rect x="16" y="251" width="368" height="129" rx="12" fill="#ffffff" stroke="#b8392f" stroke-width="3"/>
<text x="32" y="284" font-size="19" fill="#b8392f" font-weight="bold" text-anchor="start">N6000 · N6002 · N6701 · N6703</text>
<text x="32" y="308" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">심야 공항버스</text>
<text x="32" y="337" font-size="17" fill="#16151a" text-anchor="start">17,000~18,000원</text>
<text x="32" y="360" font-size="17" fill="#16151a" text-anchor="start">표를 사서 타요</text>
<rect x="16" y="392" width="368" height="44" rx="12" fill="#e9e2d3"/>
<text x="200" y="419" font-size="16" fill="#16151a" text-anchor="middle">같은 N이지만 요금은 약 7배 차이</text>
</svg>
