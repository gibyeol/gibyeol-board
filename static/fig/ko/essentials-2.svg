<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-label="입국신고서인가, K-ETA인가?" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>입국신고서인가, K-ETA인가?</title>
<rect width="400" height="440" fill="#f4f0e6"/>
<text x="20" y="42" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">입국신고서인가, K-ETA인가?</text>
<rect x="16" y="56" width="368" height="91" rx="10" fill="#e9e2d3"/>
<text x="30" y="81" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">유효한 K-ETA가 있나요?</text>
<rect x="26" y="95" width="348" height="38" rx="8" fill="#ffffff"/>
<rect x="36" y="105" width="41.120000000000005" height="26" rx="13" fill="#b8392f"/>
<text x="56.56" y="123" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">예</text>
<text x="87.12" y="117" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">입국신고서 필요 없음</text>
<path d="M44 149 V171" stroke="#5f5b55" stroke-width="2"/>
<path d="M38 165 L44 173 L50 165" fill="none" stroke="#5f5b55" stroke-width="2"/>
<text x="60" y="167" font-size="16" font-weight="700" fill="#5f5b55" text-anchor="start">아니요</text>
<rect x="16" y="179" width="368" height="136" rx="10" fill="#e9e2d3"/>
<text x="30" y="204" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">K-ETA 면제 대상 여권인가요? (2027년</text>
<text x="30" y="227" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">12월 31일까지)</text>
<rect x="26" y="241" width="348" height="60" rx="8" fill="#ffffff"/>
<rect x="36" y="251" width="41.120000000000005" height="26" rx="13" fill="#b8392f"/>
<text x="56.56" y="269" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">예</text>
<text x="87.12" y="263" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">전자입국신고서 제출</text>
<text x="87.12" y="285" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">무료, 도착 3일 전부터</text>
<path d="M44 317 V339" stroke="#5f5b55" stroke-width="2"/>
<path d="M38 333 L44 341 L50 333" fill="none" stroke="#5f5b55" stroke-width="2"/>
<text x="60" y="335" font-size="16" font-weight="700" fill="#5f5b55" text-anchor="start">아니요</text>
<rect x="16" y="347" width="368" height="67" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<text x="30" y="372" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">먼저 K-ETA 신청</text>
<text x="30" y="394" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">1만 원, 예약 전에</text>
</svg>
