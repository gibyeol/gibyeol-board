<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 393" role="img" aria-label="タクシーに忘れ物?払い方から考える" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>タクシーに忘れ物?払い方から考える</title>
<rect width="400" height="393" fill="#f4f0e6"/>
<text x="20" y="42" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">タクシーに忘れ物?払い方から考える</text>
<rect x="16" y="56" width="368" height="67" rx="10" fill="#e9e2d3"/>
<rect x="30" y="66" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="88" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
<text x="78" y="81" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">アプリで呼んだ</text>
<text x="78" y="103" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">利用履歴から運転手に電話・メッセージ</text>
<rect x="16" y="133" width="368" height="89" rx="10" fill="#e9e2d3"/>
<rect x="30" y="143" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="165" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
<text x="78" y="158" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">交通カードで払った</text>
<text x="78" y="180" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">T-money 1644-1188、Cashbee</text>
<text x="78" y="202" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">1644-1472。カード番号を手元に</text>
<rect x="16" y="232" width="368" height="89" rx="10" fill="#e9e2d3"/>
<rect x="30" y="242" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="264" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
<text x="78" y="257" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">現金、アプリなし</text>
<text x="78" y="279" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">ナンバー、場所、時間をメモして1330</text>
<text x="78" y="301" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">に相談</text>
<text x="20" y="349" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">タクシー会社は約1週間保管し、その後警察へ渡</text>
<text x="20" y="371" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">します。</text>
</svg>
