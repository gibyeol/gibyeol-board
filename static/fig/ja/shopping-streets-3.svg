<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 667" role="img" aria-label="2号線で半日コース" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>2号線で半日コース</title>
<rect width="400" height="667" rx="16" fill="#f4f0e6"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16151a"/></marker></defs>
<text x="20" y="39" font-size="21" fill="#16151a" font-weight="bold" text-anchor="start">2号線で半日コース</text>
<rect x="16" y="61" width="368" height="117" rx="12" fill="#ffffff" stroke="#b8392f" stroke-width="2.5"/>
<circle cx="42" cy="120" r="15" fill="#b8392f"/>
<text x="42" y="126" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="72" y="92" font-size="19" fill="#16151a" font-weight="bold" text-anchor="start">聖水</text>
<text x="72" y="116" font-size="17" fill="#16151a" text-anchor="start">午後早め</text>
<text x="72" y="138" font-size="16" fill="#5f5b55" text-anchor="start">4番(または3番)出口</text>
<text x="72" y="160" font-size="16" fill="#5f5b55" text-anchor="start">演武場キルへ</text>
<line x1="42" y1="179" x2="42" y2="195" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="16" y="198" width="368" height="95" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<circle cx="42" cy="246" r="15" fill="#16151a"/>
<text x="42" y="252" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="72" y="229" font-size="19" fill="#16151a" font-weight="bold" text-anchor="start">2号線</text>
<text x="72" y="253" font-size="17" fill="#16151a" text-anchor="start">乗って移動</text>
<text x="72" y="275" font-size="16" fill="#5f5b55" text-anchor="start">東大門歴史文化公園駅まで</text>
<line x1="42" y1="294" x2="42" y2="310" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="16" y="313" width="368" height="117" rx="12" fill="#ffffff" stroke="#b8392f" stroke-width="2.5"/>
<circle cx="42" cy="372" r="15" fill="#b8392f"/>
<text x="42" y="378" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="72" y="344" font-size="19" fill="#16151a" font-weight="bold" text-anchor="start">東大門</text>
<text x="72" y="368" font-size="17" fill="#16151a" text-anchor="start">夜</text>
<text x="72" y="390" font-size="16" fill="#5f5b55" text-anchor="start">1番出口 → DDP</text>
<text x="72" y="412" font-size="16" fill="#5f5b55" text-anchor="start">DOOTAは0時まで</text>
<line x1="42" y1="431" x2="42" y2="447" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="16" y="450" width="368" height="117" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<circle cx="42" cy="508" r="15" fill="#16151a"/>
<text x="42" y="514" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<text x="72" y="481" font-size="19" fill="#16151a" font-weight="bold" text-anchor="start">レシート</text>
<text x="72" y="505" font-size="17" fill="#16151a" text-anchor="start">パスポートと一緒に</text>
<text x="72" y="527" font-size="16" fill="#5f5b55" text-anchor="start">1枚100万ウォン超 →</text>
<text x="72" y="549" font-size="16" fill="#5f5b55" text-anchor="start">その場の還付は不可</text>
<rect x="16" y="583" width="368" height="66" rx="12" fill="#e9e2d3"/>
<text x="30" y="610" font-size="16" fill="#16151a" text-anchor="start">コスメ優先なら聖水を明洞に</text>
<text x="30" y="632" font-size="16" fill="#16151a" text-anchor="start">(乙支路入口駅も2号線)。</text>
</svg>
