<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 547" role="img" aria-label="プラグは挿さる?" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>プラグは挿さる?</title>
<rect width="400" height="547" fill="#f4f0e6"/>
<text x="20" y="42" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">プラグは挿さる?</text>
<circle cx="100" cy="122" r="52" fill="#ffffff" stroke="#16151a" stroke-width="2.5"/>
<circle cx="80" cy="122" r="9" fill="#16151a"/>
<circle cx="120" cy="122" r="9" fill="#16151a"/>
<rect x="276" y="78" width="9" height="30" rx="2" fill="#16151a"/>
<rect x="305" y="78" width="9" height="30" rx="2" fill="#16151a"/>
<rect x="256" y="106" width="78" height="66" rx="12" fill="#e9e2d3" stroke="#16151a" stroke-width="2"/>
<text x="200" y="132" font-size="22" font-weight="700" fill="#b8392f" text-anchor="middle">≠</text>
<text x="100" y="204" font-size="17" font-weight="700" fill="#16151a" text-anchor="middle">韓国</text>
<text x="100" y="226" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="middle">220V・60Hz</text>
<text x="100" y="248" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="middle">丸ピン2本</text>
<text x="295" y="204" font-size="17" font-weight="700" fill="#16151a" text-anchor="middle">日本</text>
<text x="295" y="226" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="middle">100V</text>
<text x="295" y="248" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="middle">平たいピン</text>
<text x="20" y="293" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">変換プラグが必要です。次に表示を確認:</text>
<rect x="16" y="309" width="368" height="67" rx="10" fill="#e9e2d3"/>
<rect x="30" y="319" width="119.76680000000002" height="32" rx="8" fill="#b8392f"/>
<text x="89.88340000000001" y="341" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">100–240V</text>
<text x="161.76680000000002" y="334" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">変換プラグだけでOK</text>
<text x="161.76680000000002" y="356" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">スマホやPCの充電器の多く</text>
<rect x="16" y="386" width="368" height="89" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<rect x="30" y="396" width="109.36640000000001" height="32" rx="8" fill="#b8392f"/>
<text x="84.6832" y="418" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">100V専用</text>
<text x="151.3664" y="411" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">変圧器が必要</text>
<text x="151.3664" y="433" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">ドライヤー、ヘアアイロンは</text>
<text x="151.3664" y="455" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">持って行かないほうが無難</text>
<text x="20" y="503" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">ホテルのフロントで借りられることも。仁川空港</text>
<text x="20" y="525" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">のコンビニや免税店でも販売。</text>
</svg>
