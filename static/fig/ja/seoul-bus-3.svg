<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 391" role="img" aria-label="降りてから乗り換えできる時間" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>降りてから乗り換えできる時間</title>
<rect width="400" height="391" rx="16" fill="#f4f0e6"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16151a"/></marker></defs>
<text x="20" y="39" font-size="21" fill="#16151a" font-weight="bold" text-anchor="start">降りてから乗り換えできる時間</text>
<text x="32" y="77" font-size="16" fill="#b8392f" font-weight="bold" text-anchor="start">降車タッチ</text>
<text x="20" y="108" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">7時〜21時</text>
<rect x="38" y="120" width="342" height="44" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="38" y="120" width="171" height="44" rx="10" fill="#e9e2d3" stroke="#16151a" stroke-width="1.5"/>
<text x="123.5" y="148" font-size="18" fill="#16151a" font-weight="bold" text-anchor="middle">30分</text>
<circle cx="38" cy="142" r="9" fill="#b8392f"/>
<text x="20" y="201" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">21時〜翌7時</text>
<rect x="38" y="213" width="342" height="44" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="38" y="213" width="342" height="44" rx="10" fill="#e9e2d3" stroke="#16151a" stroke-width="1.5"/>
<text x="209" y="241" font-size="18" fill="#16151a" font-weight="bold" text-anchor="middle">60分</text>
<circle cx="38" cy="235" r="9" fill="#b8392f"/>
<text x="20" y="294" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">この間に次のバス・地下鉄に乗れば</text>
<text x="20" y="317" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">乗り換え</text>
<circle cx="26" cy="338" r="3.5" fill="#5f5b55"/>
<text x="38" y="343" font-size="16" fill="#5f5b55" text-anchor="start">乗り換えは4回まで</text>
<circle cx="26" cy="360" r="3.5" fill="#5f5b55"/>
<text x="38" y="365" font-size="16" fill="#5f5b55" text-anchor="start">同じ路線の再乗車は対象外</text>
</svg>
