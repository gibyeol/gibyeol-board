<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 468" role="img" aria-label="この画像を保存して、近くの人に見せる" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>この画像を保存して、近くの人に見せる</title>
<rect width="400" height="468" fill="#f4f0e6"/>
<text x="20" y="42" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">この画像を保存して、近くの人</text>
<text x="20" y="68" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">に見せる</text>
<rect x="16" y="82" width="368" height="106" rx="10" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<rect x="26" y="96" width="64" height="34" rx="8" fill="#b8392f"/>
<text x="58" y="119" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">112</text>
<rect x="16" y="198" width="368" height="106" rx="10" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<rect x="26" y="212" width="64" height="34" rx="8" fill="#b8392f"/>
<text x="58" y="235" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">119</text>
<rect x="16" y="314" width="368" height="128" rx="10" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<rect x="26" y="328" width="64" height="34" rx="8" fill="#b8392f"/>
<text x="58" y="351" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1330</text>
<text x="100" y="116" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">도와주세요. 112(경찰)에 신</text>
<text x="100" y="146" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">고해 주시겠어요?</text>
<text x="100" y="168" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">警察(112)に通報してもらえますか?</text>
<text x="100" y="232" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">구급차를 불러 주세요. 119</text>
<text x="100" y="262" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">에 전화해 주세요.</text>
<text x="100" y="284" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">救急車(119)を呼んでください。</text>
<text x="100" y="348" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">한국어를 못 해요. 1330에</text>
<text x="100" y="378" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">전화해 주실 수 있나요?</text>
<text x="100" y="400" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">韓国語が話せません。1330に電話し</text>
<text x="100" y="422" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">てもらえますか?</text>
</svg>
