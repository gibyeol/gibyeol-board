<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-label="免税店?タックスフリー?" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>免税店?タックスフリー?</title>
<rect width="400" height="340" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">免税店?タックスフリー?</text>
<rect x="16" y="54" width="368" height="116" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<text x="32" y="84" font-size="18" font-weight="700" fill="#b8392f" text-anchor="start">免税店</text>
<text x="32" y="110" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">韓国を出国する人だけ</text>
<text x="32" y="134" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">品物は出国審査のあと</text>
<text x="32" y="158" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">引き渡し場で受け取る</text>
<rect x="16" y="182" width="368" height="116" rx="10" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<text x="32" y="212" font-size="18" font-weight="700" fill="#16151a" text-anchor="start">タックスフリーのお店</text>
<text x="32" y="238" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">オリーブヤングなど普通のお店</text>
<text x="32" y="262" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">品物はその場で持ち帰る</text>
<text x="32" y="286" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">付加価値税10%の一部が戻る</text>
<text x="20" y="322" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">1回の買い物で使えるのはどちらか一方</text>
</svg>
