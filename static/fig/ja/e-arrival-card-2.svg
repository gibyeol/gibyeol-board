<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" role="img" aria-label="31日に到着するなら" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<rect width="400" height="550" fill="#f4f0e6"/>
<text x="16" y="40" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">31日に到着するなら</text>
<text x="16" y="62" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">日付は韓国時間</text>
<rect x="16" y="76" width="368" height="68" rx="10" fill="#e9e2d3" stroke="#e9e2d3" stroke-width="1"/>
<rect x="28" y="88" width="56" height="36" rx="8" fill="#ffffff"/>
<text x="56.0" y="112" font-size="16" font-weight="700" fill="#5f5b55" text-anchor="middle">28日</text>
<text x="96" y="110" font-size="17" font-weight="700" fill="#5f5b55" text-anchor="start">まだ早い</text>
<text x="96" y="134" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">受付が始まっていません</text>
<rect x="16" y="154" width="368" height="68" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<rect x="28" y="166" width="56" height="36" rx="8" fill="#b8392f"/>
<text x="56.0" y="190" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">29日</text>
<text x="96" y="188" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">受付開始</text>
<text x="96" y="212" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">到着の3日前から</text>
<rect x="16" y="232" width="368" height="64" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1"/>
<rect x="28" y="244" width="56" height="36" rx="8" fill="#16151a"/>
<text x="56.0" y="268" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">30日</text>
<text x="96" y="266" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">提出できます</text>
<rect x="16" y="306" width="368" height="90" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1"/>
<rect x="28" y="318" width="56" height="36" rx="8" fill="#16151a"/>
<text x="56.0" y="342" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">31日</text>
<text x="96" y="340" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">到着</text>
<text x="96" y="364" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">入国審査の前までなら</text>
<text x="96" y="386" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">提出できます</text>
<rect x="16" y="412" width="368" height="90" rx="10" fill="#e9e2d3" stroke="#e9e2d3" stroke-width="1"/>
<text x="30" y="446" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">申告書が使えなくなる時</text>
<text x="30" y="470" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">提出から72時間、または</text>
<text x="30" y="492" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">入国審査を通った時点</text>
<text x="16" y="534" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">便が変わったら出し直しましょう。</text>
</svg>
