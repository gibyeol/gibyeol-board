<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 499" role="img" aria-label="同じ路線に2種類" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>同じ路線に2種類</title>
<rect width="400" height="499" rx="16" fill="#f4f0e6"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16151a"/></marker></defs>
<text x="20" y="39" font-size="21" fill="#16151a" font-weight="bold" text-anchor="start">同じ路線に2種類</text>
<text x="252" y="79" font-size="17" fill="#16151a" font-weight="bold" text-anchor="middle">一般列車</text>
<text x="340" y="79" font-size="17" fill="#b8392f" font-weight="bold" text-anchor="middle">直通列車</text>
<line x1="252" y1="107" x2="252" y2="275" stroke="#16151a" stroke-width="5"/>
<line x1="340" y1="107" x2="340" y2="275" stroke="#b8392f" stroke-width="5"/>
<text x="24" y="113" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">ソウル駅</text>
<circle cx="252" cy="107" r="9" fill="#16151a"/>
<circle cx="340" cy="107" r="9" fill="#b8392f" stroke="#b8392f" stroke-width="2.5"/>
<text x="24" y="155" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">孔徳</text>
<circle cx="252" cy="149" r="9" fill="#16151a"/>
<circle cx="340" cy="149" r="9" fill="#ffffff" stroke="#b8392f" stroke-width="2.5"/>
<text x="24" y="197" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">弘大入口</text>
<circle cx="252" cy="191" r="9" fill="#16151a"/>
<circle cx="340" cy="191" r="9" fill="#ffffff" stroke="#b8392f" stroke-width="2.5"/>
<text x="24" y="239" font-size="17" fill="#5f5b55" text-anchor="start">…</text>
<text x="24" y="281" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">仁川空港</text>
<circle cx="252" cy="275" r="9" fill="#16151a"/>
<circle cx="340" cy="275" r="9" fill="#b8392f" stroke="#b8392f" stroke-width="2.5"/>
<rect x="16" y="299" width="368" height="87" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<circle cx="38" cy="342" r="15" fill="#16151a"/>
<text x="38" y="348" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="62" y="326" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">一般列車</text>
<text x="62" y="348" font-size="16" fill="#5f5b55" text-anchor="start">全駅に停車・交通カードでタッチ・乗り換</text>
<text x="62" y="370" font-size="16" fill="#5f5b55" text-anchor="start">え割引あり</text>
<rect x="16" y="394" width="368" height="87" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<circle cx="38" cy="438" r="15" fill="#b8392f"/>
<text x="38" y="444" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="62" y="421" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">直通列車</text>
<text x="62" y="443" font-size="16" fill="#5f5b55" text-anchor="start">ノンストップ・座席指定・乗車券を別に購</text>
<text x="62" y="465" font-size="16" fill="#5f5b55" text-anchor="start">入</text>
</svg>
