<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" role="img" aria-label="韓国コスメのラベルの読み方(例。実在ブランドではありません)" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>韓国コスメのラベルの読み方(例。実在ブランドではありません)</title>
<rect width="400" height="700" fill="#f4f0e6"/>
<text x="20" y="32" font-size="16" fill="#5f5b55" font-weight="bold" text-anchor="start">箱の裏面(例)</text>
<rect x="20" y="46" width="360" height="370" rx="10" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<text x="40" y="86" font-size="22" fill="#16151a" font-weight="bold" text-anchor="start">수분 선크림</text>
<text x="40" y="110" font-size="16" fill="#5f5b55" font-weight="normal" text-anchor="start">(예시 제품)</text>
<rect x="40" y="126" width="130" height="36" rx="4" fill="#ffffff" stroke="#b8392f" stroke-width="2"/><text x="105" y="150" font-size="17" fill="#b8392f" font-weight="bold" text-anchor="middle">기능성화장품</text>
<circle cx="350" cy="144" r="13" fill="#b8392f"/><text x="350" y="150" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="40" y="196" font-size="17" fill="#16151a" font-weight="normal" text-anchor="start">효능·효과: 자외선 차단</text>
<circle cx="350" cy="190" r="13" fill="#b8392f"/><text x="350" y="196" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<rect x="40" y="214" width="250" height="48" rx="6" fill="#e9e2d3"/><text x="165" y="246" font-size="22" fill="#16151a" font-weight="bold" text-anchor="middle">SPF50+  PA++++</text>
<circle cx="350" cy="238" r="13" fill="#b8392f"/><text x="350" y="244" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="40" y="292" font-size="16" fill="#16151a" font-weight="bold" text-anchor="start">전성분:</text>
<text x="40" y="316" font-size="16" fill="#5f5b55" font-weight="normal" text-anchor="start"><tspan x="40" dy="0">정제수, 글리세린, …,</tspan><tspan x="40" dy="22">향료, 시트로넬올, 리모넨</tspan></text>
<circle cx="350" cy="310" r="13" fill="#b8392f"/><text x="350" y="316" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<line x1="40" y1="356" x2="360" y2="356" stroke="#c9c1b2"/>
<text x="40" y="392" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">용량: 50mL</text>
<circle cx="350" cy="386" r="13" fill="#b8392f"/><text x="350" y="392" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text>
<circle cx="33" cy="442" r="13" fill="#b8392f"/><text x="33" y="448" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="56" y="448" font-size="16" fill="#16151a" font-weight="normal" text-anchor="start"><tspan x="56" dy="0">「기능성화장품」(機能性化粧品)の</tspan><tspan x="56" dy="22">文字か図案</tspan></text>
<circle cx="33" cy="502" r="13" fill="#b8392f"/><text x="33" y="508" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="56" y="508" font-size="16" fill="#16151a" font-weight="normal" text-anchor="start"><tspan x="56" dy="0">食薬処の審査・報告を経た機能</tspan><tspan x="56" dy="22">(ここでは紫外線カット)</tspan></text>
<circle cx="33" cy="562" r="13" fill="#b8392f"/><text x="33" y="568" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="56" y="568" font-size="16" fill="#16151a" font-weight="normal" text-anchor="start">SPF・PA:日焼け止めの項を参照</text>
<circle cx="33" cy="600" r="13" fill="#b8392f"/><text x="33" y="606" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<text x="56" y="606" font-size="16" fill="#16151a" font-weight="normal" text-anchor="start"><tspan x="56" dy="0">全成分。リストにある香料アレルゲン</tspan><tspan x="56" dy="22">は成分名で表示</tspan></text>
<circle cx="33" cy="660" r="13" fill="#b8392f"/><text x="33" y="666" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text>
<text x="56" y="666" font-size="16" fill="#16151a" font-weight="normal" text-anchor="start">100mL以下なら機内の液体用袋に</text>
</svg>
