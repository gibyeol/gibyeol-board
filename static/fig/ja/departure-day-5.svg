<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 464" role="img" aria-label="どのかばんに入れる?" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>どのかばんに入れる?</title>
<rect width="400" height="464" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">どのかばんに入れる?</text>
<rect x="20" y="60" width="360" height="158" rx="10" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<text x="36" y="88" font-size="18" font-weight="700" fill="#16151a" text-anchor="start">機内持ち込み</text>
<text x="36" y="112" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">モバイルバッテリー:2個まで、</text>
<text x="36" y="134" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">各160Wh以下</text>
<text x="36" y="156" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">液体:1容器100ml以下、</text>
<text x="36" y="178" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">1Lの透明な袋ひとつ</text>
<text x="36" y="200" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">免税の液体:封印袋のまま</text>
<rect x="20" y="230" width="360" height="114" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="36" y="258" font-size="18" font-weight="700" fill="#16151a" text-anchor="start">預ける荷物</text>
<text x="36" y="282" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">100mlを超える液体</text>
<text x="36" y="304" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">スプレー:不燃性、1本500ml、</text>
<text x="36" y="326" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">合計2Lまで</text>
<rect x="20" y="356" width="360" height="90" rx="10" fill="#b8392f" stroke="#b8392f" stroke-width="1"/>
<text x="36" y="386" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">モバイルバッテリーは預け入れ</text>
<text x="36" y="408" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">不可。機内での充電禁止、</text>
<text x="36" y="430" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">頭上の棚にも入れない。</text>
</svg>
