<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 446" role="img" aria-label="Climate Card(気候同行カード) 短期券" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>Climate Card(気候同行カード) 短期券</title>
<rect width="400" height="446" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">Climate Card(気候同行カード)</text>
<text x="20" y="60" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">短期券</text>
<rect x="16" y="80" width="368" height="94" rx="10" fill="#e9e2d3" stroke="none" stroke-width="0"/>
<text x="32" y="106" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">1日5,000 · 2日8,000ウォン</text>
<text x="32" y="128" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">3日10,000 · 5日15,000ウォン</text>
<text x="32" y="150" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">7日20,000 · カード代3,000ウォン</text>
<rect x="16" y="186" width="368" height="116" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<text x="32" y="214" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">使える</text>
<text x="32" y="240" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">✓ ソウルの地下鉄</text>
<text x="32" y="264" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">✓ ソウルの市内バス(深夜も)</text>
<text x="32" y="288" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">✓ 仁川空港駅での降車</text>
<rect x="16" y="312" width="368" height="116" rx="10" fill="#ffffff" stroke="#5f5b55" stroke-width="1.5"/>
<text x="32" y="340" font-size="17" font-weight="700" fill="#5f5b55" text-anchor="start">使えない</text>
<text x="32" y="366" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">× 新盆唐線、GTX</text>
<text x="32" y="390" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">× 広域バス・空港バス</text>
<text x="32" y="414" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">× ソウル市外の駅</text>
</svg>
