<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" role="img" aria-label="韓国ダイソーの6つの価格: 500〜5,000ウォン" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>韓国ダイソーの6つの価格: 500〜5,000ウォン</title>
<rect width="400" height="360" rx="16" fill="#f4f0e6"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16151a"/></marker></defs>
<text x="20" y="39" font-size="21" fill="#16151a" font-weight="bold" text-anchor="start">韓国ダイソーの6つの価格:</text>
<text x="20" y="68" font-size="21" fill="#16151a" font-weight="bold" text-anchor="start">500〜5,000ウォン</text>
<text x="20" y="94" font-size="16" fill="#5f5b55" text-anchor="start">最低価格と最高価格(単位:ウォン)</text>
<line x1="56" y1="144" x2="344" y2="144" stroke="#e9e2d3" stroke-width="16" stroke-linecap="round"/>
<line x1="56" y1="144" x2="344" y2="144" stroke="#c9c1b2" stroke-width="2" stroke-dasharray="2 8"/>
<circle cx="56" cy="144" r="11" fill="#16151a"/>
<circle cx="344" cy="144" r="11" fill="#b8392f"/>
<text x="56" y="190" font-size="24" fill="#16151a" font-weight="bold" text-anchor="middle">500</text>
<text x="56" y="216" font-size="17" fill="#5f5b55" text-anchor="middle">最低価格</text>
<text x="344" y="190" font-size="24" fill="#b8392f" font-weight="bold" text-anchor="middle">5,000</text>
<text x="344" y="216" font-size="17" fill="#b8392f" font-weight="bold" text-anchor="middle">最高価格</text>
<rect x="16" y="248" width="368" height="94" rx="12" fill="#e9e2d3"/>
<text x="28" y="278" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">価格は全部で6つ</text>
<text x="28" y="301" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">(アソン・ダイソー、2026年11月)。</text>
<text x="28" y="323" font-size="16" fill="#5f5b55" text-anchor="start">値札を確認。</text>
</svg>
