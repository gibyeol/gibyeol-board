<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" role="img" aria-label="ソウル地下鉄の支払い方法" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>ソウル地下鉄の支払い方法</title>
<rect width="400" height="540" rx="16" fill="#f4f0e6"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16151a"/></marker></defs>
<text x="20" y="39" font-size="21" fill="#16151a" font-weight="bold" text-anchor="start">ソウル地下鉄の支払い方法</text>
<rect x="16" y="61" width="368" height="72" rx="12" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="2"/>
<text x="200" y="91" font-size="17" fill="#16151a" font-weight="bold" text-anchor="middle">ソウル市内だけで1日3回以上、</text>
<text x="200" y="114" font-size="17" fill="#16151a" font-weight="bold" text-anchor="middle">3日以上乗る?</text>
<rect x="124" y="147" width="260" height="70" rx="12" fill="#ffffff" stroke="#b8392f" stroke-width="3"/>
<text x="254" y="176" font-size="17" fill="#16151a" font-weight="bold" text-anchor="middle">Climate Card</text>
<text x="254" y="199" font-size="17" fill="#16151a" font-weight="bold" text-anchor="middle">短期券</text>
<line x1="40" y1="133" x2="40" y2="182" stroke="#16151a" stroke-width="2.5"/>
<line x1="40" y1="182" x2="122" y2="182" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="86" y="173" font-size="16" fill="#b8392f" font-weight="bold" text-anchor="middle">はい</text>
<line x1="40" y1="182" x2="40" y2="267" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="52" y="249" font-size="16" fill="#5f5b55" font-weight="bold" text-anchor="start">いいえ</text>
<rect x="16" y="269" width="368" height="76" rx="12" fill="#ffffff" stroke="#b8392f" stroke-width="3"/>
<text x="200" y="300" font-size="18" fill="#16151a" font-weight="bold" text-anchor="middle">T-money、または</text>
<text x="200" y="325" font-size="18" fill="#16151a" font-weight="bold" text-anchor="middle">WOWPASS(T-money機能付き)</text>
<text x="200" y="369" font-size="16" fill="#5f5b55" text-anchor="middle">WOWPASSのT-money残高は別にチャージ</text>
<line x1="16" y1="393" x2="384" y2="393" stroke="#c9c1b2" stroke-width="2" stroke-dasharray="6 6"/>
<text x="20" y="422" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">カードも現金もまだない?</text>
<text x="20" y="446" font-size="16" fill="#5f5b55" text-anchor="start">新しい券売機(Visa・Mastercard)で1回用乗車券:</text>
<circle cx="26" cy="467" r="3.5" fill="#b8392f"/>
<text x="38" y="472" font-size="16" fill="#16151a" text-anchor="start">1回+100ウォン</text>
<circle cx="26" cy="489" r="3.5" fill="#b8392f"/>
<text x="38" y="494" font-size="16" fill="#16151a" text-anchor="start">保証金500ウォン</text>
<circle cx="26" cy="511" r="3.5" fill="#b8392f"/>
<text x="38" y="516" font-size="16" fill="#16151a" text-anchor="start">バス乗り換え不可</text>
</svg>
