<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 444" role="img" aria-label="同じ線路に2種類の列車" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>同じ線路に2種類の列車</title>
<rect width="400" height="444" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">同じ線路に2種類の列車</text>
<text x="28" y="58" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">直通</text>
<text x="372" y="58" font-size="17" font-weight="700" fill="#16151a" text-anchor="end">一般</text>
<line x1="46" y1="88" x2="46" y2="318" stroke="#b8392f" stroke-width="5"/>
<line x1="354" y1="88" x2="354" y2="318" stroke="#16151a" stroke-width="5"/>
<text x="200" y="94" font-size="16" font-weight="700" fill="#16151a" text-anchor="middle">仁川空港第2ターミナル</text>
<circle cx="354" cy="88" r="8" fill="#ffffff" stroke="#16151a" stroke-width="2.5"/>
<circle cx="46" cy="88" r="8" fill="#ffffff" stroke="#b8392f" stroke-width="2.5"/>
<text x="200" y="140" font-size="16" font-weight="700" fill="#16151a" text-anchor="middle">仁川空港第1ターミナル</text>
<circle cx="354" cy="134" r="8" fill="#ffffff" stroke="#16151a" stroke-width="2.5"/>
<circle cx="46" cy="134" r="8" fill="#ffffff" stroke="#b8392f" stroke-width="2.5"/>
<text x="200" y="186" font-size="18" font-weight="700" fill="#5f5b55" text-anchor="middle">…</text>
<circle cx="354" cy="168" r="3.5" fill="#ffffff" stroke="#16151a" stroke-width="1.5"/>
<circle cx="354" cy="180" r="3.5" fill="#ffffff" stroke="#16151a" stroke-width="1.5"/>
<circle cx="354" cy="192" r="3.5" fill="#ffffff" stroke="#16151a" stroke-width="1.5"/>
<text x="200" y="232" font-size="16" font-weight="400" fill="#16151a" text-anchor="middle">弘大入口</text>
<circle cx="354" cy="226" r="8" fill="#ffffff" stroke="#16151a" stroke-width="2.5"/>
<text x="200" y="278" font-size="16" font-weight="400" fill="#16151a" text-anchor="middle">孔徳</text>
<circle cx="354" cy="272" r="8" fill="#ffffff" stroke="#16151a" stroke-width="2.5"/>
<text x="200" y="324" font-size="16" font-weight="700" fill="#16151a" text-anchor="middle">ソウル駅</text>
<circle cx="354" cy="318" r="8" fill="#ffffff" stroke="#16151a" stroke-width="2.5"/>
<circle cx="46" cy="318" r="8" fill="#ffffff" stroke="#b8392f" stroke-width="2.5"/>
<text x="20" y="360" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">直通:13,000ウォン、第1ターミナル</text>
<text x="20" y="382" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">から43分、ノンストップ・全席指定</text>
<text x="20" y="404" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">一般(交通カード):弘大入口・孔徳</text>
<text x="20" y="426" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">4,650ウォン、ソウル駅4,750ウォン</text>
</svg>
