<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 428" role="img" aria-label="保存しておく3つの番号" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>保存しておく3つの番号</title>
<rect width="400" height="428" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">保存しておく3つの番号</text>
<rect x="16" y="58" width="368" height="94" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="70" width="46.4928" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="51.2464" y="94" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">119</text>
<text x="86.4928" y="92" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">救急・消防</text>
<text x="86.4928" y="114" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">24時間。激しい胸の痛み、息苦しさ、</text>
<text x="86.4928" y="136" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">意識がない、大量出血、大けが</text>
<rect x="16" y="162" width="368" height="94" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="174" width="55.99040000000001" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="55.995200000000004" y="198" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1339</text>
<text x="95.99040000000001" y="196" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">疾病管理庁コールセンター</text>
<text x="95.99040000000001" y="218" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">365日24時間。韓国の番号からは無</text>
<text x="95.99040000000001" y="240" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">料。海外から+82-2-2633-1339</text>
<rect x="16" y="266" width="368" height="94" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="278" width="55.99040000000001" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="55.995200000000004" y="302" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1330</text>
<text x="95.99040000000001" y="300" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">言葉が通じないときの三者通話</text>
<text x="95.99040000000001" y="322" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">日本語対応と受付時間:暮らしのルー</text>
<text x="95.99040000000001" y="344" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">ルのページ</text>
<rect x="16" y="372" width="368" height="38" rx="10" fill="#e9e2d3" stroke="#b8392f" stroke-width="2"/>
<text x="30" y="398" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">迷ったら1339へ</text>
</svg>
