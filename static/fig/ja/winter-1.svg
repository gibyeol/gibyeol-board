<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 426" role="img" aria-label="1月のソウル:平均最低−5.5°C" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>1月のソウル:平均最低−5.5°C</title>
<rect width="400" height="426" fill="#f4f0e6"/>
<text x="20" y="42" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">1月のソウル:平均最低−5.5°C</text>
<rect x="16" y="56" width="368" height="67" rx="10" fill="#e9e2d3"/>
<rect x="30" y="66" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="88" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="78" y="81" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">ロングダウンか厚手のコート</text>
<text x="78" y="103" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">お尻まで隠れる丈</text>
<rect x="16" y="133" width="368" height="67" rx="10" fill="#e9e2d3"/>
<rect x="30" y="143" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="165" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="78" y="158" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">インナー</text>
<text x="78" y="180" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">外は暖かく、室内は暑すぎず</text>
<rect x="16" y="210" width="368" height="67" rx="10" fill="#e9e2d3"/>
<rect x="30" y="220" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="242" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="78" y="235" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">帽子、手袋、マフラー</text>
<text x="78" y="257" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">地図アプリ用にスマホ対応の手袋</text>
<rect x="16" y="287" width="368" height="67" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<rect x="30" y="297" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="319" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">+</text>
<text x="78" y="312" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">現地で買う:カイロ(핫팩)</text>
<text x="78" y="334" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">CU、GS25、セブンイレブンで冬じゅう</text>
<text x="20" y="382" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">室内は暖房:ダウンの前を開けて、マフラー</text>
<text x="20" y="404" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">を外す。</text>
</svg>
