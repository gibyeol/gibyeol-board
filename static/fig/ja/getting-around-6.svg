<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 378" role="img" aria-label="一般タクシー 時間帯ごとの基本料金" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>一般タクシー 時間帯ごとの基本料金</title>
<rect width="400" height="378" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">一般タクシー</text>
<text x="20" y="60" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">時間帯ごとの基本料金</text>
<text x="20" y="98" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">朝4時〜夜10時</text>
<rect x="20" y="108" width="179.1044776119403" height="20" rx="4" fill="#e9e2d3" stroke="none" stroke-width="0"/>
<text x="209.1044776119403" y="124" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">4,800ウォン</text>
<text x="20" y="158" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">夜10〜11時</text>
<text x="380" y="158" font-size="16" font-weight="700" fill="#5f5b55" text-anchor="end">+20%</text>
<rect x="20" y="168" width="216.4179104477612" height="20" rx="4" fill="#e9e2d3" stroke="none" stroke-width="0"/>
<text x="246.4179104477612" y="184" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">5,800ウォン</text>
<text x="20" y="218" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">夜11時〜深夜2時</text>
<text x="380" y="218" font-size="16" font-weight="700" fill="#b8392f" text-anchor="end">+40%</text>
<rect x="20" y="228" width="250.0" height="20" rx="4" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="280.0" y="244" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">6,700ウォン</text>
<text x="20" y="278" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">深夜2〜4時</text>
<text x="380" y="278" font-size="16" font-weight="700" fill="#5f5b55" text-anchor="end">+20%</text>
<rect x="20" y="288" width="216.4179104477612" height="20" rx="4" fill="#e9e2d3" stroke="none" stroke-width="0"/>
<text x="246.4179104477612" y="304" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">5,800ウォン</text>
<text x="20" y="338" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">1.6kmまで、中型タクシー</text>
<text x="20" y="360" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">距離・時間料金も同じ割合で上がる</text>
</svg>
