<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 406" role="img" aria-label="仁川空港の引き渡し場(4階)" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>仁川空港の引き渡し場(4階)</title>
<rect width="400" height="406" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">仁川空港の引き渡し場(4階)</text>
<rect x="16" y="54" width="368" height="66" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="16" y="54" width="10" height="66" rx="3" fill="#16151a" stroke="none" stroke-width="0"/>
<text x="40" y="81" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">第1ターミナル東側</text>
<text x="40" y="105" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">10〜11番ゲート向かい</text>
<rect x="16" y="128" width="368" height="66" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="16" y="128" width="10" height="66" rx="3" fill="#16151a" stroke="none" stroke-width="0"/>
<text x="40" y="155" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">第1ターミナル西側</text>
<text x="40" y="179" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">43〜45番ゲート向かい</text>
<rect x="16" y="202" width="368" height="66" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="16" y="202" width="10" height="66" rx="3" fill="#16151a" stroke="none" stroke-width="0"/>
<text x="40" y="229" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">第1ターミナル搭乗棟</text>
<text x="40" y="253" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">119番ゲート付近、シャトル</text>
<rect x="16" y="276" width="368" height="66" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="16" y="276" width="10" height="66" rx="3" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="40" y="303" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">第2ターミナル</text>
<text x="40" y="327" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">252番ゲート横、ブリッジの先</text>
<text x="20" y="366" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">どこで受け取るかは引換券に。</text>
<text x="20" y="388" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">新羅:出発の1〜2時間前までに</text>
</svg>
