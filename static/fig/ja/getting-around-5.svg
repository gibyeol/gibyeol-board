<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 494" role="img" aria-label="夕食のあと、どう帰る?" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>夕食のあと、どう帰る?</title>
<rect width="400" height="494" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">夕食のあと、どう帰る?</text>
<rect x="16" y="54" width="368" height="68" rx="10" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="32" y="84" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">終電はまだある?</text>
