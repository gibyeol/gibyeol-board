<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 346" role="img" aria-label="バスは2回タッチ" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>バスは2回タッチ</title>
<rect width="400" height="346" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">バスは2回タッチ</text>
<rect x="16" y="54" width="368" height="62" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="65.0" width="46" height="34" rx="6" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<rect x="34" y="71.0" width="34" height="10" rx="2" fill="#e9e2d3" stroke="none" stroke-width="0"/>
<circle cx="39" cy="101.0" r="4" fill="#16151a"/><circle cx="63" cy="101.0" r="4" fill="#16151a"/>
<text x="92" y="82" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">1. 乗るときタッチ</text>
<text x="92" y="106" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">ドア横の読み取り機に</text>
<rect x="16" y="126" width="368" height="62" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="137.0" width="46" height="34" rx="6" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<rect x="34" y="143.0" width="34" height="10" rx="2" fill="#e9e2d3" stroke="none" stroke-width="0"/>
<circle cx="39" cy="173.0" r="4" fill="#16151a"/><circle cx="63" cy="173.0" r="4" fill="#16151a"/>
<text x="92" y="154" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">2. 降りるときもタッチ</text>
<text x="92" y="178" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">忘れると乗り換えが途切れる</text>
<rect x="16" y="198" width="368" height="84" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="1.5"/>
<rect x="28" y="220.0" width="46" height="34" rx="6" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<rect x="34" y="226.0" width="34" height="10" rx="2" fill="#e9e2d3" stroke="none" stroke-width="0"/>
<circle cx="39" cy="256.0" r="4" fill="#16151a"/><circle cx="63" cy="256.0" r="4" fill="#16151a"/>
<text x="92" y="226" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">3. 30分以内に次へ</text>
<text x="92" y="250" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">夜9時〜朝7時は60分</text>
<text x="92" y="272" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">基本運賃は二重にかからない</text>
<text x="20" y="306" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">乗り換えは4回まで · 同じ路線の</text>
<text x="20" y="328" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">再乗車は対象外</text>
</svg>
