<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 366" role="img" aria-label="旅行者がNAVERマップで 予約する流れ" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>旅行者がNAVERマップで 予約する流れ</title>
<rect width="400" height="366" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">旅行者がNAVERマップで</text>
<text x="20" y="60" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">予約する流れ</text>
<rect x="20" y="86" width="360" height="88" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<circle cx="42" cy="110" r="13" fill="#b8392f" stroke="#b8392f" stroke-width="1"/>
<text x="42" y="116" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="66" y="116" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">パスポート認証</text>
<text x="66" y="140" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">スマホで。韓国の番号も、</text>
<text x="66" y="162" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">サポートへの連絡も不要</text>
<rect x="20" y="184" width="360" height="66" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<circle cx="42" cy="208" r="13" fill="#b8392f" stroke="#b8392f" stroke-width="1"/>
<text x="42" y="214" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="66" y="214" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">予約・注文・支払い</text>
<text x="66" y="238" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">NAVERマップの中で</text>
<rect x="20" y="260" width="360" height="88" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<circle cx="42" cy="284" r="13" fill="#b8392f" stroke="#b8392f" stroke-width="1"/>
<text x="42" y="290" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="66" y="290" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">店を確認</text>
<text x="66" y="314" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">海外カードの予約を受けるかは</text>
<text x="66" y="336" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">店ごとに決めます</text>
</svg>
