<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 534" role="img" aria-label="看板を見つけ、開いている薬局へ" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>看板を見つけ、開いている薬局へ</title>
<rect width="400" height="534" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">看板を見つけ、開いている薬局へ</text>
<rect x="16" y="58" width="368" height="96" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="32" y="72" width="92" height="68" rx="6" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="78" y="120" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">약</text>
<text x="140" y="112" font-size="18" font-weight="700" fill="#16151a" text-anchor="start">= 薬(薬局)</text>
<rect x="16" y="164" width="368" height="72" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="176" width="40" height="36" rx="8" fill="#16151a" stroke="none" stroke-width="0"/>
<text x="48.0" y="200" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="80" y="198" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">E-Gen(e-gen.or.kr)</text>
<text x="80" y="220" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">地域 → 薬局 → 日付や連休</text>
<rect x="16" y="246" width="368" height="94" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="258" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="282" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="80" y="280" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">深夜薬局</text>
<text x="80" y="302" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">自治体の指定。たいてい夜10時から深</text>
<text x="80" y="324" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">夜0時か明け方まで</text>
<rect x="16" y="350" width="368" height="94" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="362" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="386" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="80" y="384" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">休日当番薬局</text>
<text x="80" y="406" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">週末・休日の営業時間は</text>
<text x="80" y="428" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">pharm114.or.kr</text>
<rect x="16" y="456" width="368" height="60" rx="10" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="30" y="482" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">韓国語のサイトがつらければ1339かホテル</text>
<text x="30" y="504" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">のフロントへ</text>
</svg>
