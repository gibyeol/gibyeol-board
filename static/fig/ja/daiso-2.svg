<text x="66" y="300" font-size="16" fill="#16151a" text-anchor="middle">6F</text>
<rect x="16" y="307" width="100" height="27" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="66" y="327" font-size="16" fill="#16151a" text-anchor="middle">5F</text>
<rect x="16" y="334" width="100" height="27" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="66" y="354" font-size="16" fill="#16151a" text-anchor="middle">4F</text>
