<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 479" role="img" aria-label="明洞駅店ダイソーを4ステップで" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>明洞駅店ダイソーを4ステップで</title>
<rect width="400" height="479" rx="16" fill="#f4f0e6"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16151a"/></marker></defs>
<text x="20" y="39" font-size="21" fill="#16151a" font-weight="bold" text-anchor="start">明洞駅店ダイソーを4ステップで</text>
<rect x="16" y="61" width="368" height="95" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<circle cx="42" cy="108" r="15" fill="#16151a"/>
<text x="42" y="114" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="72" y="92" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">フロアガイド</text>
<text x="72" y="115" font-size="16" fill="#5f5b55" text-anchor="start">英・日・中あり</text>
<text x="72" y="137" font-size="16" fill="#5f5b55" text-anchor="start">2〜3階に絞る</text>
<line x1="42" y1="157" x2="42" y2="173" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="16" y="176" width="368" height="73" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<circle cx="42" cy="212" r="15" fill="#16151a"/>
<text x="42" y="218" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="72" y="207" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">コスメは2階</text>
<text x="72" y="230" font-size="16" fill="#5f5b55" text-anchor="start">話題の商品は売り切れも</text>
<line x1="42" y1="250" x2="42" y2="266" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="18" y="285" font-size="16" fill="#b8392f" font-weight="bold" text-anchor="start">免税を受けるなら</text>
<rect x="16" y="295" width="368" height="73" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<circle cx="42" cy="332" r="15" fill="#16151a"/>
<text x="42" y="338" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="72" y="326" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">会計は1回に</text>
<text x="72" y="349" font-size="16" fill="#5f5b55" text-anchor="start">レシート1枚ごとに15,000ウォン以上</text>
<line x1="42" y1="369" x2="42" y2="385" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="16" y="388" width="368" height="73" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<circle cx="42" cy="424" r="15" fill="#b8392f"/>
<text x="42" y="430" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<text x="72" y="419" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">パスポート</text>
<text x="72" y="442" font-size="16" fill="#5f5b55" text-anchor="start">支払いのときに提示</text>
</svg>
