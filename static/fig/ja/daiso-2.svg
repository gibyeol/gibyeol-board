<text x="66" y="435" font-size="16" fill="#16151a" text-anchor="middle">1F</text>
<rect x="16" y="118" width="100" height="324" fill="none" stroke="#16151a" stroke-width="2.5"/>
<rect x="130" y="118" width="254" height="85" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<circle cx="150" cy="160.5" r="13" fill="#16151a"/>
<text x="150" y="166.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="170" y="144" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">フロアガイド</text>
<text x="170" y="166" font-size="16" fill="#5f5b55" text-anchor="start">英・日・中あり</text>
<text x="170" y="188" font-size="16" fill="#5f5b55" text-anchor="start">2〜3階に絞る</text>
<rect x="130" y="213" width="254" height="63" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2.5"/>
<circle cx="150" cy="244.5" r="13" fill="#b8392f"/>
<text x="150" y="250.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="170" y="239" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">コスメは2階</text>
<text x="170" y="261" font-size="16" fill="#5f5b55" text-anchor="start">話題の商品は売り切れも</text>
<text x="132" y="302" font-size="16" fill="#b8392f" font-weight="bold" text-anchor="start">免税を受けるなら</text>
<rect x="130" y="310" width="254" height="85" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<circle cx="150" cy="352.5" r="13" fill="#16151a"/>
<text x="150" y="358.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="170" y="336" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">会計は1回に</text>
<text x="170" y="358" font-size="16" fill="#5f5b55" text-anchor="start">レシート1枚ごとに15,000</text>
<text x="170" y="380" font-size="16" fill="#5f5b55" text-anchor="start">ウォン以上</text>
<rect x="130" y="405" width="254" height="63" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<circle cx="150" cy="436.5" r="13" fill="#b8392f"/>
<text x="150" y="442.5" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<text x="170" y="431" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">パスポート</text>
<text x="170" y="453" font-size="16" fill="#5f5b55" text-anchor="start">支払いのときに提示</text>
<text x="20" y="504" font-size="16" fill="#5f5b55" text-anchor="start">コスメは2階:2023年のフロア構成、2026年9月の</text>
<text x="20" y="526" font-size="16" fill="#5f5b55" text-anchor="start">報道でも2階</text>
<rect x="16" y="542" width="368" height="91" rx="12" fill="#e9e2d3"/>
<text x="30" y="571" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">セルフレジ</text>
<text x="30" y="593" font-size="16" fill="#16151a" text-anchor="start">バーコードではなく、商品のQRコードを読み</text>
<text x="30" y="615" font-size="16" fill="#16151a" text-anchor="start">取る。</text>
</svg>
