<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 396" role="img" aria-label="還付書類は空港で" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<rect width="400" height="396" fill="#f4f0e6"/>
<text x="16" y="40" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">還付書類は空港で</text>
<rect x="16" y="54" width="368" height="68" rx="8" fill="#ffffff" stroke="#c9c1b2" stroke-width="1"/>
<circle cx="44.0" cy="88.0" r="16.0" fill="#16151a"/>
<text x="44.0" y="94.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="72" y="88" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">商品は機内持ち込みに</text>
<text x="72" y="110" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">税関で提示を求められることも</text>
<rect x="16" y="130" width="368" height="68" rx="8" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<circle cx="44.0" cy="164.0" r="16.0" fill="#b8392f"/>
<text x="44.0" y="170.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="72" y="164" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">先に税関確認</text>
<text x="72" y="186" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">キオスクか税関窓口で</text>
<rect x="16" y="206" width="368" height="46" rx="8" fill="#ffffff" stroke="#c9c1b2" stroke-width="1"/>
<circle cx="44.0" cy="229.0" r="16.0" fill="#16151a"/>
<text x="44.0" y="235.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="72" y="236" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">それから荷物を預ける</text>
<rect x="16" y="260" width="368" height="68" rx="8" fill="#ffffff" stroke="#c9c1b2" stroke-width="1"/>
<circle cx="44.0" cy="294.0" r="16.0" fill="#16151a"/>
<text x="44.0" y="300.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="72" y="294" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">還付を受け取る</text>
<text x="72" y="316" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">カウンター・キオスク・カード</text>
<text x="16" y="358" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">市内で先に受け取ったら21日以内に確認。</text>
<text x="16" y="380" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">税関確認がなければ還付なし。</text>
</svg>
