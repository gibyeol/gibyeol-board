<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" role="img" aria-label="カードが通らない?" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<rect width="400" height="540" fill="#f4f0e6"/>
<text x="16" y="40" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">カードが通らない?</text>
<text x="16" y="62" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">場面から探す</text>
<rect x="16" y="76" width="368" height="68" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1"/>
<text x="30" y="110" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">タクシー</text>
<text x="30" y="134" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">k.ride アプリは海外カードOK</text>
<rect x="16" y="154" width="368" height="90" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1"/>
<text x="30" y="188" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">出前(配達の民族)</text>
<text x="30" y="212" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">海外カードで注文、韓国の</text>
<text x="30" y="234" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">電話番号は不要(2026年7月〜)</text>
<rect x="16" y="254" width="368" height="90" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1"/>
<text x="30" y="288" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">NAVERマップの予約・注文</text>
<text x="30" y="312" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">パスポート認証で利用</text>
<text x="30" y="334" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">(2026年6月〜)</text>
<rect x="16" y="354" width="368" height="90" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1"/>
<text x="30" y="388" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">地下鉄:気候同行カード</text>
<text x="30" y="412" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">1〜8号線273駅の新しい券売機</text>
<text x="30" y="434" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">(海外カード手数料3.7%)</text>
<rect x="16" y="454" width="368" height="68" rx="10" fill="#e9e2d3" stroke="#e9e2d3" stroke-width="1"/>
<text x="30" y="488" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">それ以外</text>
<text x="30" y="512" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">別ブランドのカード、次に現金</text>
</svg>
