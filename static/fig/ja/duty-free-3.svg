<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 504" role="img" aria-label="日本の免税範囲(1人)" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>日本の免税範囲(1人)</title>
<rect width="400" height="504" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">日本の免税範囲(1人)</text>
<rect x="16" y="54" width="368" height="96" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="32" y="90" font-size="24" font-weight="700" fill="#b8392f" text-anchor="start">20万円</text>
<text x="210" y="88" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">その他の品物</text>
<text x="32" y="128" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">海外市価の合計</text>
<rect x="16" y="158" width="368" height="96" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="32" y="194" font-size="24" font-weight="700" fill="#b8392f" text-anchor="start">3本</text>
<text x="210" y="192" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">お酒</text>
<text x="32" y="232" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">1本760ml程度</text>
<rect x="16" y="262" width="368" height="96" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="32" y="298" font-size="24" font-weight="700" fill="#b8392f" text-anchor="start">200本</text>
<text x="210" y="296" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">紙巻たばこ</text>
<text x="32" y="336" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">20歳以上</text>
<rect x="16" y="366" width="368" height="96" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="32" y="402" font-size="24" font-weight="700" fill="#b8392f" text-anchor="start">2オンス</text>
<text x="210" y="400" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">香水</text>
<text x="32" y="440" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">約56ml</text>
<text x="20" y="486" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">韓国の免税店で買った物も含まれます</text>
</svg>
