<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 415" role="img" aria-label="仁川から済州へ:2つの行き方" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>仁川から済州へ:2つの行き方</title>
<rect width="400" height="415" fill="#f4f0e6"/>
<text x="20" y="42" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">仁川から済州へ:2つの行き方</text>
<rect x="16" y="56" width="368" height="89" rx="10" fill="#e9e2d3"/>
<rect x="30" y="66" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="88" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
<text x="78" y="81" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">金浦経由なら毎日</text>
<text x="78" y="103" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">仁川からAREXで金浦へ、そこから</text>
<text x="78" y="125" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">国内線</text>
<rect x="16" y="155" width="368" height="89" rx="10" fill="#e9e2d3"/>
<rect x="30" y="165" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="187" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
<text x="78" y="180" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">直行は週3便</text>
<text x="78" y="202" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">チェジュ航空 仁川–済州:月・水・金、</text>
<text x="78" y="224" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">2027年3月27日まで</text>
<rect x="16" y="254" width="368" height="89" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<rect x="30" y="264" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="286" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
<text x="78" y="279" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">早めに予約</text>
<text x="78" y="301" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">金浦–済州は世界一の混雑路線。2026年</text>
<text x="78" y="323" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">は座席が減っています</text>
<text x="20" y="371" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">国内線もパスポートを。大韓航空のチェックイン</text>
<text x="20" y="393" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">は出発30分前まで。</text>
</svg>
