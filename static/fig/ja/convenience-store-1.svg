<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 474" role="img" aria-label="レジでT-moneyをチャージ" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>レジでT-moneyをチャージ</title>
<rect width="400" height="474" fill="#f4f0e6"/>
<text x="20" y="42" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">レジでT-moneyをチャージ</text>
<rect x="16" y="56" width="368" height="45" rx="10" fill="#e9e2d3"/>
<circle cx="48" cy="82" r="17" fill="#b8392f"/>
<text x="48" y="88" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="78" y="81" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">カードとウォン現金を渡す</text>
<path d="M44 97 V119" stroke="#5f5b55" stroke-width="2"/>
<path d="M38 113 L44 121 L50 113" fill="none" stroke="#5f5b55" stroke-width="2"/>
<rect x="16" y="125" width="368" height="89" rx="10" fill="#e9e2d3"/>
<circle cx="48" cy="151" r="17" fill="#b8392f"/>
<text x="48" y="157" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="78" y="150" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">金額を伝える</text>
<text x="78" y="172" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">「충전해 주세요(チャージしてくださ</text>
<text x="78" y="194" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">い)」</text>
<path d="M44 210 V232" stroke="#5f5b55" stroke-width="2"/>
<path d="M38 226 L44 234 L50 226" fill="none" stroke="#5f5b55" stroke-width="2"/>
<rect x="16" y="238" width="368" height="67" rx="10" fill="#e9e2d3"/>
<circle cx="48" cy="264" r="17" fill="#b8392f"/>
<text x="48" y="270" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="78" y="263" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">店員がチャージ</text>
<text x="78" y="285" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">改札で残高が表示されます</text>
<rect x="16" y="315" width="368" height="133" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<circle cx="48" cy="341" r="17" fill="#b8392f"/>
<text x="48" y="347" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
<text x="78" y="340" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">ウォン現金がない?</text>
<text x="78" y="362" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">iPhone:モバイルT-moneyに</text>
<text x="78" y="384" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">Mastercard・Amex・銀聯(Visa不可)。</text>
<text x="78" y="406" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">空港:空港鉄道のT-moneyカード1万5千</text>
<text x="78" y="428" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">ウォン、海外カード可</text>
</svg>
