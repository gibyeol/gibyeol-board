<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 584" role="img" aria-label="乗るときと降りるとき、2回タッチ" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>乗るときと降りるとき、2回タッチ</title>
<rect width="400" height="584" rx="16" fill="#f4f0e6"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16151a"/></marker></defs>
<text x="20" y="39" font-size="21" fill="#16151a" font-weight="bold" text-anchor="start">乗るときと降りるとき、2回タッチ</text>
<rect x="16" y="61" width="368" height="60" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<circle cx="42" cy="91" r="15" fill="#16151a"/>
<text x="42" y="97" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="72" y="96" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">乗車</text>
<line x1="42" y1="122" x2="42" y2="138" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="16" y="141" width="368" height="73" rx="12" fill="#ffffff" stroke="#b8392f" stroke-width="3"/>
<circle cx="42" cy="178" r="15" fill="#b8392f"/>
<text x="42" y="184" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="72" y="172" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">カードをタッチ</text>
<text x="72" y="195" font-size="16" fill="#5f5b55" text-anchor="start">読み取り機に</text>
<line x1="42" y1="215" x2="42" y2="231" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="16" y="234" width="368" height="73" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<circle cx="42" cy="270" r="15" fill="#16151a"/>
<text x="42" y="276" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="72" y="265" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">移動</text>
<text x="72" y="288" font-size="16" fill="#5f5b55" text-anchor="start">地図で確認</text>
<line x1="42" y1="308" x2="42" y2="324" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="16" y="327" width="368" height="73" rx="12" fill="#ffffff" stroke="#b8392f" stroke-width="3"/>
<circle cx="42" cy="364" r="15" fill="#b8392f"/>
<text x="42" y="370" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<text x="72" y="358" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">もう一度タッチ</text>
<text x="72" y="381" font-size="16" fill="#5f5b55" text-anchor="start">降りる前に</text>
<line x1="42" y1="401" x2="42" y2="417" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="16" y="420" width="368" height="60" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<circle cx="42" cy="450" r="15" fill="#16151a"/>
<text x="42" y="456" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text>
<text x="72" y="456" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">降車</text>
<rect x="16" y="496" width="368" height="70" rx="12" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<text x="200" y="525" font-size="17" fill="#b8392f" font-weight="bold" text-anchor="middle">降車タッチを忘れると</text>
<text x="200" y="548" font-size="17" fill="#b8392f" font-weight="bold" text-anchor="middle">乗り換え割引が消えます</text>
</svg>
