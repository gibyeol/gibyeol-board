<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 546" role="img" aria-label="第1ターミナルからソウルへ" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>第1ターミナルからソウルへ</title>
<rect width="400" height="546" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">第1ターミナルからソウルへ</text>
<rect x="16" y="54" width="368" height="92" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="32" y="82" font-size="18" font-weight="700" fill="#16151a" text-anchor="start">AREX直通列車</text>
<text x="32" y="108" font-size="18" font-weight="700" fill="#b8392f" text-anchor="start">13,000ウォン</text>
<text x="32" y="132" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">ソウル駅までノンストップ43分</text>
<rect x="16" y="156" width="368" height="114" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="32" y="184" font-size="18" font-weight="700" fill="#16151a" text-anchor="start">AREX一般列車</text>
<text x="32" y="210" font-size="18" font-weight="700" fill="#b8392f" text-anchor="start">交通カード4,750ウォン</text>
<text x="32" y="234" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">ソウル駅まで59分、</text>
<text x="32" y="256" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">弘大入口・孔徳に停車</text>
<rect x="16" y="280" width="368" height="92" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="32" y="308" font-size="18" font-weight="700" fill="#16151a" text-anchor="start">空港リムジンバス</text>
<text x="32" y="334" font-size="18" font-weight="700" fill="#b8392f" text-anchor="start">16,000〜18,000ウォン</text>
<text x="32" y="358" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">ホテルの多いエリアへ約60〜80分</text>
<rect x="16" y="382" width="368" height="114" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="32" y="410" font-size="18" font-weight="700" fill="#16151a" text-anchor="start">外国人観光タクシー</text>
<text x="32" y="436" font-size="18" font-weight="700" fill="#b8392f" text-anchor="start">70,000〜95,000ウォン</text>
<text x="32" y="460" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">ソウルの区域別定額、</text>
<text x="32" y="482" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">中型・高速料金込み</text>
<text x="20" y="528" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">大人運賃・2026年11月26日確認</text>
</svg>
