<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" role="img" aria-label="レジでの即時還付、 1レシートごと" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>レジでの即時還付、 1レシートごと</title>
<rect width="400" height="430" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">レジでの即時還付、</text>
<text x="20" y="60" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">1レシートごと</text>
<rect x="16" y="80" width="368" height="66" rx="10" fill="#ffffff" stroke="#5f5b55" stroke-width="1.5"/>
<rect x="16" y="80" width="10" height="66" rx="3" fill="#5f5b55" stroke="none" stroke-width="0"/>
<text x="40" y="108" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">15,000ウォン未満</text>
<text x="40" y="132" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">還付なし</text>
<rect x="16" y="156" width="368" height="88" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2.5"/>
<rect x="16" y="156" width="10" height="88" rx="3" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="40" y="184" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">15,000〜1,000,000ウォン</text>
<text x="40" y="208" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">レジで税金分が引かれる</text>
<text x="40" y="230" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">パスポートの実物を見せる</text>
<rect x="16" y="254" width="368" height="88" rx="10" fill="#ffffff" stroke="#16151a" stroke-width="1.5"/>
<rect x="16" y="254" width="10" height="88" rx="3" fill="#16151a" stroke="none" stroke-width="0"/>
<text x="40" y="282" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">1,000,000ウォン超</text>
<text x="40" y="306" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">全額を払い、キオスクか</text>
<text x="40" y="328" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">空港で還付</text>
<text x="20" y="368" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">レシートは1枚ずつ数えます。</text>
<text x="20" y="390" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">別のお店のレシートは</text>
<text x="20" y="412" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">合算できません。</text>
</svg>
