<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-label="韓国の日焼け止めのSPF・PAの読み方" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>韓国の日焼け止めのSPF・PAの読み方</title>
<rect width="720" height="460" fill="#f4f0e6"/>
<rect x="30" y="24" width="320" height="230" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/><text x="54" y="64" font-size="20" fill="#16151a" font-weight="bold" text-anchor="start">SPF = 紫外線B波</text>
<rect x="54" y="84" width="200" height="56" rx="6" fill="#e9e2d3"/><text x="154" y="122" font-size="28" fill="#16151a" font-weight="bold" text-anchor="middle">SPF50+</text>
<text x="54" y="174" font-size="15" fill="#16151a" font-weight="normal" text-anchor="start"><tspan x="54" dy="0">50までは数字で表示。</tspan><tspan x="54" dy="20">50超は「50+」。</tspan></text>
<rect x="370" y="24" width="320" height="230" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/><text x="394" y="64" font-size="20" fill="#16151a" font-weight="bold" text-anchor="start">PA = 紫外線A波</text>
<text x="394" y="102" font-size="15" fill="#16151a" font-weight="bold" text-anchor="start">PA+</text>
<rect x="480" y="88" width="40" height="18" rx="3" fill="#5f5b55"/><text x="394" y="136" font-size="15" fill="#16151a" font-weight="bold" text-anchor="start">PA++</text>
<rect x="480" y="122" width="85" height="18" rx="3" fill="#5f5b55"/><text x="394" y="170" font-size="15" fill="#16151a" font-weight="bold" text-anchor="start">PA+++</text>
<rect x="480" y="156" width="130" height="18" rx="3" fill="#5f5b55"/><text x="394" y="204" font-size="15" fill="#16151a" font-weight="bold" text-anchor="start">PA++++</text>
<rect x="480" y="190" width="175" height="18" rx="3" fill="#b8392f"/><text x="394" y="236" font-size="15" fill="#5f5b55" font-weight="normal" text-anchor="start">+が多いほどA波の防止等級が高い</text>
<text x="30" y="296" font-size="16" fill="#16151a" font-weight="bold" text-anchor="start">食薬処の案内:その日の過ごし方で選ぶ</text>
<rect x="30" y="312" width="660" height="42" rx="6" fill="#e9e2d3" stroke="#c9c1b2"/><text x="46" y="339" font-size="15" fill="#16151a" font-weight="normal" text-anchor="start">室内・短い散歩</text>
<text x="674" y="339" font-size="15" fill="#16151a" font-weight="bold" text-anchor="end">SPF15 / PA+ 以上</text>
<rect x="30" y="362" width="660" height="42" rx="6" fill="#ffffff" stroke="#c9c1b2"/><text x="46" y="389" font-size="15" fill="#16151a" font-weight="normal" text-anchor="start">登山・海水浴・長時間</text>
<text x="674" y="389" font-size="15" fill="#16151a" font-weight="bold" text-anchor="end">SPF50+ / PA+++ か PA++++</text>
<text x="30" y="440" font-size="15" fill="#b8392f" font-weight="bold" text-anchor="start">箱の「기능성화장품」表示もあわせて確認。</text>
</svg>
