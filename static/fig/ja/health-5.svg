<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" role="img" aria-label="日本から持っていく薬、入れられる?" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>日本から持っていく薬、入れられる?</title>
<rect width="400" height="380" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">日本から持っていく薬、入れられる?</text>
<rect x="16" y="58" width="368" height="94" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="70" width="40" height="36" rx="8" fill="#16151a" stroke="none" stroke-width="0"/>
<text x="48.0" y="94" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">?</text>
<text x="80" y="92" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">麻薬・向精神薬の成分を含む?</text>
<text x="80" y="114" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">商品名ではなく成分で確認(例:デキスト</text>
<text x="80" y="136" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">ロメトルファン)</text>
<line x1="110" y1="152" x2="110" y2="182" stroke="#16151a" stroke-width="2.5"/>
<line x1="290" y1="152" x2="290" y2="182" stroke="#16151a" stroke-width="2.5"/>
<rect x="80" y="160" width="60" height="28" rx="14" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="110" y="180" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">はい</text>
<rect x="260" y="160" width="60" height="28" rx="14" fill="#16151a" stroke="none" stroke-width="0"/>
<text x="290" y="180" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">いいえ</text>
<rect x="16" y="196" width="180" height="116" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<text x="28" y="230" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">入国前にMFDSの</text>
<text x="28" y="252" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">承認</text>
<text x="28" y="274" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">医薬品安全ナラで申</text>
<text x="28" y="296" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">請。最大10営業日</text>
<rect x="204" y="196" width="180" height="116" rx="10" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<text x="216" y="230" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">6本(瓶)まで</text>
<text x="216" y="252" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">超える場合は用法に</text>
<text x="216" y="274" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">沿って3か月分以内</text>
<text x="20" y="340" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">6本(瓶)の基準は2026年11月12日から。正規に処</text>
<text x="20" y="362" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">方・購入した薬が条件です。</text>
</svg>
