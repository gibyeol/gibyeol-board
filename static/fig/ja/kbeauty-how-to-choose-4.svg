<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 504" role="img" aria-label="コスメの荷造り" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>コスメの荷造り</title>
<rect width="400" height="504" rx="16" fill="#f4f0e6"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16151a"/></marker></defs>
<text x="20" y="39" font-size="21" fill="#16151a" font-weight="bold" text-anchor="start">コスメの荷造り</text>
<rect x="16" y="61" width="368" height="115" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<rect x="32" y="94" width="52" height="50" rx="5" fill="#ffffff" stroke="#16151a" stroke-width="2.5"/><line x1="32" y1="103" x2="84" y2="103" stroke="#b8392f" stroke-width="3"/><rect x="40" y="116" width="10" height="24" rx="3" fill="#e9e2d3" stroke="#16151a" stroke-width="1.5"/><rect x="53" y="110" width="10" height="30" rx="3" fill="#e9e2d3" stroke="#16151a" stroke-width="1.5"/><rect x="66" y="120" width="10" height="20" rx="3" fill="#e9e2d3" stroke="#16151a" stroke-width="1.5"/>
<text x="100" y="91" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">機内持ち込み</text>
<text x="100" y="114" font-size="16" fill="#5f5b55" text-anchor="start">液体・ジェル・スプレー:1容器100mL</text>
<text x="100" y="136" font-size="16" fill="#5f5b55" text-anchor="start">以下</text>
<text x="100" y="158" font-size="16" fill="#5f5b55" text-anchor="start">1人1枚の1L透明ジッパー袋に</text>
<rect x="16" y="188" width="368" height="115" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<rect x="32" y="228" width="52" height="42" rx="7" fill="#e9e2d3" stroke="#16151a" stroke-width="2.5"/><path d="M48,228 v-9 h20 v9" fill="none" stroke="#16151a" stroke-width="2.5"/><line x1="46" y1="228" x2="46" y2="270" stroke="#16151a" stroke-width="2"/><line x1="70" y1="228" x2="70" y2="270" stroke="#16151a" stroke-width="2"/>
<text x="100" y="218" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">預け入れ荷物</text>
<text x="100" y="241" font-size="16" fill="#5f5b55" text-anchor="start">大きいボトル</text>
<text x="100" y="263" font-size="16" fill="#5f5b55" text-anchor="start">ヘアスプレーなど身だしなみ用スプ</text>
<text x="100" y="285" font-size="16" fill="#5f5b55" text-anchor="start">レー:1容器500mL・合計2Lまで</text>
<rect x="16" y="315" width="368" height="93" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<rect x="36" y="338" width="44" height="50" rx="5" fill="#ffffff" stroke="#16151a" stroke-width="2.5"/><rect x="36" y="338" width="44" height="10" fill="#b8392f"/><rect x="49" y="362" width="18" height="20" rx="3" fill="#e9e2d3" stroke="#16151a" stroke-width="1.5"/>
<text x="100" y="345" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">免税店の液体物</text>
<text x="100" y="368" font-size="16" fill="#5f5b55" text-anchor="start">最終目的地行きの便に乗るまで、密封</text>
<text x="100" y="390" font-size="16" fill="#5f5b55" text-anchor="start">袋を開けない</text>
<rect x="16" y="420" width="368" height="66" rx="12" fill="#e9e2d3"/>
<text x="30" y="447" font-size="16" fill="#16151a" text-anchor="start">仁川空港の国際線の基準。航空会社の基準も確</text>
<text x="30" y="469" font-size="16" fill="#16151a" text-anchor="start">認を。</text>
</svg>
