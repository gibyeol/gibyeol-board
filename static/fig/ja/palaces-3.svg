<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 482" role="img" aria-label="冬の入場締切 (11〜1月)" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>冬の入場締切 (11〜1月)</title>
