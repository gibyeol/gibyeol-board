<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 589" role="img" aria-label="ダイソーで買われているもの、誰のために" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>ダイソーで買われているもの、誰のために</title>
<rect width="400" height="589" rx="16" fill="#f4f0e6"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16151a"/></marker></defs>
<text x="20" y="39" font-size="21" fill="#16151a" font-weight="bold" text-anchor="start">ダイソーで買われているもの、誰の</text>
<text x="20" y="68" font-size="21" fill="#16151a" font-weight="bold" text-anchor="start">ために</text>
<rect x="16" y="90" width="368" height="119" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<rect x="44" y="128" width="28" height="40" rx="6" fill="#ffffff" stroke="#16151a" stroke-width="2.5"/><rect x="50" y="118" width="16" height="11" rx="2" fill="#b8392f"/><line x1="51" y1="146" x2="65" y2="146" stroke="#c9c1b2" stroke-width="3"/>
<text x="100" y="120" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">プチプラコスメ</text>
<text x="100" y="143" font-size="16" fill="#5f5b55" text-anchor="start">コスメブランド約170(2026年)</text>
<text x="100" y="165" font-size="16" fill="#5f5b55" text-anchor="start">小容量やダイソー専用ラインが多い</text>
<text x="100" y="191" font-size="16" fill="#b8392f" font-weight="bold" text-anchor="start">誰に:自分</text>
<rect x="16" y="221" width="368" height="141" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<path d="M38,268 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5 v46 h-40 z" fill="#e9e2d3" stroke="#16151a" stroke-width="2.5" stroke-linejoin="round"/><circle cx="58" cy="294" r="9" fill="#b8392f"/>
<text x="100" y="251" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">お菓子と小さなお土産</text>
<text x="100" y="274" font-size="16" fill="#5f5b55" text-anchor="start">お菓子はだいたい1,000〜2,000ウォ</text>
<text x="100" y="296" font-size="16" fill="#5f5b55" text-anchor="start">ン</text>
<text x="100" y="318" font-size="16" fill="#5f5b55" text-anchor="start">キャラクター商品、トレカ用品</text>
<text x="100" y="344" font-size="16" fill="#b8392f" font-weight="bold" text-anchor="start">誰に:配る用、K-POPファン</text>
<rect x="16" y="374" width="368" height="119" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<rect x="40" y="420" width="36" height="30" rx="6" fill="#ffffff" stroke="#16151a" stroke-width="2.5"/><line x1="51" y1="420" x2="51" y2="408" stroke="#16151a" stroke-width="4"/><line x1="65" y1="420" x2="65" y2="408" stroke="#16151a" stroke-width="4"/><path d="M58,450 q0,12 12,14" fill="none" stroke="#b8392f" stroke-width="3"/>
<text x="100" y="404" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">旅行中に必要な物</text>
<text x="100" y="427" font-size="16" fill="#5f5b55" text-anchor="start">マルチ変換プラグ、荷物はかり、スマ</text>
<text x="100" y="449" font-size="16" fill="#5f5b55" text-anchor="start">ホの充電器</text>
<text x="100" y="475" font-size="16" fill="#b8392f" font-weight="bold" text-anchor="start">誰に:旅行中の自分</text>
<rect x="16" y="505" width="368" height="66" rx="12" fill="#e9e2d3"/>
<text x="30" y="532" font-size="16" fill="#16151a" text-anchor="start">誰に向くかは私たちの判断。価格は値札で確</text>
<text x="30" y="554" font-size="16" fill="#16151a" text-anchor="start">認。</text>
</svg>
