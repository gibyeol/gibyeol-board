<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 428" role="img" aria-label="終演後:帰り道を先に決めておく" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>終演後:帰り道を先に決めておく</title>
<rect width="400" height="428" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">終演後:帰り道を先に決めておく</text>
<rect x="16" y="58" width="368" height="94" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="70" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="94" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="80" y="92" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">開演前に</text>
<text x="80" y="114" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">NAVERマップで終電を確認、代わりの</text>
<text x="80" y="136" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">手段も</text>
<rect x="16" y="162" width="368" height="94" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="174" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="198" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="80" y="196" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">KSPO DOME:混雑を避ける</text>
<text x="80" y="218" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">漢城百済駅(9号線、徒歩約20分)か夢村</text>
<text x="80" y="240" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">土城駅(8号線、約23分)へ</text>
<rect x="16" y="266" width="368" height="72" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="278" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="302" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="80" y="300" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">終電を逃したら</text>
<text x="80" y="322" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">深夜バス(N番)かタクシーアプリ</text>
<rect x="16" y="350" width="368" height="60" rx="10" fill="#e9e2d3" stroke="#b8392f" stroke-width="2"/>
<text x="30" y="376" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">タクシーは夜11時〜深夜2時がいちばん高い(</text>
<text x="30" y="398" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">割増は最大40%)</text>
</svg>
