<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 444" role="img" aria-label="日本語で相談できる窓口" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>日本語で相談できる窓口</title>
<rect width="400" height="444" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">日本語で相談できる窓口</text>
<rect x="16" y="58" width="368" height="138" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="70" width="103.47840000000002" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="79.73920000000001" y="94" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1577-7129</text>
<text x="30" y="136" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">メディカルコリア情報センター</text>
<text x="30" y="158" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">24時間。日本語あり(韓・英・中・露・アラビ</text>
<text x="30" y="180" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">ア語も)。苦情・紛争の受付</text>
<rect x="16" y="206" width="368" height="94" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="218" width="59.0432" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="57.5216" y="242" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">HiKR</text>
<text x="99.0432" y="240" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">医療観光ビジネスセンター</text>
<text x="99.0432" y="262" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">ソウル・清渓川路40。英・中・日・</text>
<text x="99.0432" y="284" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">露語。平日9:00〜18:00</text>
<rect x="16" y="310" width="368" height="116" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="322" width="103.47840000000002" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="79.73920000000001" y="346" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1670-2545</text>
<text x="30" y="388" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">韓国医療紛争調停仲裁院</text>
<text x="30" y="410" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">無料相談。平日9:00〜12:00、13:00〜18:00</text>
</svg>
