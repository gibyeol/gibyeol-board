<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="どのターミナル?" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>どのターミナル?</title>
<rect width="400" height="470" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">どのターミナル?</text>
<text x="20" y="74" font-size="16" font-weight="700" fill="#5f5b55" text-anchor="start">ソウル駅からAREX</text>
<line x1="36" y1="84" x2="36" y2="280" stroke="#b8392f" stroke-width="5"/>
<circle cx="36" cy="112" r="10" fill="#ffffff" stroke="#b8392f" stroke-width="3"/>
<rect x="60" y="90" width="320" height="160" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="76" y="118" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">第1ターミナル:先に停車</text>
<text x="76" y="142" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">チェジュ航空、トリニティ航空、</text>
<text x="76" y="164" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">イースター航空、エアプレミア、</text>
<text x="76" y="186" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">パラタ航空、ピーチ、ZIPAIR、</text>
<text x="76" y="208" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">エアージャパン、エバー航空など</text>
<text x="76" y="230" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">多くの外国航空会社</text>
<circle cx="36" cy="286" r="10" fill="#b8392f" stroke="#b8392f" stroke-width="3"/>
<rect x="60" y="264" width="320" height="138" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="76" y="292" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">第2ターミナル:終点</text>
<text x="76" y="316" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">大韓航空、アシアナ、ジンエアー、</text>
<text x="76" y="338" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">エアプサン、エアソウル、デルタ、</text>
<text x="76" y="360" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">エールフランス、KLM、</text>
<text x="76" y="382" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">チャイナエアライン</text>
<text x="20" y="430" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">共同運航便はeチケットか</text>
<text x="20" y="452" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">airport.krで便名を検索</text>
</svg>
