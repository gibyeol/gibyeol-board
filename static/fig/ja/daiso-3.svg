<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-label="ダイソーで免税できる?" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>ダイソーで免税できる?</title>
<rect width="720" height="500" fill="#f4f0e6"/>
<text x="32" y="48" font-size="24" fill="#16151a" font-weight="bold" text-anchor="start">ダイソーで免税できる?</text>
<rect x="32" y="76" width="420" height="56" rx="10" fill="#ffffff" stroke="#16151a" stroke-width="1.5"/>
<text x="242" y="110" font-size="17" fill="#16151a" font-weight="bold" text-anchor="middle">この店に「Tax Free」表示がある?</text>
<line x1="452" y1="104" x2="500" y2="104" stroke="#5f5b55" stroke-width="2"/>
<text x="476" y="96" font-size="15" fill="#5f5b55" font-weight="normal" text-anchor="middle">いいえ</text>
<rect x="500" y="76" width="188" height="56" rx="10" fill="#e9e2d3"/>
<text x="594" y="110" font-size="16" fill="#16151a" font-weight="normal" text-anchor="middle">通常どおり支払い</text>
<line x1="242" y1="132" x2="242" y2="176" stroke="#5f5b55" stroke-width="2"/>
<text x="254" y="160" font-size="15" fill="#b8392f" font-weight="bold" text-anchor="start">はい</text>
<rect x="32" y="176" width="420" height="56" rx="10" fill="#ffffff" stroke="#16151a" stroke-width="1.5"/>
<text x="242" y="210" font-size="17" fill="#16151a" font-weight="bold" text-anchor="middle">レシート1枚で15,000ウォン以上?</text>
<text x="242" y="256" font-size="15" fill="#5f5b55" font-weight="normal" text-anchor="middle">5,000ウォン × 3 = 15,000ウォン</text>
<line x1="452" y1="204" x2="500" y2="204" stroke="#5f5b55" stroke-width="2"/>
<text x="476" y="196" font-size="15" fill="#5f5b55" font-weight="normal" text-anchor="middle">いいえ</text>
<rect x="500" y="176" width="188" height="84" rx="10" fill="#e9e2d3"/>
<text x="594" y="208" font-size="16" fill="#16151a" font-weight="normal" text-anchor="middle">買い足すか</text>
<text x="594" y="234" font-size="16" fill="#16151a" font-weight="normal" text-anchor="middle">通常どおり支払い</text>
<text x="594" y="286" font-size="15" fill="#b8392f" font-weight="normal" text-anchor="middle">レシートは1枚ずつ判定</text>
<line x1="242" y1="266" x2="242" y2="316" stroke="#5f5b55" stroke-width="2"/>
<text x="254" y="298" font-size="15" fill="#b8392f" font-weight="bold" text-anchor="start">はい</text>
<rect x="32" y="316" width="420" height="84" rx="10" fill="#b8392f"/>
<text x="242" y="350" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">支払いのときに</text>
<text x="242" y="378" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">パスポート原本を提示</text>
<rect x="32" y="430" width="656" height="44" rx="6" fill="#e9e2d3"/>
<text x="360" y="458" font-size="16" fill="#16151a" font-weight="normal" text-anchor="middle">ルール・上限:免税のページ</text>
</svg>
