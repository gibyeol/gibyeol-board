<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 645" role="img" aria-label="ダイソーで免税できる?" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>ダイソーで免税できる?</title>
<rect width="400" height="645" rx="16" fill="#f4f0e6"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16151a"/></marker></defs>
<text x="20" y="39" font-size="21" fill="#16151a" font-weight="bold" text-anchor="start">ダイソーで免税できる?</text>
<rect x="16" y="61" width="368" height="72" rx="12" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="2"/>
<text x="200" y="91" font-size="17" fill="#16151a" font-weight="bold" text-anchor="middle">この店に「Tax Free」か</text>
<text x="200" y="114" font-size="17" fill="#16151a" font-weight="bold" text-anchor="middle">「Tax Refund」の表示がある?</text>
<rect x="124" y="147" width="260" height="47" rx="12" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="2"/>
<text x="254" y="176" font-size="17" fill="#16151a" text-anchor="middle">通常どおり支払い</text>
<line x1="40" y1="133" x2="40" y2="170.5" stroke="#16151a" stroke-width="2.5"/>
<line x1="40" y1="170.5" x2="122" y2="170.5" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="86" y="161.5" font-size="16" fill="#5f5b55" font-weight="bold" text-anchor="middle">いいえ</text>
<line x1="40" y1="170.5" x2="40" y2="244" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="52" y="226" font-size="16" fill="#b8392f" font-weight="bold" text-anchor="start">はい</text>
<rect x="16" y="246" width="368" height="49" rx="12" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="2"/>
<text x="200" y="276" font-size="17" fill="#16151a" font-weight="bold" text-anchor="middle">レシート1枚で15,000ウォン以上?</text>
<text x="56" y="319" font-size="16" fill="#5f5b55" text-anchor="start">5,000ウォン × 3 = 15,000ウォン</text>
<rect x="124" y="339" width="260" height="70" rx="12" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="2"/>
<text x="254" y="368" font-size="17" fill="#16151a" text-anchor="middle">買い足すか</text>
<text x="254" y="391" font-size="17" fill="#16151a" text-anchor="middle">通常どおり支払い</text>
<line x1="40" y1="295" x2="40" y2="374" stroke="#16151a" stroke-width="2.5"/>
<line x1="40" y1="374" x2="122" y2="374" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="86" y="365" font-size="16" fill="#5f5b55" font-weight="bold" text-anchor="middle">いいえ</text>
<text x="254" y="431" font-size="16" fill="#b8392f" text-anchor="middle">レシートは1枚ずつ判定</text>
<line x1="40" y1="374" x2="40" y2="487" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="52" y="469" font-size="16" fill="#b8392f" font-weight="bold" text-anchor="start">はい</text>
<rect x="16" y="489" width="368" height="76" rx="12" fill="#b8392f"/>
<text x="200" y="520" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">支払いのときに</text>
<text x="200" y="545" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">パスポート原本を提示</text>
<rect x="16" y="583" width="368" height="44" rx="12" fill="#e9e2d3"/>
<text x="200" y="610" font-size="16" fill="#16151a" text-anchor="middle">ルール・上限:免税のページ</text>
</svg>
