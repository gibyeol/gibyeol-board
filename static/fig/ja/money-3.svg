<text x="30" y="170" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">お店での支払い</text>
<text x="370" y="170" font-size="17" font-weight="700" fill="#b8392f" text-anchor="end">手数料なし</text>
<path d="M30 184 H370" stroke="#c9c1b2" stroke-width="1"/>
