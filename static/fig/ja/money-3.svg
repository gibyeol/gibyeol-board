<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 406" role="img" aria-label="WOWPASSの費用" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<rect width="400" height="406" fill="#f4f0e6"/>
<text x="16" y="40" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">WOWPASSの費用</text>
<rect x="16" y="54" width="368" height="304" rx="10" fill="#ffffff" stroke="#c9c1b2"/>
