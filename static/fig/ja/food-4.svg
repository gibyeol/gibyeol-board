<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" role="img" aria-label="ホテルから배민で注文する" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>ホテルから배민で注文する</title>
<rect width="400" height="460" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">ホテルから배민で注文する</text>
<rect x="20" y="60" width="360" height="88" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="36" y="90" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">言語</text>
<text x="36" y="114" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">日本語、英語、中国語:</text>
<text x="36" y="136" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">スマホの言語設定に合わせる</text>
<rect x="20" y="158" width="360" height="88" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="36" y="188" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">支払い</text>
<text x="36" y="212" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">海外カード、Apple Pay、</text>
<text x="36" y="234" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">WeChat Pay、Alipay+</text>
<rect x="20" y="256" width="360" height="88" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="36" y="286" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">認証</text>
<text x="36" y="310" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">日本の携帯番号に届くSMS、</text>
<text x="36" y="332" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">韓国の電話は不要</text>
<rect x="20" y="354" width="360" height="88" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="36" y="384" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">注文の前に</text>
<text x="36" y="408" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">ホテルの韓国語住所をコピー、</text>
<text x="36" y="430" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">受け取り場所をフロントで確認</text>
</svg>
