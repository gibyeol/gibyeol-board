<text x="78" y="372" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">対応する決済アプリで</text>
<rect x="16" y="402" width="368" height="89" rx="10" fill="#e9e2d3"/>
<rect x="30" y="412" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="434" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="78" y="427" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">QR:運賃を入力</text>
<text x="78" y="449" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">一般1,150ウォン、急行101番2,00</text>
<text x="78" y="471" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">0ウォン</text>
<rect x="16" y="501" width="368" height="67" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<rect x="30" y="511" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="533" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
<text x="78" y="526" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">現金は不可</text>
<text x="78" y="548" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">2024年10月1日から</text>
