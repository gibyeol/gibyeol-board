<text x="172" y="97" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">運転席横のポールにQ</text>
<text x="172" y="120" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">Rコード</text>
<text x="172" y="142" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">横に多言語の案内</text>
<rect x="16" y="248" width="368" height="67" rx="10" fill="#e9e2d3"/>
<rect x="30" y="258" width="36" height="32" rx="8" fill="#b8392f"/>
