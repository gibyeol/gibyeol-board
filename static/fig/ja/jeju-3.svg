<text x="78" y="273" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">カード</text>
<text x="78" y="295" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">チャージした韓国の交通カード</text>
<rect x="16" y="325" width="368" height="67" rx="10" fill="#e9e2d3"/>
<rect x="30" y="335" width="36" height="32" rx="8" fill="#b8392f"/>
