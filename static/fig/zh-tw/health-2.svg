<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 490" role="img" aria-label="24 小時便利商店的常備藥架" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>24 小時便利商店的常備藥架</title>
<rect width="400" height="490" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">24 小時便利商店的常備藥架</text>
<rect x="16" y="58" width="368" height="210" rx="8" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="72" width="166" height="84" rx="8" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="42" y="84" width="26" height="30" rx="4" fill="#b8392f" stroke="none" stroke-width="1"/>
<rect x="76" y="84" width="26" height="30" rx="4" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="1"/>
<rect x="110" y="84" width="26" height="30" rx="4" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="1"/>
<text x="42" y="140" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">退燒止痛</text>
<rect x="206" y="72" width="166" height="84" rx="8" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="220" y="84" width="26" height="30" rx="4" fill="#b8392f" stroke="none" stroke-width="1"/>
<rect x="254" y="84" width="26" height="30" rx="4" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="1"/>
<rect x="288" y="84" width="26" height="30" rx="4" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="1"/>
<text x="220" y="140" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">感冒藥</text>
<rect x="28" y="170" width="166" height="84" rx="8" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="42" y="182" width="26" height="30" rx="4" fill="#b8392f" stroke="none" stroke-width="1"/>
<rect x="76" y="182" width="26" height="30" rx="4" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="1"/>
<rect x="110" y="182" width="26" height="30" rx="4" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="1"/>
<text x="42" y="238" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">消化藥</text>
<rect x="206" y="170" width="166" height="84" rx="8" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="220" y="182" width="26" height="30" rx="4" fill="#b8392f" stroke="none" stroke-width="1"/>
<rect x="254" y="182" width="26" height="30" rx="4" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="1"/>
<rect x="288" y="182" width="26" height="30" rx="4" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="1"/>
<text x="220" y="238" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">貼布</text>
<text x="20" y="290" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">實際 11 項(指定 13 項,2 項已停產)</text>
<path d="M23,317 L28,322 L38,310" fill="none" stroke="#16151a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="52" y="326" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">只有登記、全年無休 24 小時的店</text>
<path d="M23,349 L28,354 L38,342" fill="none" stroke="#16151a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="52" y="358" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">同一種藥一次只能買 1 盒</text>
<path d="M24,374 L36,386 M36,374 L24,386" stroke="#b8392f" stroke-width="3" stroke-linecap="round"/>
<text x="52" y="390" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">沒有藥師</text>
<path d="M24,406 L36,418 M36,406 L24,418" stroke="#b8392f" stroke-width="3" stroke-linecap="round"/>
<text x="52" y="422" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">沒有止瀉藥、燙傷藥膏</text>
<rect x="16" y="434" width="368" height="38" rx="10" fill="#e9e2d3" stroke="#b8392f" stroke-width="2"/>
<text x="30" y="460" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">症狀持續就去診所</text>
</svg>
