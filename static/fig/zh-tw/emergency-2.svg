<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 349" role="img" aria-label="東西忘在計程車上?先看你怎麼付錢" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>東西忘在計程車上?先看你怎麼付錢</title>
<rect width="400" height="349" fill="#f4f0e6"/>
<text x="20" y="42" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">東西忘在計程車上?先看你怎麼付錢</text>
<rect x="16" y="56" width="368" height="67" rx="10" fill="#e9e2d3"/>
<rect x="30" y="66" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="88" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
<text x="78" y="81" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">用App叫車</text>
<text x="78" y="103" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">從行程紀錄打電話或傳訊息給司機</text>
<rect x="16" y="133" width="368" height="89" rx="10" fill="#e9e2d3"/>
<rect x="30" y="143" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="165" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
<text x="78" y="158" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">用交通卡付款</text>
<text x="78" y="180" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">T-money 1644-1188、Cashbee</text>
<text x="78" y="202" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">1644-1472。準備好卡號</text>
<rect x="16" y="232" width="368" height="67" rx="10" fill="#e9e2d3"/>
<rect x="30" y="242" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="264" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
<text x="78" y="257" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">付現金、沒用App</text>
<text x="78" y="279" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">記下車牌、地點、時間,請1330協助</text>
<text x="20" y="327" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">計程車公司約保管一週,之後交給警察。</text>
</svg>
