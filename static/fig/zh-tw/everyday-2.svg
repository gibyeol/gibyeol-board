<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 525" role="img" aria-label="插頭插得進去嗎?" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>插頭插得進去嗎?</title>
<rect width="400" height="525" fill="#f4f0e6"/>
<text x="20" y="42" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">插頭插得進去嗎?</text>
<circle cx="100" cy="122" r="52" fill="#ffffff" stroke="#16151a" stroke-width="2.5"/>
<circle cx="80" cy="122" r="9" fill="#16151a"/>
<circle cx="120" cy="122" r="9" fill="#16151a"/>
<rect x="276" y="78" width="9" height="30" rx="2" fill="#16151a"/>
<rect x="305" y="78" width="9" height="30" rx="2" fill="#16151a"/>
<rect x="256" y="106" width="78" height="66" rx="12" fill="#e9e2d3" stroke="#16151a" stroke-width="2"/>
<text x="200" y="132" font-size="22" font-weight="700" fill="#b8392f" text-anchor="middle">≠</text>
<text x="100" y="204" font-size="17" font-weight="700" fill="#16151a" text-anchor="middle">韓國</text>
<text x="100" y="226" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="middle">220V、60Hz</text>
<text x="100" y="248" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="middle">圓形雙腳</text>
<text x="295" y="204" font-size="17" font-weight="700" fill="#16151a" text-anchor="middle">台灣</text>
<text x="295" y="226" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="middle">110V</text>
<text x="295" y="248" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="middle">扁腳</text>
<text x="20" y="293" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">一定要帶轉接頭。再看標示:</text>
<rect x="16" y="309" width="368" height="67" rx="10" fill="#e9e2d3"/>
<rect x="30" y="319" width="119.76680000000002" height="32" rx="8" fill="#b8392f"/>
<text x="89.88340000000001" y="341" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">100–240V</text>
<text x="161.76680000000002" y="334" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">轉接頭就夠</text>
<text x="161.76680000000002" y="356" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">大部分手機、筆電充電器</text>
<rect x="16" y="386" width="368" height="67" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<rect x="30" y="396" width="128.62640000000002" height="32" rx="8" fill="#b8392f"/>
<text x="94.31320000000001" y="418" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">只支援110V</text>
<text x="170.62640000000002" y="411" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">需要變壓器</text>
<text x="170.62640000000002" y="433" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">吹風機、離子夾,建議別帶</text>
<text x="20" y="481" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">飯店櫃檯常可借轉接頭,仁川機場便利商店和免稅店</text>
<text x="20" y="503" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">也買得到。</text>
</svg>
