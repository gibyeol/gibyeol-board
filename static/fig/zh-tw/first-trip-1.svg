<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" role="img" aria-label="四天,一天一區" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>四天,一天一區</title>
<rect width="400" height="380" fill="#f4f0e6"/>
<text x="20" y="42" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">四天,一天一區</text>
<rect x="16" y="56" width="368" height="67" rx="10" fill="#e9e2d3"/>
<circle cx="48" cy="82" r="17" fill="#b8392f"/>
<text x="48" y="88" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="78" y="81" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">抵達</text>
<text x="78" y="103" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">回飯店、附近吃飯、睡覺</text>
<rect x="16" y="133" width="368" height="67" rx="10" fill="#e9e2d3"/>
<circle cx="48" cy="159" r="17" fill="#b8392f"/>
<text x="48" y="165" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="78" y="158" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">宮殿與北村</text>
<text x="78" y="180" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">上午一座宮殿,之後逛巷弄</text>
<rect x="16" y="210" width="368" height="67" rx="10" fill="#e9e2d3"/>
<circle cx="48" cy="236" r="17" fill="#b8392f"/>
<text x="48" y="242" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="78" y="235" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">一個街區</text>
<text x="78" y="257" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">明洞、弘大或聖水擇一</text>
<rect x="16" y="287" width="368" height="67" rx="10" fill="#e9e2d3"/>
<circle cx="48" cy="313" r="17" fill="#b8392f"/>
<text x="48" y="319" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="78" y="312" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">慢慢的早晨、去機場</text>
<text x="78" y="334" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">起飛前3小時到仁川機場</text>
</svg>
