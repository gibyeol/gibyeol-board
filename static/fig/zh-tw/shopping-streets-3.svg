<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 645" role="img" aria-label="2號線半日路線" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>2號線半日路線</title>
<rect width="400" height="645" rx="16" fill="#f4f0e6"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16151a"/></marker></defs>
<text x="20" y="39" font-size="21" fill="#16151a" font-weight="bold" text-anchor="start">2號線半日路線</text>
<rect x="16" y="61" width="368" height="117" rx="12" fill="#ffffff" stroke="#b8392f" stroke-width="2.5"/>
<circle cx="42" cy="120" r="15" fill="#b8392f"/>
<text x="42" y="126" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="72" y="92" font-size="19" fill="#16151a" font-weight="bold" text-anchor="start">聖水</text>
<text x="72" y="116" font-size="17" fill="#16151a" text-anchor="start">午後</text>
<text x="72" y="138" font-size="16" fill="#5f5b55" text-anchor="start">4號(或3號)出口</text>
<text x="72" y="160" font-size="16" fill="#5f5b55" text-anchor="start">走到演武場街</text>
<line x1="42" y1="179" x2="42" y2="195" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="16" y="198" width="368" height="95" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<circle cx="42" cy="246" r="15" fill="#16151a"/>
<text x="42" y="252" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="72" y="229" font-size="19" fill="#16151a" font-weight="bold" text-anchor="start">2號線</text>
<text x="72" y="253" font-size="17" fill="#16151a" text-anchor="start">搭乘</text>
<text x="72" y="275" font-size="16" fill="#5f5b55" text-anchor="start">到弘大入口站</text>
<line x1="42" y1="294" x2="42" y2="310" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="16" y="313" width="368" height="117" rx="12" fill="#ffffff" stroke="#b8392f" stroke-width="2.5"/>
<circle cx="42" cy="372" r="15" fill="#b8392f"/>
<text x="42" y="378" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="72" y="344" font-size="19" fill="#16151a" font-weight="bold" text-anchor="start">弘大</text>
<text x="72" y="368" font-size="17" fill="#16151a" text-anchor="start">傍晚到晚上</text>
<text x="72" y="390" font-size="16" fill="#5f5b55" text-anchor="start">9號出口 → R3,350公尺</text>
<text x="72" y="412" font-size="16" fill="#5f5b55" text-anchor="start">COVERNAT 到21:00</text>
<line x1="42" y1="431" x2="42" y2="447" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="16" y="450" width="368" height="95" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<circle cx="42" cy="498" r="15" fill="#16151a"/>
<text x="42" y="504" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<text x="72" y="481" font-size="19" fill="#16151a" font-weight="bold" text-anchor="start">收據</text>
<text x="72" y="505" font-size="17" fill="#16151a" text-anchor="start">和護照放一起</text>
<text x="72" y="527" font-size="16" fill="#5f5b55" text-anchor="start">單張超過100萬韓元 → 不能現場退稅</text>
<rect x="16" y="561" width="368" height="66" rx="12" fill="#e9e2d3"/>
<text x="30" y="588" font-size="16" fill="#16151a" text-anchor="start">美妝優先?把聖水換成明洞</text>
<text x="30" y="610" font-size="16" fill="#16151a" text-anchor="start">(乙支路入口站也在2號線)。</text>
</svg>
