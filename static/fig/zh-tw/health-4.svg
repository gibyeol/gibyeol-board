<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 426" role="img" aria-label="沒有韓國健保去診所" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>沒有韓國健保去診所</title>
<rect width="400" height="426" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">沒有韓國健保去診所</text>
<rect x="16" y="58" width="368" height="94" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="70" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="94" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="80" y="92" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">選巷口診所(의원)</text>
<text x="80" y="114" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">感冒、皮膚問題、拉肚子。檢查、住院、</text>
<text x="80" y="136" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">手術才去醫院</text>
<rect x="16" y="162" width="368" height="60" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="174" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="198" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="80" y="196" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">帶護照</text>
<rect x="16" y="232" width="368" height="94" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="244" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="268" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="80" y="266" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">全額自費</text>
<text x="80" y="288" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">診所看一次:沒保險約 30,000~60,000 韓</text>
<text x="80" y="310" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">元(內日新聞)</text>
<rect x="16" y="336" width="368" height="72" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="348" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="372" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="80" y="370" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">拿收據和費用明細</text>
<text x="80" y="392" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">回台灣申請保險理賠用</text>
</svg>
