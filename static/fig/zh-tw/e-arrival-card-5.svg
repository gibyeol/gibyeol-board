<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 336" role="img" aria-label="兩個不同的制度" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<rect width="400" height="336" fill="#f4f0e6"/>
<text x="16" y="40" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">兩個不同的制度</text>
<rect x="16" y="54" width="368" height="134" rx="10" fill="#e9e2d3" stroke="#e9e2d3" stroke-width="1"/>
<text x="30" y="88" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">K-ETA</text>
<text x="30" y="112" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">電子旅行許可</text>
<text x="30" y="134" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">1 萬韓元,出發前申請</text>
<text x="30" y="156" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">臺灣等 22 個國家和地區</text>
<text x="30" y="178" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">免申請到 2027 年 12 月 31 日</text>
<rect x="16" y="198" width="368" height="90" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<text x="30" y="232" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">電子入境卡</text>
<text x="30" y="256" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">取代紙本入境卡</text>
<text x="30" y="278" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">免費,抵達前 3 天內填</text>
<text x="16" y="320" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">持有效 K-ETA 就不用填入境卡。</text>
</svg>
