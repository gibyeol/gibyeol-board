<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 334" role="img" aria-label="回台灣入境免稅(每人)" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>回台灣入境免稅(每人)</title>
<rect width="400" height="334" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">回台灣入境免稅(每人)</text>
<rect x="16" y="54" width="368" height="74" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="32" y="100" font-size="24" font-weight="700" fill="#b8392f" text-anchor="start">NT$35,000</text>
<text x="200" y="85" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">其他自用物品</text>
<text x="200" y="109" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">完稅價格總值</text>
<rect x="16" y="136" width="368" height="74" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="32" y="182" font-size="24" font-weight="700" fill="#b8392f" text-anchor="start">1公升</text>
<text x="200" y="167" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">酒</text>
<text x="200" y="191" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">資料不一致,以較嚴計</text>
<rect x="16" y="218" width="368" height="74" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="32" y="264" font-size="24" font-weight="700" fill="#b8392f" text-anchor="start">200支</text>
<text x="200" y="249" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">捲菸</text>
<text x="200" y="273" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">年滿20歲</text>
<text x="20" y="316" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">在免稅店買的也算在額度內</text>
</svg>
