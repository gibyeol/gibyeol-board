<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="回台灣入境免稅(每人)" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>回台灣入境免稅(每人)</title>
<rect width="400" height="400" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">回台灣入境免稅(每人)</text>
<rect x="16" y="54" width="368" height="96" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="32" y="90" font-size="24" font-weight="700" fill="#b8392f" text-anchor="start">NT$35,000</text>
<text x="210" y="88" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">其他自用物品</text>
<text x="32" y="128" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">完稅價格總值</text>
<rect x="16" y="158" width="368" height="96" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="32" y="194" font-size="24" font-weight="700" fill="#b8392f" text-anchor="start">1公升</text>
<text x="210" y="192" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">酒</text>
<text x="32" y="232" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">資料不一致,以較嚴計</text>
<rect x="16" y="262" width="368" height="96" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="32" y="298" font-size="24" font-weight="700" fill="#b8392f" text-anchor="start">200支</text>
<text x="210" y="296" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">捲菸</text>
<text x="32" y="336" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">年滿20歲</text>
<text x="20" y="382" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">在免稅店買的也算在額度內</text>
</svg>
