<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 406" role="img" aria-label="安可之後:先想好怎麼回去" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>安可之後:先想好怎麼回去</title>
<rect width="400" height="406" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">安可之後:先想好怎麼回去</text>
<rect x="16" y="58" width="368" height="72" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="70" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="94" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="80" y="92" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">開演前</text>
<text x="80" y="114" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">用 NAVER 地圖查末班車,想好備案</text>
<rect x="16" y="140" width="368" height="94" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="152" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="176" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="80" y="174" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">KSPO DOME:避開人潮</text>
<text x="80" y="196" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">走到漢城百濟站(9 號線,約 20 分鐘)或夢</text>
<text x="80" y="218" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">村土城站(8 號線,約 23 分鐘)</text>
<rect x="16" y="244" width="368" height="72" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="256" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="280" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="80" y="278" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">錯過末班車</text>
<text x="80" y="300" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">深夜公車(N 字頭)或叫車 App</text>
<rect x="16" y="328" width="368" height="60" rx="10" fill="#e9e2d3" stroke="#b8392f" stroke-width="2"/>
<text x="30" y="354" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">計程車晚上 11 點到凌晨 2 點最貴(最多加成</text>
<text x="30" y="376" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">40%)</text>
</svg>
