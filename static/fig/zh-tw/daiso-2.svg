<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="15 分鐘逛完大型大創" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>15 分鐘逛完大型大創</title>
<rect width="720" height="300" fill="#f4f0e6"/>
<text x="32" y="48" font-size="24" fill="#16151a" font-weight="bold" text-anchor="start">15 分鐘逛完大型大創</text>
<rect x="32" y="80" width="150" height="190" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<circle cx="107.0" cy="114" r="20" fill="#16151a"/>
<text x="107.0" y="121" font-size="20" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="107.0" y="172" font-size="17" fill="#16151a" font-weight="bold" text-anchor="middle">看電梯旁</text>
<text x="107.0" y="198" font-size="16" fill="#16151a" font-weight="normal" text-anchor="middle">樓層指南,</text>
<text x="107.0" y="224" font-size="16" fill="#16151a" font-weight="normal" text-anchor="middle">縮到 2~3 層</text>
<path d="M184 175 l12 0 m-6 -6 l6 6 l-6 6" fill="none" stroke="#5f5b55" stroke-width="2"/>
<rect x="200" y="80" width="150" height="190" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<circle cx="275.0" cy="114" r="20" fill="#16151a"/>
<text x="275.0" y="121" font-size="20" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="275.0" y="172" font-size="17" fill="#16151a" font-weight="bold" text-anchor="middle">先去美妝樓層</text>
<text x="275.0" y="198" font-size="16" fill="#16151a" font-weight="normal" text-anchor="middle">熱門商品</text>
<text x="275.0" y="224" font-size="16" fill="#16151a" font-weight="normal" text-anchor="middle">很快賣完</text>
<path d="M352 175 l12 0 m-6 -6 l6 6 l-6 6" fill="none" stroke="#5f5b55" stroke-width="2"/>
<rect x="368" y="80" width="150" height="190" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<circle cx="443.0" cy="114" r="20" fill="#16151a"/>
<text x="443.0" y="121" font-size="20" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="443.0" y="172" font-size="17" fill="#16151a" font-weight="bold" text-anchor="middle">一個購物籃</text>
<text x="443.0" y="198" font-size="16" fill="#16151a" font-weight="normal" text-anchor="middle">= 一張收據</text>
<text x="443.0" y="224" font-size="16" fill="#16151a" font-weight="normal" text-anchor="middle">(不能加總)</text>
<path d="M520 175 l12 0 m-6 -6 l6 6 l-6 6" fill="none" stroke="#5f5b55" stroke-width="2"/>
<rect x="536" y="80" width="150" height="190" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<circle cx="611.0" cy="114" r="20" fill="#b8392f"/>
<text x="611.0" y="121" font-size="20" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<text x="611.0" y="172" font-size="17" fill="#16151a" font-weight="bold" text-anchor="middle">結帳時</text>
<text x="611.0" y="198" font-size="16" fill="#16151a" font-weight="normal" text-anchor="middle">先出示護照,</text>
<text x="611.0" y="224" font-size="16" fill="#16151a" font-weight="normal" text-anchor="middle">再付款</text>
</svg>
