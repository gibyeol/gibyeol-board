<text x="30" y="549" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">自助結帳</text>
<text x="30" y="571" font-size="16" fill="#16151a" text-anchor="start">掃商品上的 QR 碼,不是條碼。</text>
