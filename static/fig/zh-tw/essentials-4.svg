<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 424" role="img" aria-label="四種卡,怎麼付錢" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>四種卡,怎麼付錢</title>
<rect width="400" height="424" fill="#f4f0e6"/>
<text x="20" y="42" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">四種卡,怎麼付錢</text>
<rect x="16" y="56" width="368" height="67" rx="10" fill="#e9e2d3"/>
<rect x="30" y="66" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="88" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">T</text>
<text x="78" y="81" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">T-money</text>
<text x="78" y="103" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">超商、車站機器。儲值通常要韓元現金</text>
<rect x="16" y="133" width="368" height="89" rx="10" fill="#e9e2d3"/>
<rect x="30" y="143" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="165" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
<text x="78" y="158" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">機場快線T-money卡</text>
<text x="78" y="180" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">機場快線車站1萬5千韓元。可刷海外</text>
<text x="78" y="202" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">信用卡</text>
<rect x="16" y="232" width="368" height="67" rx="10" fill="#e9e2d3"/>
<rect x="30" y="242" width="37.334" height="32" rx="8" fill="#b8392f"/>
<text x="48.667" y="264" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">W</text>
<text x="79.334" y="257" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">WOWPASS</text>
<text x="79.334" y="279" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">主要車站機器,用本國貨幣儲值</text>
<rect x="16" y="309" width="368" height="89" rx="10" fill="#e9e2d3"/>
<rect x="30" y="319" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="341" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
<text x="78" y="334" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">氣候同行卡短期券</text>
<text x="78" y="356" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">僅限首爾。273站新售票機收Visa、</text>
<text x="78" y="378" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Mastercard</text>
</svg>
