<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 671" role="img" aria-label="搭一趟的步驟" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>搭一趟的步驟</title>
<rect width="400" height="671" rx="16" fill="#f4f0e6"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16151a"/></marker></defs>
<text x="20" y="39" font-size="21" fill="#16151a" font-weight="bold" text-anchor="start">搭一趟的步驟</text>
<rect x="16" y="61" width="368" height="84" rx="12" fill="#ffffff" stroke="#b8392f" stroke-width="3"/>
<circle cx="42" cy="103" r="15" fill="#b8392f"/>
<text x="42" y="109" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<rect x="81" y="89" width="12" height="36" rx="3" fill="#16151a"/><rect x="107" y="89" width="12" height="36" rx="3" fill="#16151a"/><rect x="92" y="81" width="16" height="12" rx="3" fill="#b8392f"/>
<text x="138" y="98" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">進站嗶卡</text>
<text x="138" y="120" font-size="16" fill="#5f5b55" text-anchor="start">感應機顯示餘額</text>
<line x1="42" y1="146" x2="42" y2="162" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="16" y="165" width="368" height="84" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<circle cx="42" cy="207" r="15" fill="#b8392f"/>
<text x="42" y="213" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<circle cx="100" cy="207" r="22" fill="#16151a"/>
<text x="100" y="215" font-size="22" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<text x="138" y="202" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">看路線號碼</text>
<text x="138" y="224" font-size="16" fill="#5f5b55" text-anchor="start">再確認方向</text>
<line x1="42" y1="250" x2="42" y2="266" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="16" y="269" width="368" height="84" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<circle cx="42" cy="311" r="15" fill="#b8392f"/>
<text x="42" y="317" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<circle cx="86" cy="311" r="15" fill="#16151a"/><circle cx="116" cy="311" r="15" fill="#5f5b55"/>
<text x="86" y="317" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="116" y="317" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text>
<text x="138" y="306" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">站內轉乘</text>
<text x="138" y="328" font-size="16" fill="#5f5b55" text-anchor="start">不用再出閘門</text>
<line x1="42" y1="354" x2="42" y2="370" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="16" y="373" width="368" height="84" rx="12" fill="#ffffff" stroke="#b8392f" stroke-width="3"/>
<circle cx="42" cy="415" r="15" fill="#b8392f"/>
<text x="42" y="421" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<rect x="81" y="401" width="12" height="36" rx="3" fill="#16151a"/><rect x="107" y="401" width="12" height="36" rx="3" fill="#16151a"/><rect x="92" y="393" width="16" height="12" rx="3" fill="#b8392f"/>
<text x="138" y="410" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">出站嗶卡</text>
<text x="138" y="432" font-size="16" fill="#5f5b55" text-anchor="start">票價依距離計算</text>
<rect x="16" y="473" width="368" height="93" rx="12" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="2"/>
<text x="30" y="503" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">要接公車的話</text>
<text x="30" y="525" font-size="16" fill="#16151a" text-anchor="start">用同一張卡30分鐘內</text>
<text x="30" y="547" font-size="16" fill="#16151a" text-anchor="start">(晚上9點~早上7點為60分鐘)上車</text>
<rect x="16" y="582" width="368" height="71" rx="12" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="2"/>
<text x="30" y="612" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">用單程票的話</text>
<text x="30" y="634" font-size="16" fill="#16151a" text-anchor="start">出站後放進押金退還機,退回500韓元</text>
</svg>
