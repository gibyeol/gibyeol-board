<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 424" role="img" aria-label="k.ride 給旅客的用法" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>k.ride 給旅客的用法</title>
<rect width="400" height="424" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">k.ride 給旅客的用法</text>
<rect x="40" y="54" width="320" height="352" rx="26" fill="#ffffff" stroke="#16151a" stroke-width="3"/>
<rect x="170" y="66" width="60" height="8" rx="4" fill="#e9e2d3" stroke="none" stroke-width="0"/>
<circle cx="74" cy="110" r="15" fill="#b8392f"/>
<text x="74" y="116" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="100" y="110" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">註冊</text>
<text x="100" y="134" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">手機驗證或社群帳號</text>
<circle cx="74" cy="188" r="15" fill="#b8392f"/>
<text x="74" y="194" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="100" y="188" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">綁卡</text>
<text x="100" y="212" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">信用卡、簽帳卡</text>
<circle cx="74" cy="266" r="15" fill="#b8392f"/>
<text x="74" y="272" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="100" y="266" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">叫車</text>
<text x="100" y="290" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">用133種語言搜尋</text>
<circle cx="74" cy="344" r="15" fill="#b8392f"/>
<text x="74" y="350" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="100" y="344" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">下車</text>
<text x="100" y="368" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">下車後自動扣款</text>
</svg>
