<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="2號線上的四個逛街區" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>2號線上的四個逛街區</title>
<rect x="0" y="0" width="720" height="440" rx="14" fill="#f4f0e6"/>
