<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 465" role="img" aria-label="2號線上的三個逛街區" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>2號線上的三個逛街區</title>
<rect width="400" height="465" rx="16" fill="#f4f0e6"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16151a"/></marker></defs>
<text x="20" y="39" font-size="21" fill="#16151a" font-weight="bold" text-anchor="start">2號線上的三個逛街區</text>
<text x="20" y="65" font-size="16" fill="#5f5b55" text-anchor="start">示意圖,非實際比例</text>
<path d="M0,389 C80,367 160,407 240,389 S360,373 400,385 L400,429 C320,415 260,447 180,431 S60,419 0,435 Z" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="1.5"/>
<ellipse cx="200" cy="301" rx="150" ry="112" fill="none" stroke="#16151a" stroke-width="3" stroke-dasharray="9 7"/>
<circle cx="50" cy="301" r="10" fill="#b8392f" stroke="#ffffff" stroke-width="3"/>
<circle cx="182" cy="190" r="10" fill="#b8392f" stroke="#ffffff" stroke-width="3"/>
<circle cx="349" cy="317" r="10" fill="#b8392f" stroke="#ffffff" stroke-width="3"/>
<g stroke="#f4f0e6" stroke-width="6" stroke-linejoin="round" paint-order="stroke">
<text x="182" y="118" font-size="18" fill="#16151a" font-weight="bold" text-anchor="middle">明洞</text>
<text x="182" y="140" font-size="16" fill="#5f5b55" text-anchor="middle">美妝</text>
<text x="182" y="162" font-size="16" fill="#b8392f" font-weight="bold" text-anchor="middle">乙支路入口站 5號出口</text>
</g>
<g stroke="#f4f0e6" stroke-width="6" stroke-linejoin="round" paint-order="stroke">
<text x="74" y="315" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">弘大</text>
<text x="74" y="337" font-size="16" fill="#5f5b55" text-anchor="start">年輕服飾</text>
<text x="74" y="359" font-size="16" fill="#b8392f" font-weight="bold" text-anchor="start">弘大入口站 9號出口</text>
</g>
<g stroke="#f4f0e6" stroke-width="6" stroke-linejoin="round" paint-order="stroke">
<text x="329" y="233" font-size="18" fill="#16151a" font-weight="bold" text-anchor="end">聖水</text>
<text x="329" y="255" font-size="16" fill="#5f5b55" text-anchor="end">新品牌、快閃店</text>
<text x="329" y="277" font-size="16" fill="#b8392f" font-weight="bold" text-anchor="end">聖水站 4號出口</text>
</g>
<text x="60" y="423" font-size="16" fill="#5f5b55" text-anchor="middle">漢江</text>
<text x="380" y="447" font-size="16" fill="#16151a" font-weight="bold" text-anchor="end">2號線(環狀線)</text>
