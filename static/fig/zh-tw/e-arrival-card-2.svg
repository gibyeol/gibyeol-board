<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" role="img" aria-label="31 日抵達的話" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<rect width="400" height="550" fill="#f4f0e6"/>
<text x="16" y="40" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">31 日抵達的話</text>
<text x="16" y="62" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">日期以韓國時間計算</text>
<rect x="16" y="76" width="368" height="68" rx="10" fill="#e9e2d3" stroke="#e9e2d3" stroke-width="1"/>
<rect x="28" y="88" width="56" height="36" rx="8" fill="#ffffff"/>
<text x="56.0" y="112" font-size="16" font-weight="700" fill="#5f5b55" text-anchor="middle">28 日</text>
<text x="96" y="110" font-size="17" font-weight="700" fill="#5f5b55" text-anchor="start">太早</text>
<text x="96" y="134" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">還不能填</text>
<rect x="16" y="154" width="368" height="68" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<rect x="28" y="166" width="56" height="36" rx="8" fill="#b8392f"/>
<text x="56.0" y="190" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">29 日</text>
<text x="96" y="188" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">開放填寫</text>
<text x="96" y="212" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">抵達前 3 天開始</text>
<rect x="16" y="232" width="368" height="64" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1"/>
<rect x="28" y="244" width="56" height="36" rx="8" fill="#16151a"/>
<text x="56.0" y="268" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">30 日</text>
<text x="96" y="266" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">可以填</text>
<rect x="16" y="306" width="368" height="90" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1"/>
<rect x="28" y="318" width="56" height="36" rx="8" fill="#16151a"/>
<text x="56.0" y="342" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">31 日</text>
<text x="96" y="340" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">抵達</text>
<text x="96" y="364" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">走到入境審查前</text>
<text x="96" y="386" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">都還能補填</text>
<rect x="16" y="412" width="368" height="90" rx="10" fill="#e9e2d3" stroke="#e9e2d3" stroke-width="1"/>
<text x="30" y="446" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">入境卡失效</text>
<text x="30" y="470" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">送出後滿 72 小時,</text>
<text x="30" y="492" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">或通過入境審查後</text>
<text x="16" y="534" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">班機改了?重新填一次。</text>
</svg>
