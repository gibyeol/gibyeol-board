<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 368" role="img" aria-label="下車後的轉乘時限" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>下車後的轉乘時限</title>
<rect width="400" height="368" rx="16" fill="#f4f0e6"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16151a"/></marker></defs>
<text x="20" y="39" font-size="21" fill="#16151a" font-weight="bold" text-anchor="start">下車後的轉乘時限</text>
<text x="32" y="77" font-size="16" fill="#b8392f" font-weight="bold" text-anchor="start">下車刷卡</text>
<text x="20" y="108" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">07:00~21:00</text>
<rect x="38" y="120" width="342" height="44" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="38" y="120" width="171" height="44" rx="10" fill="#e9e2d3" stroke="#16151a" stroke-width="1.5"/>
<text x="123.5" y="148" font-size="18" fill="#16151a" font-weight="bold" text-anchor="middle">30分鐘</text>
<circle cx="38" cy="142" r="9" fill="#b8392f"/>
<text x="20" y="201" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">21:00~隔天07:00</text>
<rect x="38" y="213" width="342" height="44" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="38" y="213" width="342" height="44" rx="10" fill="#e9e2d3" stroke="#16151a" stroke-width="1.5"/>
<text x="209" y="241" font-size="18" fill="#16151a" font-weight="bold" text-anchor="middle">60分鐘</text>
<circle cx="38" cy="235" r="9" fill="#b8392f"/>
<text x="20" y="294" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">時限內搭下一班公車或地鐵算轉乘</text>
<circle cx="26" cy="315" r="3.5" fill="#5f5b55"/>
<text x="38" y="320" font-size="16" fill="#5f5b55" text-anchor="start">最多轉乘4次</text>
<circle cx="26" cy="337" r="3.5" fill="#5f5b55"/>
<text x="38" y="342" font-size="16" fill="#5f5b55" text-anchor="start">同一路線再上車不算轉乘</text>
</svg>
