<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-label="免稅店?退稅商店?" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>免稅店?退稅商店?</title>
<rect width="400" height="340" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">免稅店?退稅商店?</text>
<rect x="16" y="54" width="368" height="116" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<text x="32" y="84" font-size="18" font-weight="700" fill="#b8392f" text-anchor="start">免稅店</text>
<text x="32" y="110" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">只賣給要出境的人</text>
<text x="32" y="134" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">過出境審查後</text>
<text x="32" y="158" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">在提貨處拿到</text>
<rect x="16" y="182" width="368" height="116" rx="10" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<text x="32" y="212" font-size="18" font-weight="700" fill="#16151a" text-anchor="start">退稅商店</text>
<text x="32" y="238" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">Olive Young 等一般商店</text>
<text x="32" y="262" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">東西當場帶走</text>
<text x="32" y="286" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">退還部分10%加值稅</text>
<text x="20" y="322" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">同一筆購買只能用其中一種</text>
</svg>
