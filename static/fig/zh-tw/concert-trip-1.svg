<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 610" role="img" aria-label="從國外買韓團演唱會門票" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>從國外買韓團演唱會門票</title>
<rect width="400" height="610" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">從國外買韓團演唱會門票</text>
<rect x="16" y="58" width="368" height="72" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="70" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="94" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="80" y="92" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">看經紀公司公告</text>
<text x="80" y="114" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">會寫明唯一販售的網站</text>
<line x1="48" y1="131" x2="48" y2="141" stroke="#16151a" stroke-width="2.5"/>
<path d="M41,139 L48,149 L55,139 z" fill="#16151a"/>
<rect x="16" y="150" width="368" height="94" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="162" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="186" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="80" y="184" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">註冊國際版網站</text>
<text x="80" y="206" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">常見是 NOL World(world.nol.com),和</text>
<text x="80" y="228" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">韓國帳號分開</text>
<line x1="48" y1="245" x2="48" y2="255" stroke="#16151a" stroke-width="2.5"/>
<path d="M41,253 L48,263 L55,253 z" fill="#16151a"/>
<rect x="16" y="264" width="368" height="94" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="276" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="300" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="80" y="298" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">護照認證</text>
<text x="80" y="320" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">「Verified Member Only」的場次要先</text>
<text x="80" y="342" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">認證</text>
<line x1="48" y1="359" x2="48" y2="369" stroke="#16151a" stroke-width="2.5"/>
<path d="M41,367 L48,377 L55,367 z" fill="#16151a"/>
<rect x="16" y="378" width="368" height="72" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="390" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="414" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="80" y="412" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">用護照姓名訂票</text>
<text x="80" y="434" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">英文拼法一字不差。張數限制每場不同</text>
<line x1="48" y1="451" x2="48" y2="461" stroke="#16151a" stroke-width="2.5"/>
<path d="M41,459 L48,469 L55,459 z" fill="#16151a"/>
<rect x="16" y="470" width="368" height="72" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="482" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="506" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="80" y="504" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">現場取票</text>
<text x="80" y="526" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">實體證件+訂票確認,限訂票本人</text>
<rect x="16" y="554" width="368" height="38" rx="10" fill="#e9e2d3" stroke="#b8392f" stroke-width="2"/>
<text x="30" y="580" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">有人轉賣票給你?別買</text>
</svg>
