<text x="108" y="340" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">1,400韓元</text>
<rect x="16" y="367" width="368" height="92" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="395" width="68" height="36" rx="12" fill="#b8392f"/>
<text x="62" y="419" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">紅</text>
<text x="108" y="396" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">廣域</text>
<text x="108" y="419" font-size="16" fill="#5f5b55" text-anchor="start">連接首都圈與市區</text>
