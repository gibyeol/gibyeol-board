<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 613" role="img" aria-label="首爾公車,看顏色就懂" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>首爾公車,看顏色就懂</title>
<rect width="400" height="613" rx="16" fill="#f4f0e6"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16151a"/></marker></defs>
<text x="20" y="39" font-size="21" fill="#16151a" font-weight="bold" text-anchor="start">首爾公車,看顏色就懂</text>
<rect x="16" y="61" width="368" height="92" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="89" width="68" height="36" rx="12" fill="#2f5d9e"/>
<text x="62" y="113" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">藍</text>
