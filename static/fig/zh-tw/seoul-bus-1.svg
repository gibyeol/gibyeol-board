<text x="108" y="238" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">1,500韓元(社區1,200)</text>
<rect x="16" y="265" width="368" height="92" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="293" width="68" height="36" rx="12" fill="#d9a521"/>
<text x="62" y="317" font-size="17" fill="#16151a" font-weight="bold" text-anchor="middle">黃</text>
<text x="108" y="294" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">循環</text>
