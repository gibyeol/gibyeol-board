<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 645" role="img" aria-label="在大創可以退稅嗎?" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>在大創可以退稅嗎?</title>
<rect width="400" height="645" rx="16" fill="#f4f0e6"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16151a"/></marker></defs>
<text x="20" y="39" font-size="21" fill="#16151a" font-weight="bold" text-anchor="start">在大創可以退稅嗎?</text>
<rect x="16" y="61" width="368" height="72" rx="12" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="2"/>
<text x="200" y="91" font-size="17" fill="#16151a" font-weight="bold" text-anchor="middle">這家店有「Tax Free」或</text>
<text x="200" y="114" font-size="17" fill="#16151a" font-weight="bold" text-anchor="middle">「Tax Refund」標示嗎?</text>
<rect x="124" y="147" width="260" height="47" rx="12" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="2"/>
<text x="254" y="176" font-size="17" fill="#16151a" text-anchor="middle">照常付款</text>
<line x1="40" y1="133" x2="40" y2="170.5" stroke="#16151a" stroke-width="2.5"/>
<line x1="40" y1="170.5" x2="122" y2="170.5" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="86" y="161.5" font-size="16" fill="#5f5b55" font-weight="bold" text-anchor="middle">否</text>
<line x1="40" y1="170.5" x2="40" y2="244" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="52" y="226" font-size="16" fill="#b8392f" font-weight="bold" text-anchor="start">是</text>
<rect x="16" y="246" width="368" height="49" rx="12" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="2"/>
<text x="200" y="276" font-size="17" fill="#16151a" font-weight="bold" text-anchor="middle">同一張收據滿 15,000 韓元?</text>
<text x="56" y="319" font-size="16" fill="#5f5b55" text-anchor="start">5,000 韓元 × 3 = 15,000 韓元</text>
<rect x="124" y="339" width="260" height="70" rx="12" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="2"/>
<text x="254" y="368" font-size="17" fill="#16151a" text-anchor="middle">再加購,</text>
<text x="254" y="391" font-size="17" fill="#16151a" text-anchor="middle">或照常付款</text>
<line x1="40" y1="295" x2="40" y2="374" stroke="#16151a" stroke-width="2.5"/>
<line x1="40" y1="374" x2="122" y2="374" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="86" y="365" font-size="16" fill="#5f5b55" font-weight="bold" text-anchor="middle">否</text>
<text x="254" y="431" font-size="16" fill="#b8392f" text-anchor="middle">每張收據分開計算</text>
<line x1="40" y1="374" x2="40" y2="487" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="52" y="469" font-size="16" fill="#b8392f" font-weight="bold" text-anchor="start">是</text>
<rect x="16" y="489" width="368" height="76" rx="12" fill="#b8392f"/>
<text x="200" y="520" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">付款時</text>
<text x="200" y="545" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">出示護照正本</text>
<rect x="16" y="583" width="368" height="44" rx="12" fill="#e9e2d3"/>
<text x="200" y="610" font-size="16" fill="#16151a" text-anchor="middle">規定與上限:見退稅頁面</text>
</svg>
