<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" role="img" aria-label="自己的藥,能帶進韓國嗎?" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>自己的藥,能帶進韓國嗎?</title>
<rect width="400" height="380" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">自己的藥,能帶進韓國嗎?</text>
<rect x="16" y="58" width="368" height="72" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="70" width="40" height="36" rx="8" fill="#16151a" stroke="none" stroke-width="0"/>
<text x="48.0" y="94" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">?</text>
<text x="80" y="92" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">含麻醉或精神藥物成分嗎?</text>
<text x="80" y="114" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">看成分,不要只看品名(例:右美沙芬)</text>
<line x1="110" y1="130" x2="110" y2="160" stroke="#16151a" stroke-width="2.5"/>
<line x1="290" y1="130" x2="290" y2="160" stroke="#16151a" stroke-width="2.5"/>
<rect x="80" y="138" width="60" height="28" rx="14" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="110" y="158" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">是</text>
<rect x="260" y="138" width="60" height="28" rx="14" fill="#16151a" stroke="none" stroke-width="0"/>
<text x="290" y="158" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">否</text>
<rect x="16" y="174" width="180" height="138" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<text x="28" y="208" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">入境前取得 MFDS</text>
<text x="28" y="230" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">核准</text>
<text x="28" y="252" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">在醫藥品安全 Nara</text>
<text x="28" y="274" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">申請,預留最多 10 個</text>
<text x="28" y="296" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">工作天</text>
<rect x="204" y="174" width="180" height="138" rx="10" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<text x="216" y="208" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">6 瓶以內</text>
<text x="216" y="230" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">超過的話依用法 3 個</text>
<text x="216" y="252" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">月份以內</text>
<text x="20" y="340" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">6 瓶的規定自 2026 年 11 月 12 日起。須為合法處</text>
<text x="20" y="362" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">方或購買的藥。</text>
</svg>
