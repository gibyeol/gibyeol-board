<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" role="img" aria-label="在飯店用 배민 點外送" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>在飯店用 배민 點外送</title>
<rect width="400" height="460" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">在飯店用 배민 點外送</text>
<rect x="20" y="60" width="360" height="88" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="36" y="90" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">語言</text>
<text x="36" y="114" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">中文、英文、日文:</text>
<text x="36" y="136" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">跟著手機語言設定</text>
<rect x="20" y="158" width="360" height="88" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="36" y="188" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">付款</text>
<text x="36" y="212" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">外國信用卡、Apple Pay、</text>
<text x="36" y="234" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">微信支付、Alipay+</text>
<rect x="20" y="256" width="360" height="88" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="36" y="286" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">驗證</text>
<text x="36" y="310" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">用台灣手機號碼收簡訊,</text>
<text x="36" y="332" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">不用韓國門號</text>
<rect x="20" y="354" width="360" height="88" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="36" y="384" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">下單前</text>
<text x="36" y="408" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">複製飯店韓文地址,</text>
<text x="36" y="430" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">問櫃檯在哪裡取餐</text>
</svg>
