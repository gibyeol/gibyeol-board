<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 364" role="img" aria-label="兩張卡,用途不同" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>兩張卡,用途不同</title>
<rect width="400" height="364" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">兩張卡,用途不同</text>
<rect x="16" y="54" width="368" height="114" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="72" width="64" height="42" rx="6" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<rect x="36" y="82" width="14" height="11" rx="2" fill="#e9e2d3" stroke="#16151a" stroke-width="1.2"/>
<line x1="36" y1="104" x2="80" y2="104" stroke="#c9c1b2" stroke-width="3"/>
<text x="108" y="84" font-size="18" font-weight="700" fill="#b8392f" text-anchor="start">T-money</text>
<text x="108" y="108" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">地鐵、公車、機場鐵路普通車</text>
<text x="108" y="130" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">刷卡搭乘</text>
<text x="108" y="152" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">機場交通卡販賣機、便利商店有賣</text>
<rect x="16" y="180" width="368" height="114" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="198" width="64" height="42" rx="6" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<rect x="36" y="208" width="14" height="11" rx="2" fill="#e9e2d3" stroke="#16151a" stroke-width="1.2"/>
<line x1="36" y1="230" x2="80" y2="230" stroke="#c9c1b2" stroke-width="3"/>
<text x="108" y="210" font-size="18" font-weight="700" fill="#b8392f" text-anchor="start">WOWPASS</text>
<text x="108" y="234" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">內建交通用T-money</text>
<text x="108" y="256" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">外幣換成韓元存進卡</text>
<text x="108" y="278" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">在店家刷卡付款</text>
<text x="20" y="324" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">T-money也可以先預訂,</text>
<text x="20" y="346" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">到機場取卡</text>
</svg>
