<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-label="首爾地鐵付款方式怎麼選" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>首爾地鐵付款方式怎麼選</title>
<rect width="720" height="600" rx="16" fill="#f4f0e6"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16151a"/></marker></defs>

<text x="360" y="40" font-size="20" fill="#16151a" text-anchor="middle" font-weight="bold" dominant-baseline="middle">首爾地鐵付款方式怎麼選</text>
<rect x="30" y="80" width="330" height="110" rx="12" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="2"/>
<text x="195" y="124" font-size="17" fill="#16151a" text-anchor="middle" font-weight="normal" dominant-baseline="middle">只在首爾市內,一天3趟以上,</text>
<text x="195" y="146" font-size="17" fill="#16151a" text-anchor="middle" font-weight="normal" dominant-baseline="middle">連續3天以上?</text>
<line x1="360" y1="135" x2="410" y2="135" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="385" y="118" font-size="15" fill="#b8392f" text-anchor="middle" font-weight="bold" dominant-baseline="middle">是</text>
<rect x="410" y="80" width="280" height="110" rx="12" fill="#ffffff" stroke="#b8392f" stroke-width="3"/>
<text x="550" y="124" font-size="17" fill="#16151a" text-anchor="middle" font-weight="bold" dominant-baseline="middle">氣候同行卡</text>
<text x="550" y="146" font-size="17" fill="#16151a" text-anchor="middle" font-weight="bold" dominant-baseline="middle">短期券</text>
<line x1="195" y1="190" x2="195" y2="240" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="215" y="215" font-size="15" fill="#5f5b55" text-anchor="start" font-weight="bold" dominant-baseline="middle">否</text>
<rect x="30" y="240" width="330" height="110" rx="12" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="2"/>
<text x="195" y="284" font-size="17" fill="#16151a" text-anchor="middle" font-weight="normal" dominant-baseline="middle">想用一張卡同時</text>
<text x="195" y="306" font-size="17" fill="#16151a" text-anchor="middle" font-weight="normal" dominant-baseline="middle">換錢、刷卡消費?</text>
<line x1="360" y1="295" x2="410" y2="295" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="385" y="278" font-size="15" fill="#b8392f" text-anchor="middle" font-weight="bold" dominant-baseline="middle">是</text>
<rect x="410" y="240" width="280" height="110" rx="12" fill="#ffffff" stroke="#b8392f" stroke-width="3"/>
<text x="550" y="284" font-size="17" fill="#16151a" text-anchor="middle" font-weight="bold" dominant-baseline="middle">WOWPASS</text>
<text x="550" y="306" font-size="17" fill="#16151a" text-anchor="middle" font-weight="bold" dominant-baseline="middle">(內建T-money)</text>
<line x1="195" y1="350" x2="195" y2="400" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="215" y="375" font-size="15" fill="#5f5b55" text-anchor="start" font-weight="bold" dominant-baseline="middle">否</text>
<rect x="30" y="400" width="660" height="70" rx="12" fill="#ffffff" stroke="#b8392f" stroke-width="3"/>
<text x="360" y="435" font-size="18" fill="#16151a" text-anchor="middle" font-weight="bold" dominant-baseline="middle">T-money</text>
<line x1="30" y1="495" x2="690" y2="495" stroke="#c9c1b2" stroke-width="2" stroke-dasharray="6 6"/>
<text x="360" y="535" font-size="16" fill="#5f5b55" text-anchor="middle" font-weight="normal" dominant-baseline="middle">還沒有卡也沒現金?在新售票機(Visa・Mastercard)買單程票:</text>
<text x="360" y="555" font-size="16" fill="#5f5b55" text-anchor="middle" font-weight="normal" dominant-baseline="middle">每趟+100韓元、押金500韓元、不能轉乘公車</text>
</svg>
