<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 494" role="img" aria-label="旅客在大創買什麼、買給誰" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>旅客在大創買什麼、買給誰</title>
<rect width="400" height="494" rx="16" fill="#f4f0e6"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16151a"/></marker></defs>
<text x="20" y="39" font-size="21" fill="#16151a" font-weight="bold" text-anchor="start">旅客在大創買什麼、買給誰</text>
<rect x="16" y="61" width="368" height="119" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<rect x="44" y="98" width="28" height="40" rx="6" fill="#ffffff" stroke="#16151a" stroke-width="2.5"/><rect x="50" y="88" width="16" height="11" rx="2" fill="#b8392f"/><line x1="51" y1="116" x2="65" y2="116" stroke="#c9c1b2" stroke-width="3"/>
<text x="100" y="91" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">平價保養品</text>
<text x="100" y="114" font-size="16" fill="#5f5b55" text-anchor="start">美妝品牌約 170 個(2026 年)</text>
<text x="100" y="136" font-size="16" fill="#5f5b55" text-anchor="start">常是小容量或大創專用系列</text>
<text x="100" y="162" font-size="16" fill="#b8392f" font-weight="bold" text-anchor="start">買給:自己</text>
<rect x="16" y="192" width="368" height="119" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<path d="M38,228 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5 v46 h-40 z" fill="#e9e2d3" stroke="#16151a" stroke-width="2.5" stroke-linejoin="round"/><circle cx="58" cy="254" r="9" fill="#b8392f"/>
<text x="100" y="222" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">零食和小伴手禮</text>
<text x="100" y="245" font-size="16" fill="#5f5b55" text-anchor="start">零食大多 1,000 至 2,000 韓元</text>
<text x="100" y="267" font-size="16" fill="#5f5b55" text-anchor="start">角色商品、小卡周邊</text>
<text x="100" y="293" font-size="16" fill="#b8392f" font-weight="bold" text-anchor="start">買給:分送親友、K-POP 粉絲</text>
<rect x="16" y="323" width="368" height="97" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<rect x="40" y="358" width="36" height="30" rx="6" fill="#ffffff" stroke="#16151a" stroke-width="2.5"/><line x1="51" y1="358" x2="51" y2="346" stroke="#16151a" stroke-width="4"/><line x1="65" y1="358" x2="65" y2="346" stroke="#16151a" stroke-width="4"/><path d="M58,388 q0,12 12,14" fill="none" stroke="#b8392f" stroke-width="3"/>
<text x="100" y="353" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">旅途用品</text>
<text x="100" y="376" font-size="16" fill="#5f5b55" text-anchor="start">萬用轉接頭、行李秤、手機充電器</text>
<text x="100" y="402" font-size="16" fill="#b8392f" font-weight="bold" text-anchor="start">買給:旅途中的自己</text>
<rect x="16" y="432" width="368" height="44" rx="12" fill="#e9e2d3"/>
<text x="30" y="459" font-size="16" fill="#16151a" text-anchor="start">買給誰是我們的判斷。價格請看標價。</text>
</svg>
