<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 646" role="img" aria-label="從仁川機場到各區" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>從仁川機場到各區</title>
<rect width="400" height="646" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">從仁川機場到各區</text>
<rect x="20" y="62" width="360" height="36" rx="8" fill="#16151a" stroke="#16151a" stroke-width="1"/>
<text x="36" y="86" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">仁川機場</text>
<text x="364" y="86" font-size="16" font-weight="700" fill="#ffffff" text-anchor="end">機場鐵路</text>
<line x1="36" y1="98" x2="36" y2="274" stroke="#b8392f" stroke-width="5"/>
<circle cx="36" cy="122" r="9" fill="#ffffff" stroke="#b8392f" stroke-width="3"/>
<text x="58" y="128" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">弘大入口</text>
<text x="58" y="152" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">弘大・普通車約 1 小時、4,650 韓元</text>
<text x="58" y="174" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">2 號線 → 聖水</text>
<circle cx="36" cy="198" r="9" fill="#ffffff" stroke="#b8392f" stroke-width="3"/>
<text x="58" y="204" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">孔德</text>
<circle cx="36" cy="274" r="9" fill="#ffffff" stroke="#b8392f" stroke-width="3"/>
<text x="58" y="280" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">首爾站</text>
<text x="58" y="304" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">直達車不停站 43 分、13,000 韓元</text>
<text x="58" y="326" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">4 號線 → 明洞</text>
<text x="20" y="372" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">沒有鐵路就搭機場巴士</text>
<rect x="20" y="384" width="360" height="222" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="36" y="412" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">6001</text>
<text x="92" y="412" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">明洞、東大門</text>
<text x="36" y="442" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">6002</text>
<text x="92" y="442" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">弘大、鍾路</text>
<text x="36" y="472" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">6011</text>
<text x="92" y="472" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">景福宮、昌德宮</text>
<text x="36" y="502" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">6701</text>
<text x="92" y="502" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">光化門、市廳、乙支路</text>
<text x="36" y="532" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">6702</text>
<text x="92" y="532" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">南山、東大門</text>
<text x="36" y="562" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">6013</text>
<text x="92" y="562" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">聖水洞</text>
<text x="36" y="592" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">6020</text>
<text x="92" y="592" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">江南</text>
<text x="20" y="628" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">2026 年 6 月的時間(Visit Seoul)</text>
</svg>
