<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-label="依需求挑選" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>依需求挑選</title>
<rect width="720" height="560" fill="#f4f0e6"/>
<rect x="160" y="24" width="400" height="48" rx="24" fill="#16151a"/><text x="360" y="54" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">你希望這個產品做到什麼?</text>
<line x1="360" y1="72" x2="360" y2="94" stroke="#c9c1b2" stroke-width="2"/><rect x="30" y="100" width="270" height="84" rx="8" fill="#e9e2d3"/><text x="165" y="148" font-size="15" fill="#16151a" font-weight="bold" text-anchor="middle">防曬</text>
<line x1="300" y1="142" x2="390" y2="142" stroke="#16151a" stroke-width="2"/><polygon points="390,135 404,142 390,149" fill="#16151a"/><rect x="408" y="100" width="282" height="84" rx="8" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/><text x="549" y="138" font-size="15" fill="#16151a" font-weight="normal" text-anchor="middle"><tspan x="549" dy="0">盒上有 SPF・PA,</tspan><tspan x="549" dy="20">加上「기능성화장품」</tspan></text>
<rect x="30" y="208" width="270" height="84" rx="8" fill="#e9e2d3"/><text x="165" y="246" font-size="15" fill="#16151a" font-weight="bold" text-anchor="middle"><tspan x="165" dy="0">美白・</tspan><tspan x="165" dy="20">改善皺紋</tspan></text>
<line x1="300" y1="250" x2="390" y2="250" stroke="#16151a" stroke-width="2"/><polygon points="390,243 404,250 390,257" fill="#16151a"/><rect x="408" y="208" width="282" height="84" rx="8" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/><text x="549" y="246" font-size="15" fill="#16151a" font-weight="normal" text-anchor="middle"><tspan x="549" dy="0">「기능성화장품」加上</tspan><tspan x="549" dy="20">寫明該功效的效能說明</tspan></text>
<rect x="30" y="316" width="270" height="84" rx="8" fill="#e9e2d3"/><text x="165" y="354" font-size="15" fill="#16151a" font-weight="bold" text-anchor="middle"><tspan x="165" dy="0">對香料</tspan><tspan x="165" dy="20">容易敏感</tspan></text>
<line x1="300" y1="358" x2="390" y2="358" stroke="#16151a" stroke-width="2"/><polygon points="390,351 404,358 390,365" fill="#16151a"/><rect x="408" y="316" width="282" height="84" rx="8" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/><text x="549" y="354" font-size="15" fill="#16151a" font-weight="normal" text-anchor="middle"><tspan x="549" dy="0">在全成分找「향료(香料)」</tspan><tspan x="549" dy="20">和致敏成分名稱</tspan></text>
<rect x="30" y="424" width="270" height="84" rx="8" fill="#e9e2d3"/><text x="165" y="462" font-size="15" fill="#16151a" font-weight="bold" text-anchor="middle"><tspan x="165" dy="0">廣告寫「再生」「抗發炎」</tspan><tspan x="165" dy="20">「塗抹式肉毒」</tspan></text>
<line x1="300" y1="466" x2="390" y2="466" stroke="#b8392f" stroke-width="2"/><polygon points="390,459 404,466 390,473" fill="#b8392f"/><rect x="408" y="424" width="282" height="84" rx="8" fill="#ffffff" stroke="#b8392f" stroke-width="2"/><text x="549" y="462" font-size="15" fill="#b8392f" font-weight="bold" text-anchor="middle"><tspan x="549" dy="0">跳過。化妝品</tspan><tspan x="549" dy="20">不是藥品</tspan></text>
<text x="360" y="552" font-size="15" fill="#5f5b55" font-weight="normal" text-anchor="middle">有皮膚疾病或在用處方藥?先問醫師或藥師。</text>
</svg>
