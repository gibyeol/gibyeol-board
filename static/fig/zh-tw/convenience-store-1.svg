<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" role="img" aria-label="在櫃台儲值T-money" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>在櫃台儲值T-money</title>
<rect width="400" height="430" fill="#f4f0e6"/>
<text x="20" y="42" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">在櫃台儲值T-money</text>
<rect x="16" y="56" width="368" height="45" rx="10" fill="#e9e2d3"/>
<circle cx="48" cy="82" r="17" fill="#b8392f"/>
<text x="48" y="88" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="78" y="81" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">交出卡片和韓元現金</text>
<path d="M44 97 V119" stroke="#5f5b55" stroke-width="2"/>
<path d="M38 113 L44 121 L50 113" fill="none" stroke="#5f5b55" stroke-width="2"/>
<rect x="16" y="125" width="368" height="67" rx="10" fill="#e9e2d3"/>
<circle cx="48" cy="151" r="17" fill="#b8392f"/>
<text x="48" y="157" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="78" y="150" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">說要儲多少</text>
<text x="78" y="172" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">或說「충전해 주세요」(請幫我儲值)</text>
<path d="M44 188 V210" stroke="#5f5b55" stroke-width="2"/>
<path d="M38 204 L44 212 L50 204" fill="none" stroke="#5f5b55" stroke-width="2"/>
<rect x="16" y="216" width="368" height="67" rx="10" fill="#e9e2d3"/>
<circle cx="48" cy="242" r="17" fill="#b8392f"/>
<text x="48" y="248" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="78" y="241" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">店員儲值</text>
<text x="78" y="263" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">過閘門時會顯示餘額</text>
<rect x="16" y="293" width="368" height="111" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<circle cx="48" cy="319" r="17" fill="#b8392f"/>
<text x="48" y="325" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
<text x="78" y="318" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">沒有韓元現金?</text>
<text x="78" y="340" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">iPhone:Mobile T-money綁Mastercar</text>
<text x="78" y="362" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">d、Amex、銀聯(不收Visa)。機場:機場快</text>
<text x="78" y="384" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">線T-money卡1萬5千韓元,可刷海外卡</text>
</svg>
