<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 494" role="img" aria-label="吃完晚餐,怎麼回去?" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>吃完晚餐,怎麼回去?</title>
<rect width="400" height="494" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">吃完晚餐,怎麼回去?</text>
<rect x="16" y="54" width="368" height="68" rx="10" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="32" y="84" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">末班車還有嗎?</text>
<text x="32" y="108" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">用 NAVER 地圖查</text>
<line x1="300" y1="122" x2="300" y2="148" stroke="#16151a" stroke-width="2.5"/>
<path d="M293,146 L300,156 L307,146 z" fill="#16151a"/>
<text x="310" y="146" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">有</text>
<rect x="150" y="156" width="234" height="42" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2.5"/>
<text x="166" y="184" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">地鐵</text>
<line x1="60" y1="122" x2="60" y2="212" stroke="#16151a" stroke-width="2.5"/>
<text x="70" y="146" font-size="16" font-weight="700" fill="#5f5b55" text-anchor="start">沒有</text>
<line x1="60" y1="210" x2="60" y2="226" stroke="#16151a" stroke-width="2.5"/>
<path d="M53,224 L60,234 L67,224 z" fill="#16151a"/>
<rect x="16" y="234" width="368" height="44" rx="10" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="32" y="264" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">回去的路上有 N 公車嗎?</text>
<line x1="300" y1="278" x2="300" y2="304" stroke="#16151a" stroke-width="2.5"/>
<path d="M293,302 L300,312 L307,302 z" fill="#16151a"/>
<text x="310" y="302" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">有</text>
<rect x="150" y="312" width="234" height="64" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2.5"/>
<text x="166" y="340" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">深夜公車2,500韓元</text>
<text x="166" y="362" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">晚上11點〜早上6點</text>
<line x1="60" y1="278" x2="60" y2="390" stroke="#16151a" stroke-width="2.5"/>
<text x="70" y="302" font-size="16" font-weight="700" fill="#5f5b55" text-anchor="start">沒有</text>
<line x1="60" y1="388" x2="60" y2="404" stroke="#16151a" stroke-width="2.5"/>
<path d="M53,402 L60,412 L67,402 z" fill="#16151a"/>
<rect x="16" y="412" width="368" height="64" rx="10" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<text x="32" y="440" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">計程車:k.ride 或 Kakao T</text>
<text x="32" y="462" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">深夜最多貴40%</text>
</svg>
