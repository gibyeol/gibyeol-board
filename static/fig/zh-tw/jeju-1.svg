<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 393" role="img" aria-label="仁川到濟州:兩種走法" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>仁川到濟州:兩種走法</title>
<rect width="400" height="393" fill="#f4f0e6"/>
<text x="20" y="42" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">仁川到濟州:兩種走法</text>
<rect x="16" y="56" width="368" height="67" rx="10" fill="#e9e2d3"/>
<rect x="30" y="66" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="88" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
<text x="78" y="81" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">經金浦,每天都有</text>
<text x="78" y="103" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">從仁川搭機場鐵路到金浦,再搭國內線</text>
<rect x="16" y="133" width="368" height="89" rx="10" fill="#e9e2d3"/>
<rect x="30" y="143" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="165" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
<text x="78" y="158" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">直飛,一週3班</text>
<text x="78" y="180" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">濟州航空仁川–濟州:週一、三、五,到</text>
<text x="78" y="202" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">2027年3月27日</text>
<rect x="16" y="232" width="368" height="89" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<rect x="30" y="242" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="264" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
<text x="78" y="257" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">提早訂</text>
<text x="78" y="279" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">金浦–濟州是全球最繁忙航線,2026年座</text>
<text x="78" y="301" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">位卻變少</text>
<text x="20" y="349" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">國內線也要帶護照。大韓航空報到在起飛前30分鐘</text>
<text x="20" y="371" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">截止。</text>
</svg>
