<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 474" role="img" aria-label="Gyeongbokgung: walk north" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
