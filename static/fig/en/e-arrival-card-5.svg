<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 336" role="img" aria-label="Two different things" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<rect width="400" height="336" fill="#f4f0e6"/>
<text x="16" y="40" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">Two different things</text>
<rect x="16" y="54" width="368" height="134" rx="10" fill="#e9e2d3" stroke="#e9e2d3" stroke-width="1"/>
<text x="30" y="88" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">K-ETA</text>
<text x="30" y="112" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Travel authorisation</text>
<text x="30" y="134" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">₩10,000, applied for before you fly</text>
<text x="30" y="156" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">22 countries and regions incl. the US:</text>
<text x="30" y="178" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">exempt until 31 December 2026</text>
<rect x="16" y="198" width="368" height="90" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<text x="30" y="232" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">e-Arrival Card</text>
<text x="30" y="256" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">Replaces the paper arrival card</text>
<text x="30" y="278" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">Free, in the 3 days before you land</text>
<text x="16" y="320" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">Valid K-ETA? Then no e-Arrival Card.</text>
</svg>
