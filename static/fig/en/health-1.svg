<rect x="28" y="322" width="55.99040000000001" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="55.995200000000004" y="346" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1330</text>
<text x="95.99040000000001" y="344" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Three-way call when language</text>
<text x="95.99040000000001" y="366" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">is the problem</text>
<text x="95.99040000000001" y="388" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Hours and languages: Everyday</text>
