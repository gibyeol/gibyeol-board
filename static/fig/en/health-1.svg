<rect x="28" y="196" width="55.99040000000001" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="55.995200000000004" y="220" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1339</text>
<text x="95.99040000000001" y="218" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">KDCA health call center</text>
<text x="95.99040000000001" y="240" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">24 hours, every day. Free from a</text>
<text x="95.99040000000001" y="262" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Korean number. From abroad</text>
<text x="95.99040000000001" y="284" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">+82-2-2633-1339</text>
