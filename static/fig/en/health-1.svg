<rect x="28" y="70" width="46.4928" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="51.2464" y="94" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">119</text>
<text x="86.4928" y="92" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Ambulance and fire</text>
<text x="86.4928" y="114" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">24 hours. Chest pain, trouble</text>
<text x="86.4928" y="136" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">breathing, fainting, heavy</text>
<text x="86.4928" y="158" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">bleeding, a bad injury</text>
