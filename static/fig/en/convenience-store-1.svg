<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 519" role="img" aria-label="Loading T-money at the counter" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>Loading T-money at the counter</title>
<rect width="400" height="519" fill="#f4f0e6"/>
<text x="20" y="42" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">Loading T-money at the counter</text>
<rect x="16" y="56" width="368" height="68" rx="10" fill="#e9e2d3"/>
<circle cx="48" cy="82" r="17" fill="#b8392f"/>
<text x="48" y="88" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="78" y="81" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Hand over the card and won</text>
<text x="78" y="104" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">cash</text>
<path d="M44 120 V142" stroke="#5f5b55" stroke-width="2"/>
<path d="M38 136 L44 144 L50 136" fill="none" stroke="#5f5b55" stroke-width="2"/>
<rect x="16" y="148" width="368" height="89" rx="10" fill="#e9e2d3"/>
<circle cx="48" cy="174" r="17" fill="#b8392f"/>
<text x="48" y="180" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="78" y="173" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Say how much</text>
<text x="78" y="195" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Or say “충전해 주세요” (please top it</text>
<text x="78" y="217" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">up)</text>
<path d="M44 233 V255" stroke="#5f5b55" stroke-width="2"/>
<path d="M38 249 L44 257 L50 249" fill="none" stroke="#5f5b55" stroke-width="2"/>
<rect x="16" y="261" width="368" height="89" rx="10" fill="#e9e2d3"/>
<circle cx="48" cy="287" r="17" fill="#b8392f"/>
<text x="48" y="293" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="78" y="286" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Staff load it</text>
<text x="78" y="308" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Keep the card; the gate shows your</text>
<text x="78" y="330" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">balance</text>
<rect x="16" y="360" width="368" height="133" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<circle cx="48" cy="386" r="17" fill="#b8392f"/>
<text x="48" y="392" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
<text x="78" y="385" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">No won cash?</text>
<text x="78" y="407" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">iPhone: MobileTmoney with</text>
<text x="78" y="429" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">Mastercard, Amex or UnionPay (not</text>
<text x="78" y="451" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">Visa). Airport: the AREX T-money</text>
<text x="78" y="473" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">card, ₩15,000, foreign cards OK</text>
</svg>
