<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 452" role="img" aria-label="January in Seoul: average low −5.5°C" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>January in Seoul: average low −5.5°C</title>
<rect width="400" height="452" fill="#f4f0e6"/>
<text x="20" y="42" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">January in Seoul: average low</text>
<text x="20" y="68" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">−5.5°C</text>
<rect x="16" y="82" width="368" height="67" rx="10" fill="#e9e2d3"/>
<rect x="30" y="92" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="114" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="78" y="107" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Long down coat or parka</text>
<text x="78" y="129" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">One that covers your hips</text>
<rect x="16" y="159" width="368" height="67" rx="10" fill="#e9e2d3"/>
<rect x="30" y="169" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="191" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="78" y="184" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Thermal base layer</text>
<text x="78" y="206" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Warm outside, not too hot inside</text>
<rect x="16" y="236" width="368" height="67" rx="10" fill="#e9e2d3"/>
<rect x="30" y="246" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="268" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="78" y="261" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Hat, gloves, scarf</text>
<text x="78" y="283" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Touchscreen gloves for maps</text>
<rect x="16" y="313" width="368" height="67" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<rect x="30" y="323" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="345" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">+</text>
<text x="78" y="338" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">Buy there: hot packs (핫팩)</text>
<text x="78" y="360" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">CU, GS25, 7-Eleven, all winter</text>
<text x="20" y="408" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Indoors is heated: open the coat, take off</text>
<text x="20" y="430" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">the scarf.</text>
</svg>
