<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 438" role="img" aria-label="What your bus ticket shows" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>What your bus ticket shows</title>
<rect width="400" height="438" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">What your bus ticket shows</text>
<rect x="16" y="54" width="368" height="260" rx="8" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<line x1="16" y1="68" x2="384" y2="68" stroke="#c9c1b2" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="32" y="100" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">Destination</text>
<rect x="32" y="110" width="150" height="14" rx="4" fill="#e9e2d3" stroke="none" stroke-width="0"/>
<text x="32" y="158" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">Fare</text>
<rect x="32" y="168" width="150" height="14" rx="4" fill="#e9e2d3" stroke="none" stroke-width="0"/>
<text x="32" y="216" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">Boarding time</text>
<rect x="32" y="226" width="150" height="14" rx="4" fill="#e9e2d3" stroke="none" stroke-width="0"/>
<text x="32" y="274" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">Boarding location</text>
<rect x="32" y="284" width="120" height="14" rx="4" fill="#e9e2d3" stroke="none" stroke-width="0"/>
<text x="170" y="297" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">← Go to this stop</text>
<rect x="16" y="330" width="368" height="62" rx="8" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="1.5"/>
<circle cx="40" cy="361.0" r="7" fill="#f4f0e6" stroke="#16151a" stroke-width="1.5"/>
<text x="60" y="356" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">Luggage claim tag</text>
<text x="60" y="378" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Match the number when you get off</text>
<text x="20" y="420" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Up to 2 bags per person, 28 in or smaller</text>
</svg>
