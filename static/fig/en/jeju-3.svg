<text x="78" y="427" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">QR: enter the fare</text>
<text x="78" y="449" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">₩1,150 regular, ₩2,000 express</text>
<text x="78" y="471" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">101</text>
<rect x="16" y="501" width="368" height="67" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<rect x="30" y="511" width="36" height="32" rx="8" fill="#b8392f"/>
