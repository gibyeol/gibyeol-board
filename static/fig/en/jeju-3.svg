<text x="78" y="526" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">No cash</text>
<text x="78" y="548" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">Not accepted since 1 October 2024</text>
