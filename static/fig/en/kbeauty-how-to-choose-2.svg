<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-label="Choose by what you want the product to do" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>Choose by what you want the product to do</title>
<rect width="720" height="560" fill="#f4f0e6"/>
<rect x="160" y="24" width="400" height="48" rx="24" fill="#16151a"/><text x="360" y="54" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">What do you want the product to do?</text>
<line x1="360" y1="72" x2="360" y2="94" stroke="#c9c1b2" stroke-width="2"/><rect x="30" y="100" width="270" height="84" rx="8" fill="#e9e2d3"/><text x="165" y="148" font-size="15" fill="#16151a" font-weight="bold" text-anchor="middle">Block sun</text>
<line x1="300" y1="142" x2="390" y2="142" stroke="#16151a" stroke-width="2"/><polygon points="390,135 404,142 390,149" fill="#16151a"/><rect x="408" y="100" width="282" height="84" rx="8" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/><text x="549" y="138" font-size="15" fill="#16151a" font-weight="normal" text-anchor="middle"><tspan x="549" dy="0">SPF + PA on the box, plus</tspan><tspan x="549" dy="20">"기능성화장품"</tspan></text>
<rect x="30" y="208" width="270" height="84" rx="8" fill="#e9e2d3"/><text x="165" y="246" font-size="15" fill="#16151a" font-weight="bold" text-anchor="middle"><tspan x="165" dy="0">Brighten or</tspan><tspan x="165" dy="20">smooth wrinkles</tspan></text>
<line x1="300" y1="250" x2="390" y2="250" stroke="#16151a" stroke-width="2"/><polygon points="390,243 404,250 390,257" fill="#16151a"/><rect x="408" y="208" width="282" height="84" rx="8" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/><text x="549" y="246" font-size="15" fill="#16151a" font-weight="normal" text-anchor="middle"><tspan x="549" dy="0">"기능성화장품" and an efficacy</tspan><tspan x="549" dy="20">line naming that function</tspan></text>
<rect x="30" y="316" width="270" height="84" rx="8" fill="#e9e2d3"/><text x="165" y="354" font-size="15" fill="#16151a" font-weight="bold" text-anchor="middle"><tspan x="165" dy="0">Fragrance bothers</tspan><tspan x="165" dy="20">your skin</tspan></text>
<line x1="300" y1="358" x2="390" y2="358" stroke="#16151a" stroke-width="2"/><polygon points="390,351 404,358 390,365" fill="#16151a"/><rect x="408" y="316" width="282" height="84" rx="8" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/><text x="549" y="354" font-size="15" fill="#16151a" font-weight="normal" text-anchor="middle"><tspan x="549" dy="0">Read the ingredients for</tspan><tspan x="549" dy="20">"향료" and allergen names</tspan></text>
<rect x="30" y="424" width="270" height="84" rx="8" fill="#e9e2d3"/><text x="165" y="462" font-size="15" fill="#16151a" font-weight="bold" text-anchor="middle"><tspan x="165" dy="0">Ad says "regenerates",</tspan><tspan x="165" dy="20">"anti-inflammatory", "Botox"</tspan></text>
<line x1="300" y1="466" x2="390" y2="466" stroke="#b8392f" stroke-width="2"/><polygon points="390,459 404,466 390,473" fill="#b8392f"/><rect x="408" y="424" width="282" height="84" rx="8" fill="#ffffff" stroke="#b8392f" stroke-width="2"/><text x="549" y="462" font-size="15" fill="#b8392f" font-weight="bold" text-anchor="middle"><tspan x="549" dy="0">Skip it. A cosmetic is</tspan><tspan x="549" dy="20">not a medicine</tspan></text>
<text x="360" y="552" font-size="15" fill="#5f5b55" font-weight="normal" text-anchor="middle">Skin condition or prescription? Ask a doctor or pharmacist first.</text>
</svg>
