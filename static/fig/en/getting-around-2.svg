<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" role="img" aria-label="Climate Card short-term pass" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>Climate Card short-term pass</title>
<rect width="400" height="420" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">Climate Card short-term pass</text>
<rect x="16" y="54" width="368" height="94" rx="10" fill="#e9e2d3" stroke="none" stroke-width="0"/>
<text x="32" y="80" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">1 day ₩5,000 · 2 days ₩8,000</text>
<text x="32" y="102" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">3 days ₩10,000 · 5 days ₩15,000</text>
<text x="32" y="124" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">7 days ₩20,000 · card ₩3,000</text>
<rect x="16" y="160" width="368" height="116" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<text x="32" y="188" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">Covered</text>
<text x="32" y="214" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">✓ Seoul subway</text>
<text x="32" y="238" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">✓ Seoul city buses, night too</text>
<text x="32" y="262" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">✓ Getting off at Incheon Airport</text>
<rect x="16" y="286" width="368" height="116" rx="10" fill="#ffffff" stroke="#5f5b55" stroke-width="1.5"/>
<text x="32" y="314" font-size="17" font-weight="700" fill="#5f5b55" text-anchor="start">Not covered</text>
<text x="32" y="340" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">× Shinbundang Line, GTX</text>
<text x="32" y="364" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">× Red wide-area and airport buses</text>
<text x="32" y="388" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">× Stations outside Seoul</text>
</svg>
