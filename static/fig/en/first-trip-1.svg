<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 424" role="img" aria-label="Four days, one area a day" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>Four days, one area a day</title>
<rect width="400" height="424" fill="#f4f0e6"/>
<text x="20" y="42" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">Four days, one area a day</text>
<rect x="16" y="56" width="368" height="67" rx="10" fill="#e9e2d3"/>
<circle cx="48" cy="82" r="17" fill="#b8392f"/>
<text x="48" y="88" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="78" y="81" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Arrival</text>
<text x="78" y="103" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Hotel, eat nearby, sleep</text>
<rect x="16" y="133" width="368" height="89" rx="10" fill="#e9e2d3"/>
<circle cx="48" cy="159" r="17" fill="#b8392f"/>
<text x="48" y="165" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="78" y="158" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Palace and Bukchon</text>
<text x="78" y="180" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">One palace in the morning, the lanes</text>
<text x="78" y="202" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">after</text>
<rect x="16" y="232" width="368" height="67" rx="10" fill="#e9e2d3"/>
<circle cx="48" cy="258" r="17" fill="#b8392f"/>
<text x="48" y="264" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="78" y="257" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">One neighborhood</text>
<text x="78" y="279" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Myeongdong, Hongdae or Seongsu</text>
<rect x="16" y="309" width="368" height="89" rx="10" fill="#e9e2d3"/>
<circle cx="48" cy="335" r="17" fill="#b8392f"/>
<text x="48" y="341" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="78" y="334" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Slow morning, airport</text>
<text x="78" y="356" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">At Incheon 3 hours before</text>
<text x="78" y="378" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">departure</text>
</svg>
