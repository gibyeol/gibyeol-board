<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 463" role="img" aria-label="Left something in a taxi? Start from how you paid" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>Left something in a taxi? Start from how you paid</title>
<rect width="400" height="463" fill="#f4f0e6"/>
<text x="20" y="42" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">Left something in a taxi? Start</text>
<text x="20" y="68" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">from how you paid</text>
<rect x="16" y="82" width="368" height="89" rx="10" fill="#e9e2d3"/>
<rect x="30" y="92" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="114" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
<text x="78" y="107" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Booked with an app</text>
<text x="78" y="129" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Call or message the driver from the</text>
<text x="78" y="151" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">trip record</text>
<rect x="16" y="181" width="368" height="111" rx="10" fill="#e9e2d3"/>
<rect x="30" y="191" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="213" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
<text x="78" y="206" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Paid by transport card</text>
<text x="78" y="228" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">T-money 1644-1188, Cashbee</text>
<text x="78" y="250" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">1644-1472. Have the card number</text>
<text x="78" y="272" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">ready</text>
<rect x="16" y="302" width="368" height="89" rx="10" fill="#e9e2d3"/>
<rect x="30" y="312" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="334" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
<text x="78" y="327" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Paid cash, no app</text>
<text x="78" y="349" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Note the plate, places and time. Ask</text>
<text x="78" y="371" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">1330 for help</text>
<text x="20" y="419" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Taxi companies keep items about a week,</text>
<text x="20" y="441" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">then hand them to the police.</text>
</svg>
