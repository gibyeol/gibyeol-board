<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 386" role="img" aria-label="Two cards, two jobs" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>Two cards, two jobs</title>
<rect width="400" height="386" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">Two cards, two jobs</text>
<rect x="16" y="54" width="368" height="136" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="72" width="64" height="42" rx="6" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<rect x="36" y="82" width="14" height="11" rx="2" fill="#e9e2d3" stroke="#16151a" stroke-width="1.2"/>
<line x1="36" y1="104" x2="80" y2="104" stroke="#c9c1b2" stroke-width="3"/>
<text x="108" y="84" font-size="18" font-weight="700" fill="#b8392f" text-anchor="start">T-money</text>
<text x="108" y="108" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">Tap for subway, buses and</text>
<text x="108" y="130" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">the AREX all-stop</text>
<text x="108" y="152" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">Sold at airport card machines</text>
<text x="108" y="174" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">and convenience stores</text>
<rect x="16" y="202" width="368" height="114" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="220" width="64" height="42" rx="6" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<rect x="36" y="230" width="14" height="11" rx="2" fill="#e9e2d3" stroke="#16151a" stroke-width="1.2"/>
<line x1="36" y1="252" x2="80" y2="252" stroke="#c9c1b2" stroke-width="3"/>
<text x="108" y="232" font-size="18" font-weight="700" fill="#b8392f" text-anchor="start">WOWPASS</text>
<text x="108" y="256" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">T-money inside for transport</text>
<text x="108" y="278" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">Exchange money onto the card</text>
<text x="108" y="300" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">Pay in shops with the card</text>
<text x="20" y="346" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">T-money can also be pre-ordered</text>
<text x="20" y="368" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">for pick-up at the airport</text>
</svg>
