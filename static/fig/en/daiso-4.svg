<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 633" role="img" aria-label="What visitors buy at Daiso, and who it is for" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>What visitors buy at Daiso, and who it is for</title>
<rect width="400" height="633" rx="16" fill="#f4f0e6"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16151a"/></marker></defs>
<text x="20" y="39" font-size="21" fill="#16151a" font-weight="bold" text-anchor="start">What visitors buy at Daiso, and</text>
<text x="20" y="68" font-size="21" fill="#16151a" font-weight="bold" text-anchor="start">who it is for</text>
<rect x="16" y="90" width="368" height="141" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<rect x="44" y="138" width="28" height="40" rx="6" fill="#ffffff" stroke="#16151a" stroke-width="2.5"/><rect x="50" y="128" width="16" height="11" rx="2" fill="#b8392f"/><line x1="51" y1="156" x2="65" y2="156" stroke="#c9c1b2" stroke-width="3"/>
<text x="100" y="120" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">Budget skincare</text>
<text x="100" y="143" font-size="16" fill="#5f5b55" text-anchor="start">About 170 beauty brands (2026)</text>
<text x="100" y="165" font-size="16" fill="#5f5b55" text-anchor="start">Often smaller sizes or Daiso-only</text>
<text x="100" y="187" font-size="16" fill="#5f5b55" text-anchor="start">lines</text>
<text x="100" y="213" font-size="16" fill="#b8392f" font-weight="bold" text-anchor="start">For: yourself</text>
<rect x="16" y="243" width="368" height="163" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<path d="M38,300 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5 l5,-5 l5,5 v46 h-40 z" fill="#e9e2d3" stroke="#16151a" stroke-width="2.5" stroke-linejoin="round"/><circle cx="58" cy="326" r="9" fill="#b8392f"/>
<text x="100" y="273" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">Snacks and small souvenirs</text>
<text x="100" y="296" font-size="16" fill="#5f5b55" text-anchor="start">Most snacks about</text>
<text x="100" y="318" font-size="16" fill="#5f5b55" text-anchor="start">₩1,000–₩2,000</text>
<text x="100" y="340" font-size="16" fill="#5f5b55" text-anchor="start">Character goods, photocard</text>
<text x="100" y="362" font-size="16" fill="#5f5b55" text-anchor="start">accessories</text>
<text x="100" y="388" font-size="16" fill="#b8392f" font-weight="bold" text-anchor="start">For: sharing; a K-pop fan</text>
<rect x="16" y="418" width="368" height="119" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="2"/>
<rect x="40" y="464" width="36" height="30" rx="6" fill="#ffffff" stroke="#16151a" stroke-width="2.5"/><line x1="51" y1="464" x2="51" y2="452" stroke="#16151a" stroke-width="4"/><line x1="65" y1="464" x2="65" y2="452" stroke="#16151a" stroke-width="4"/><path d="M58,494 q0,12 12,14" fill="none" stroke="#b8392f" stroke-width="3"/>
<text x="100" y="448" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">Trip fixes</text>
<text x="100" y="471" font-size="16" fill="#5f5b55" text-anchor="start">Multi-adaptors, luggage scales,</text>
<text x="100" y="493" font-size="16" fill="#5f5b55" text-anchor="start">phone chargers</text>
<text x="100" y="519" font-size="16" fill="#b8392f" font-weight="bold" text-anchor="start">For: the trip itself</text>
<rect x="16" y="549" width="368" height="66" rx="12" fill="#e9e2d3"/>
<text x="30" y="576" font-size="16" fill="#16151a" text-anchor="start">Who it is for: our call. Prices: check the</text>
<text x="30" y="598" font-size="16" fill="#16151a" text-anchor="start">tag.</text>
</svg>
