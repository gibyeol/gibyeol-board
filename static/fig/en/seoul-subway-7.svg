<text x="62" y="220" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">Priority seats</text>
<text x="62" y="242" font-size="16" fill="#5f5b55" text-anchor="start">Both ends of the car: older, disabled</text>
<text x="62" y="264" font-size="16" fill="#5f5b55" text-anchor="start">and injured passengers, pregnant</text>
<text x="62" y="286" font-size="16" fill="#5f5b55" text-anchor="start">women</text>
