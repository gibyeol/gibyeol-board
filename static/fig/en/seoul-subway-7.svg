<text x="62" y="337" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">Pink seats</text>
<text x="62" y="360" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">Two per car</text>
<text x="62" y="382" font-size="16" fill="#5f5b55" text-anchor="start">For pregnant women. Leave them empty.</text>
<rect x="16" y="410" width="368" height="66" rx="12" fill="#e9e2d3"/>
<text x="200" y="437" font-size="16" fill="#16151a" text-anchor="middle">Early pregnancy doesn't show: some women</text>
