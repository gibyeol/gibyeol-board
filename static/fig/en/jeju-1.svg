<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 437" role="img" aria-label="Incheon to Jeju: two ways" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>Incheon to Jeju: two ways</title>
<rect width="400" height="437" fill="#f4f0e6"/>
<text x="20" y="42" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">Incheon to Jeju: two ways</text>
<rect x="16" y="56" width="368" height="89" rx="10" fill="#e9e2d3"/>
<rect x="30" y="66" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="88" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
<text x="78" y="81" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Through Gimpo, any day</text>
<text x="78" y="103" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">AREX train from Incheon to Gimpo,</text>
<text x="78" y="125" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">then a domestic flight</text>
<rect x="16" y="155" width="368" height="89" rx="10" fill="#e9e2d3"/>
<rect x="30" y="165" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="187" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
<text x="78" y="180" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Direct, three days a week</text>
<text x="78" y="202" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Jeju Air Incheon–Jeju: Mon, Wed,</text>
<text x="78" y="224" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Fri, through 27 March 2027</text>
<rect x="16" y="254" width="368" height="89" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<rect x="30" y="264" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="286" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
<text x="78" y="279" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">Book early</text>
<text x="78" y="301" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">Gimpo–Jeju is the world’s busiest</text>
<text x="78" y="323" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">route, but seats fell in 2026</text>
<text x="20" y="371" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Domestic flight: bring your passport. Korean</text>
<text x="20" y="393" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Air closes check-in 30 min before</text>
<text x="20" y="415" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">departure.</text>
</svg>
