<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="US allowance per person" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>US allowance per person</title>
<rect width="400" height="400" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">US allowance per person</text>
<rect x="16" y="54" width="368" height="96" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="32" y="90" font-size="24" font-weight="700" fill="#b8392f" text-anchor="start">$800</text>
<text x="210" y="88" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Goods</text>
<text x="32" y="128" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Abroad 48 h+, not used in 31 days</text>
<rect x="16" y="158" width="368" height="96" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="32" y="194" font-size="24" font-weight="700" fill="#b8392f" text-anchor="start">1 L</text>
<text x="210" y="192" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Alcohol</text>
<text x="32" y="232" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Age 21+, personal use</text>
<rect x="16" y="262" width="368" height="96" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="32" y="298" font-size="24" font-weight="700" fill="#b8392f" text-anchor="start">200 + 100</text>
<text x="210" y="296" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Cigarettes + cigars</text>
<text x="32" y="336" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Age 21+</text>
<text x="20" y="382" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">Duty-free shop buys count too.</text>
</svg>
