<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 334" role="img" aria-label="US allowance per person" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>US allowance per person</title>
<rect width="400" height="334" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">US allowance per person</text>
<rect x="16" y="54" width="368" height="74" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="32" y="100" font-size="24" font-weight="700" fill="#b8392f" text-anchor="start">$800</text>
<text x="200" y="85" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Goods</text>
<text x="200" y="109" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Abroad 48 h+, not used in 31 days</text>
<rect x="16" y="136" width="368" height="74" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="32" y="182" font-size="24" font-weight="700" fill="#b8392f" text-anchor="start">1 L</text>
