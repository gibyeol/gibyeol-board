<text x="200" y="191" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Age 21+, personal use</text>
<rect x="16" y="218" width="368" height="74" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="32" y="264" font-size="24" font-weight="700" fill="#b8392f" text-anchor="start">200 + 100</text>
