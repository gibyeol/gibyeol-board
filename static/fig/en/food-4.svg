<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 486" role="img" aria-label="Ordering on Baemin from your hotel" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>Ordering on Baemin from your hotel</title>
<rect width="400" height="486" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">Ordering on Baemin</text>
<text x="20" y="60" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">from your hotel</text>
<rect x="20" y="86" width="360" height="88" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="36" y="116" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Language</text>
<text x="36" y="140" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">English, Chinese, Japanese:</text>
<text x="36" y="162" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">follows your phone's setting</text>
<rect x="20" y="184" width="360" height="88" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="36" y="214" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Pay</text>
<text x="36" y="238" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Foreign cards, Apple Pay,</text>
<text x="36" y="260" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">WeChat Pay, Alipay+</text>
<rect x="20" y="282" width="360" height="88" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="36" y="312" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Verify</text>
<text x="36" y="336" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">A text to your overseas number,</text>
<text x="36" y="358" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">no Korean phone needed</text>
<rect x="20" y="380" width="360" height="88" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="36" y="410" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Before you order</text>
<text x="36" y="434" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Copy the hotel's Korean address;</text>
<text x="36" y="456" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">ask where riders hand over food</text>
</svg>
