<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 582" role="img" aria-label="The medicine shelf at a 24-hour convenience store" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>The medicine shelf at a 24-hour convenience store</title>
<rect width="400" height="582" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">The medicine shelf at a 24-hour</text>
<text x="20" y="60" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">convenience store</text>
<rect x="16" y="84" width="368" height="210" rx="8" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="98" width="166" height="84" rx="8" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="42" y="110" width="26" height="30" rx="4" fill="#b8392f" stroke="none" stroke-width="1"/>
<rect x="76" y="110" width="26" height="30" rx="4" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="1"/>
<rect x="110" y="110" width="26" height="30" rx="4" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="1"/>
<text x="42" y="166" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">Fever &amp; pain</text>
<rect x="206" y="98" width="166" height="84" rx="8" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="220" y="110" width="26" height="30" rx="4" fill="#b8392f" stroke="none" stroke-width="1"/>
<rect x="254" y="110" width="26" height="30" rx="4" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="1"/>
<rect x="288" y="110" width="26" height="30" rx="4" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="1"/>
<text x="220" y="166" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">Cold</text>
<rect x="28" y="196" width="166" height="84" rx="8" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="42" y="208" width="26" height="30" rx="4" fill="#b8392f" stroke="none" stroke-width="1"/>
<rect x="76" y="208" width="26" height="30" rx="4" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="1"/>
<rect x="110" y="208" width="26" height="30" rx="4" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="1"/>
<text x="42" y="264" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">Digestion</text>
<rect x="206" y="196" width="166" height="84" rx="8" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="220" y="208" width="26" height="30" rx="4" fill="#b8392f" stroke="none" stroke-width="1"/>
<rect x="254" y="208" width="26" height="30" rx="4" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="1"/>
<rect x="288" y="208" width="26" height="30" rx="4" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="1"/>
<text x="220" y="264" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">Pain patches</text>
<text x="20" y="316" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">11 products in practice (13 designated, 2</text>
<text x="20" y="338" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">no longer made)</text>
<path d="M23,365 L28,370 L38,358" fill="none" stroke="#16151a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="52" y="374" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">Only registered stores open 24 hours,</text>
<text x="52" y="396" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">all year</text>
<path d="M23,419 L28,424 L38,412" fill="none" stroke="#16151a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="52" y="428" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">One pack per product per purchase</text>
<path d="M24,444 L36,456 M36,444 L24,456" stroke="#b8392f" stroke-width="3" stroke-linecap="round"/>
<text x="52" y="460" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">No pharmacist to ask</text>
<path d="M24,476 L36,488 M36,476 L24,488" stroke="#b8392f" stroke-width="3" stroke-linecap="round"/>
<text x="52" y="492" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">Not on the list: diarrhea medicine, burn</text>
<text x="52" y="514" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">cream</text>
<rect x="16" y="526" width="368" height="38" rx="10" fill="#e9e2d3" stroke="#b8392f" stroke-width="2"/>
<text x="30" y="552" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">Symptoms continue? See a clinic.</text>
</svg>
