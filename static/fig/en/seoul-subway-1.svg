<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-label="How to pay for the Seoul subway" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>How to pay for the Seoul subway</title>
<rect width="720" height="600" rx="16" fill="#f4f0e6"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16151a"/></marker></defs>

<text x="360" y="40" font-size="20" fill="#16151a" text-anchor="middle" font-weight="bold" dominant-baseline="middle">How to pay for the Seoul subway</text>
<rect x="30" y="80" width="330" height="110" rx="12" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="2"/>
<text x="195" y="124" font-size="17" fill="#16151a" text-anchor="middle" font-weight="normal" dominant-baseline="middle">3+ rides a day for 3+ days,</text>
<text x="195" y="146" font-size="17" fill="#16151a" text-anchor="middle" font-weight="normal" dominant-baseline="middle">all inside Seoul?</text>
<line x1="360" y1="135" x2="410" y2="135" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="385" y="118" font-size="15" fill="#b8392f" text-anchor="middle" font-weight="bold" dominant-baseline="middle">Yes</text>
<rect x="410" y="80" width="280" height="110" rx="12" fill="#ffffff" stroke="#b8392f" stroke-width="3"/>
<text x="550" y="124" font-size="17" fill="#16151a" text-anchor="middle" font-weight="bold" dominant-baseline="middle">Climate Card</text>
<text x="550" y="146" font-size="17" fill="#16151a" text-anchor="middle" font-weight="bold" dominant-baseline="middle">short-term pass</text>
<line x1="195" y1="190" x2="195" y2="240" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="215" y="215" font-size="15" fill="#5f5b55" text-anchor="start" font-weight="bold" dominant-baseline="middle">No</text>
<rect x="30" y="240" width="330" height="110" rx="12" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="2"/>
<text x="195" y="284" font-size="17" fill="#16151a" text-anchor="middle" font-weight="normal" dominant-baseline="middle">Want one card for cash</text>
<text x="195" y="306" font-size="17" fill="#16151a" text-anchor="middle" font-weight="normal" dominant-baseline="middle">swaps and card payments too?</text>
<line x1="360" y1="295" x2="410" y2="295" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="385" y="278" font-size="15" fill="#b8392f" text-anchor="middle" font-weight="bold" dominant-baseline="middle">Yes</text>
<rect x="410" y="240" width="280" height="110" rx="12" fill="#ffffff" stroke="#b8392f" stroke-width="3"/>
<text x="550" y="284" font-size="17" fill="#16151a" text-anchor="middle" font-weight="bold" dominant-baseline="middle">WOWPASS</text>
<text x="550" y="306" font-size="17" fill="#16151a" text-anchor="middle" font-weight="bold" dominant-baseline="middle">(T-money inside)</text>
<line x1="195" y1="350" x2="195" y2="400" stroke="#16151a" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="215" y="375" font-size="15" fill="#5f5b55" text-anchor="start" font-weight="bold" dominant-baseline="middle">No</text>
<rect x="30" y="400" width="660" height="70" rx="12" fill="#ffffff" stroke="#b8392f" stroke-width="3"/>
<text x="360" y="435" font-size="18" fill="#16151a" text-anchor="middle" font-weight="bold" dominant-baseline="middle">T-money</text>
<line x1="30" y1="495" x2="690" y2="495" stroke="#c9c1b2" stroke-width="2" stroke-dasharray="6 6"/>
<text x="360" y="535" font-size="16" fill="#5f5b55" text-anchor="middle" font-weight="normal" dominant-baseline="middle">No card and no cash yet? Single ticket at a new machine (Visa/Mastercard):</text>
<text x="360" y="555" font-size="16" fill="#5f5b55" text-anchor="middle" font-weight="normal" dominant-baseline="middle">+₩100 a ride, ₩500 deposit, no bus transfer</text>
</svg>
