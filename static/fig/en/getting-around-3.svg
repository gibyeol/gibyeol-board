<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 346" role="img" aria-label="The subway in three taps" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>The subway in three taps</title>
<rect width="400" height="346" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">The subway in three taps</text>
<rect x="16" y="54" width="368" height="62" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="30" y="65.0" width="10" height="40" rx="2" fill="#16151a" stroke="none" stroke-width="0"/>
<rect x="64" y="65.0" width="10" height="40" rx="2" fill="#16151a" stroke="none" stroke-width="0"/>
<rect x="42" y="75.0" width="20" height="12" rx="3" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="92" y="82" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">1. Tap in</text>
<text x="92" y="106" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">The reader shows your balance</text>
<rect x="16" y="126" width="368" height="84" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<path d="M30,168.0 h44 M62,158.0 l12,10 l-12,10" stroke="#16151a" stroke-width="3" fill="none"/>
<text x="92" y="154" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">2. Change lines inside</text>
<text x="92" y="178" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Follow the line number and</text>
<text x="92" y="200" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">colour; no extra gate</text>
<rect x="16" y="220" width="368" height="84" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="30" y="242.0" width="10" height="40" rx="2" fill="#16151a" stroke="none" stroke-width="0"/>
<rect x="64" y="242.0" width="10" height="40" rx="2" fill="#16151a" stroke="none" stroke-width="0"/>
<rect x="42" y="252.0" width="20" height="12" rx="3" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="92" y="248" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">3. Tap out</text>
<text x="92" y="272" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">The fare is worked out</text>
<text x="92" y="294" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">by distance</text>
<text x="20" y="328" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Single ticket: get the ₩500 deposit back</text>
</svg>
