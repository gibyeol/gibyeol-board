<text x="108" y="136" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">₩1,500</text>
<rect x="16" y="163" width="368" height="114" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="202" width="68" height="36" rx="12" fill="#3d7a4a"/>
<text x="62" y="226" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">Green</text>
<text x="108" y="192" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">Branch / village</text>
<text x="108" y="215" font-size="16" fill="#5f5b55" text-anchor="start">Links neighbourhoods to trunk</text>
<text x="108" y="237" font-size="16" fill="#5f5b55" text-anchor="start">buses and the subway</text>
<text x="108" y="260" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">₩1,500 (village ₩1,200)</text>
<rect x="16" y="287" width="368" height="92" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="315" width="68" height="36" rx="12" fill="#d9a521"/>
<text x="62" y="339" font-size="17" fill="#16151a" font-weight="bold" text-anchor="middle">Yellow</text>
<text x="108" y="316" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">Circular</text>
<text x="108" y="339" font-size="16" fill="#5f5b55" text-anchor="start">Loops in the centre</text>
<text x="108" y="362" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">₩1,400</text>
<rect x="16" y="389" width="368" height="92" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="417" width="68" height="36" rx="12" fill="#b8392f"/>
<text x="62" y="441" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">Red</text>
<text x="108" y="418" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">Wide-area</text>
<text x="108" y="441" font-size="16" fill="#5f5b55" text-anchor="start">Seoul ↔ wider metro area</text>
<text x="108" y="464" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">₩3,000</text>
<rect x="16" y="491" width="368" height="92" rx="12" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="519" width="68" height="36" rx="12" fill="#16151a"/>
<text x="62" y="543" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">N…</text>
<text x="108" y="520" font-size="18" fill="#16151a" font-weight="bold" text-anchor="start">Night bus</text>
<text x="108" y="543" font-size="16" fill="#5f5b55" text-anchor="start">Late night, after the subway</text>
<text x="108" y="566" font-size="17" fill="#16151a" font-weight="bold" text-anchor="start">₩2,500</text>
<text x="20" y="611" font-size="16" fill="#5f5b55" text-anchor="start">Adult fares with a transport card</text>
