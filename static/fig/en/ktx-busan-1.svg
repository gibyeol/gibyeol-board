<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 474" role="img" aria-label="Booking a KTX" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>Booking a KTX</title>
<rect width="400" height="474" fill="#f4f0e6"/>
<text x="20" y="42" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">Booking a KTX</text>
<rect x="16" y="56" width="368" height="67" rx="10" fill="#e9e2d3"/>
<rect x="30" y="66" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="88" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="78" y="81" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Two months before</text>
<text x="78" y="103" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Sales open (since 1 October 2026)</text>
<path d="M44 119 V141" stroke="#5f5b55" stroke-width="2"/>
<path d="M38 135 L44 143 L50 135" fill="none" stroke="#5f5b55" stroke-width="2"/>
<rect x="16" y="147" width="368" height="111" rx="10" fill="#e9e2d3"/>
<rect x="30" y="157" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="179" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="78" y="172" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Where to buy</text>
<text x="78" y="194" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Korail+ app, letskorail.com, Klook,</text>
<text x="78" y="216" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">or a station machine that takes</text>
<text x="78" y="238" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">overseas cards</text>
<path d="M44 254 V276" stroke="#5f5b55" stroke-width="2"/>
<path d="M38 270 L44 278 L50 270" fill="none" stroke="#5f5b55" stroke-width="2"/>
<rect x="16" y="282" width="368" height="89" rx="10" fill="#e9e2d3"/>
<rect x="30" y="292" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="314" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="78" y="307" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Pick a seat direction</text>
<text x="78" y="329" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Depending on the train, seats face</text>
<text x="78" y="351" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">forward or backward</text>
<rect x="16" y="381" width="368" height="67" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<rect x="30" y="391" width="36" height="32" rx="8" fill="#b8392f"/>
<text x="48.0" y="413" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
<text x="78" y="406" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">Holiday trains: separate sale</text>
<text x="78" y="428" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">Seollal 2027 holiday: 6–9 February</text>
</svg>
