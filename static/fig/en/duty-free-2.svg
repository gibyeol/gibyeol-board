<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 406" role="img" aria-label="Incheon pickup counters" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>Incheon pickup counters</title>
<rect width="400" height="406" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">Incheon pickup counters</text>
<rect x="16" y="54" width="368" height="66" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="16" y="54" width="10" height="66" rx="3" fill="#16151a" stroke="none" stroke-width="0"/>
<text x="40" y="81" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">T1 West · 4F</text>
<text x="40" y="105" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Across from gate 43</text>
<rect x="16" y="128" width="368" height="66" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="16" y="128" width="10" height="66" rx="3" fill="#16151a" stroke="none" stroke-width="0"/>
