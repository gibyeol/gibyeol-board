<text x="20" y="366" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Your voucher names the counter.</text>
<text x="20" y="388" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Hyundai: come at least 1 hour before.</text>
