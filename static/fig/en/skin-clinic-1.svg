<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 562" role="img" aria-label="Check the clinic before you book" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>Check the clinic before you book</title>
<rect width="400" height="562" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">Check the clinic before you book</text>
<rect x="16" y="58" width="368" height="72" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="70" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="94" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="80" y="92" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Copy the clinic's Korean name</text>
<text x="80" y="114" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">The registry site is in Korean</text>
<rect x="16" y="140" width="368" height="116" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="152" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="176" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="80" y="174" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Search the Medical Korea</text>
<text x="80" y="196" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">registry</text>
<text x="80" y="218" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">medicalkorea.or.kr: by name, type</text>
<text x="80" y="240" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">and region</text>
<rect x="16" y="266" width="368" height="94" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="278" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="302" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="80" y="300" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Is it registered and active?</text>
<text x="80" y="322" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Check the agency or booking app</text>
<text x="80" y="344" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">the same way</text>
<rect x="16" y="374" width="368" height="120" rx="10" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="32" y="390" width="88" height="88" rx="2" fill="#ffffff" stroke="#16151a" stroke-width="2"/>
<line x1="46" y1="414" x2="106" y2="414" stroke="#c9c1b2" stroke-width="3"/>
<line x1="46" y1="428" x2="106" y2="428" stroke="#c9c1b2" stroke-width="3"/>
<line x1="46" y1="442" x2="106" y2="442" stroke="#c9c1b2" stroke-width="3"/>
<line x1="46" y1="456" x2="106" y2="456" stroke="#c9c1b2" stroke-width="3"/>
<circle cx="96" cy="464" r="8" fill="#b8392f" stroke="#b8392f" stroke-width="1"/>
<text x="134" y="404" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Registration certificate</text>
<text x="134" y="426" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Must be posted where anyone</text>
<text x="134" y="448" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">can see it</text>
<rect x="16" y="506" width="368" height="38" rx="10" fill="#e9e2d3" stroke="#c9c1b2" stroke-width="1.5"/>
<text x="30" y="532" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">Registration is not a quality rating.</text>
</svg>
