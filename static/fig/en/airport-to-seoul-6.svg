<text x="20" y="396" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Mid-size, fixed fare, tolls included</text>
<text x="20" y="418" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Large and deluxe: ₩100,000–140,000</text>
