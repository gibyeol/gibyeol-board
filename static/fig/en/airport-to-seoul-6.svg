<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 436" role="img" aria-label="International Taxi, Incheon Airport to Seoul" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>International Taxi, Incheon Airport to Seoul</title>
<rect width="400" height="436" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">International Taxi,</text>
<text x="20" y="60" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">Incheon Airport to Seoul</text>
<text x="20" y="98" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">Gangseo</text>
<rect x="20" y="108" width="162.10526315789474" height="20" rx="4" fill="#e9e2d3" stroke="none" stroke-width="0"/>
