<text x="20" y="218" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">Jung (Myeongdong), Jongno…</text>
<rect x="20" y="228" width="196.8421052631579" height="20" rx="4" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="226.8421052631579" y="244" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">₩85,000</text>
<text x="20" y="278" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">Gangnam, Seocho…</text>
<rect x="20" y="288" width="208.42105263157896" height="20" rx="4" fill="#e9e2d3" stroke="none" stroke-width="0"/>
