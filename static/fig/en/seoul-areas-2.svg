<text x="36" y="438" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">6001</text>
<text x="92" y="438" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">Myeongdong, Dongdaemun</text>
