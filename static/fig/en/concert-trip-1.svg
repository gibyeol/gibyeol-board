<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 724" role="img" aria-label="Buying a K-pop ticket from abroad" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>Buying a K-pop ticket from abroad</title>
<rect width="400" height="724" fill="#f4f0e6"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">Buying a K-pop ticket from</text>
<text x="20" y="60" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">abroad</text>
<rect x="16" y="84" width="368" height="94" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="96" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="120" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="80" y="118" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Read the agency's notice</text>
<text x="80" y="140" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">It names the one site that sells</text>
<text x="80" y="162" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">the show</text>
<line x1="48" y1="179" x2="48" y2="189" stroke="#16151a" stroke-width="2.5"/>
<path d="M41,187 L48,197 L55,187 z" fill="#16151a"/>
<rect x="16" y="198" width="368" height="116" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="210" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="234" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="80" y="232" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Make an account on the global</text>
<text x="80" y="254" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">site</text>
<text x="80" y="276" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Often NOL World (world.nol.com).</text>
<text x="80" y="298" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Separate from a Korean account</text>
<line x1="48" y1="315" x2="48" y2="325" stroke="#16151a" stroke-width="2.5"/>
<path d="M41,323 L48,333 L55,323 z" fill="#16151a"/>
<rect x="16" y="334" width="368" height="94" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="346" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="370" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="80" y="368" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Verify your passport</text>
<text x="80" y="390" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">&quot;Verified Member Only&quot; listings</text>
<text x="80" y="412" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">need this first</text>
<line x1="48" y1="429" x2="48" y2="439" stroke="#16151a" stroke-width="2.5"/>
<path d="M41,437 L48,447 L55,437 z" fill="#16151a"/>
<rect x="16" y="448" width="368" height="94" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="460" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="484" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="80" y="482" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Book in your passport name</text>
<text x="80" y="504" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Exact romanized spelling. Limits</text>
<text x="80" y="526" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">differ by show</text>
<line x1="48" y1="543" x2="48" y2="553" stroke="#16151a" stroke-width="2.5"/>
<path d="M41,551 L48,561 L55,551 z" fill="#16151a"/>
<rect x="16" y="562" width="368" height="94" rx="10" fill="#ffffff" stroke="#c9c1b2" stroke-width="1.5"/>
<rect x="28" y="574" width="40" height="36" rx="8" fill="#b8392f" stroke="none" stroke-width="0"/>
<text x="48.0" y="598" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="80" y="596" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Pick up on site</text>
<text x="80" y="618" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Physical ID + booking confirmation.</text>
<text x="80" y="640" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">The booker only</text>
<rect x="16" y="668" width="368" height="38" rx="10" fill="#e9e2d3" stroke="#b8392f" stroke-width="2"/>
<text x="30" y="694" font-size="16" font-weight="700" fill="#b8392f" text-anchor="start">Resale ticket offered? Walk away.</text>
</svg>
