<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 462" role="img" aria-label="Arrival card or K-ETA?" font-family="system-ui, -apple-system, &quot;Noto Sans KR&quot;, &quot;Noto Sans JP&quot;, &quot;Noto Sans TC&quot;, sans-serif">
<title>Arrival card or K-ETA?</title>
<rect width="400" height="462" fill="#f4f0e6"/>
<text x="20" y="42" font-size="20" font-weight="700" fill="#16151a" text-anchor="start">Arrival card or K-ETA?</text>
<rect x="16" y="56" width="368" height="91" rx="10" fill="#e9e2d3"/>
<text x="30" y="81" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Do you hold a valid K-ETA?</text>
<rect x="26" y="95" width="348" height="38" rx="8" fill="#ffffff"/>
<rect x="36" y="105" width="54.473600000000005" height="26" rx="13" fill="#b8392f"/>
<text x="63.2368" y="123" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Yes</text>
<text x="100.4736" y="117" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">No arrival card needed</text>
<path d="M44 149 V171" stroke="#5f5b55" stroke-width="2"/>
<path d="M38 165 L44 173 L50 165" fill="none" stroke="#5f5b55" stroke-width="2"/>
<text x="60" y="167" font-size="16" font-weight="700" fill="#5f5b55" text-anchor="start">No</text>
<rect x="16" y="179" width="368" height="158" rx="10" fill="#e9e2d3"/>
<text x="30" y="204" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">Is your passport exempt from</text>
<text x="30" y="227" font-size="17" font-weight="700" fill="#16151a" text-anchor="start">K-ETA? (to 31 Dec 2027)</text>
<rect x="26" y="241" width="348" height="82" rx="8" fill="#ffffff"/>
<rect x="36" y="251" width="54.473600000000005" height="26" rx="13" fill="#b8392f"/>
<text x="63.2368" y="269" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Yes</text>
<text x="100.4736" y="263" font-size="16" font-weight="700" fill="#16151a" text-anchor="start">File the e-Arrival Card</text>
<text x="100.4736" y="285" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">Free, within 3 days before</text>
<text x="100.4736" y="307" font-size="16" font-weight="400" fill="#5f5b55" text-anchor="start">landing</text>
<path d="M44 339 V361" stroke="#5f5b55" stroke-width="2"/>
<path d="M38 355 L44 363 L50 355" fill="none" stroke="#5f5b55" stroke-width="2"/>
<text x="60" y="357" font-size="16" font-weight="700" fill="#5f5b55" text-anchor="start">No</text>
<rect x="16" y="369" width="368" height="67" rx="10" fill="#ffffff" stroke="#b8392f" stroke-width="2"/>
<text x="30" y="394" font-size="17" font-weight="700" fill="#b8392f" text-anchor="start">Apply for a K-ETA first</text>
<text x="30" y="416" font-size="16" font-weight="400" fill="#16151a" text-anchor="start">₩10,000, before you book</text>
</svg>
